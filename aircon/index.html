<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="エアコン">
<meta name="theme-color" content="#f4f1ea">
<title>エアコン リモコン ごっこ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: wall with the air conditioner on top, the remote below (or beside it on wide screens). Single bright room look. */
:root{
  --wall:#f4f1ea; --wall2:#e9e3d6; --ink:#2b2f3a; --paper:#fff; --accent:#ffcc33;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --lcd:"Share Tech Mono",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--wall);color:var(--ink);font-family:var(--font)}
body{display:flex;flex-direction:column;overflow-x:hidden}
.brands{display:flex;gap:6px;overflow-x:auto;padding:6px max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px));flex:none}
.cats{display:flex;gap:6px;overflow-x:auto;padding:calc(env(safe-area-inset-top,0px) + 8px) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));flex:none}
.ctab{font:inherit;display:flex;align-items:center;gap:4px;border:2px solid var(--ink);background:#fff;border-radius:999px;padding:4px 12px 4px 8px;cursor:pointer;white-space:nowrap;font-weight:800;font-size:13px;flex:none}
.ctab.sel{background:var(--accent)}
.ctab:focus-visible{outline:4px solid #2b7bff}
.piano{min-height:70px;border-radius:6px;box-shadow:0 6px 0 #b5bac2,0 8px 8px rgba(0,0,0,.2),inset 0 1px 0 #fff}
.piano.down{transform:translateY(5px);box-shadow:0 1px 0 #b5bac2,inset 0 3px 4px rgba(0,0,0,.18);background:linear-gradient(#e9ebee,#d8dbdf)}
.dialKnob{--a:-90deg;position:relative;justify-self:center;width:150px;height:150px;border-radius:50%;cursor:pointer;border:1px solid rgba(0,0,0,.3);
  background:radial-gradient(circle at 40% 35%,#ffffff,#e4e6e9 55%,#c3c7cc);box-shadow:0 6px 0 #aeb3ba,0 10px 14px rgba(0,0,0,.25),inset 0 2px 1px #fff}
.dialKnob .mark{position:absolute;left:50%;top:50%;width:6px;height:56px;margin:-56px 0 0 -3px;border-radius:3px;background:#d7262e;transform-origin:50% 100%;transform:rotate(var(--a));transition:transform .3s}
.dialKnob .lbl{position:absolute;font-weight:800;font-size:15px;color:#555}
.dialKnob .l0{left:8px;top:66px}.dialKnob .l1{left:30px;top:16px}.dialKnob .l2{right:30px;top:16px}.dialKnob .l3{right:8px;top:66px}
.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.brand{font:inherit;border:3px solid var(--ink);background:#fff;border-radius:14px;padding:6px 10px;cursor:pointer;white-space:nowrap;font-weight:800;font-size:14px;box-shadow:0 3px 0 var(--ink);flex:none}
.brand.sel{transform:translateY(2px);box-shadow:0 1px 0 var(--ink);outline:3px solid var(--accent)}
.brand:focus-visible{outline:4px solid #2b7bff}
.stage{flex:1;display:flex;gap:14px;padding:6px max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(10px,env(safe-area-inset-left,0px));min-height:0}
@media (orientation:portrait){.stage{flex-direction:column}}
.room{position:relative;flex:1.3;min-width:0;min-height:260px;border-radius:18px;overflow:hidden;
  background:linear-gradient(var(--wall) 0 70%,#d9c3a0 70%);border:3px solid var(--ink)}
.room .tint{position:absolute;inset:0;pointer-events:none;transition:background 2s;z-index:1}
.room canvas.gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.room svg.ac{position:absolute;left:6%;width:88%;top:6%;height:auto;max-height:42%}
.room canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.thermo{z-index:2;position:absolute;right:10px;bottom:10px;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:4px 10px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.sofa{position:absolute;left:8%;bottom:6%;width:34%;height:20%;background:#7aa58a;border:3px solid var(--ink);border-radius:14px 14px 6px 6px}
.plant{position:absolute;right:8%;bottom:6%;width:9%;height:26%}
.remoteWrap{flex:1;display:flex;justify-content:center;align-items:flex-start;min-width:0;overflow:auto;padding-top:4px}
.pin{position:absolute;left:24%;bottom:7%;width:9%;min-width:44px;height:auto;overflow:visible}
.catWrap{position:absolute;left:48%;bottom:4%;width:26%;min-width:110px;transform-origin:50% 100%}
.cat{width:100%;height:auto;display:block;overflow:visible}
.bubble{z-index:2;pointer-events:none;position:absolute;transform:translate(-50%,-100%);background:#fff;border:3px solid var(--ink);border-radius:14px;padding:2px 10px;font-weight:800;font-size:clamp(12px,3.2vw,16px);white-space:nowrap}
.bubble::after{content:"";position:absolute;left:50%;top:100%;margin-left:-7px;border:7px solid transparent;border-top-color:var(--ink)}
.mute{order:99;margin-left:auto;flex:none;font:inherit;font-weight:800;border:3px solid var(--ink);border-radius:999px;background:#fff;padding:4px 12px;cursor:pointer}

/* ---------- remotes: white plastic, rubber keys, glassy LCD ---------- */
.remote{position:relative;grid-template-columns:minmax(0,1fr);width:min(250px,88vw);padding:18px 16px 20px;display:grid;gap:10px;user-select:none;-webkit-user-select:none;touch-action:manipulation;
  background:linear-gradient(115deg,#ffffff 0%,var(--rb) 45%,#e1e3e4 100%);border:1px solid rgba(0,0,0,.28);border-radius:28px;
  box-shadow:inset 0 2px 1px rgba(255,255,255,.95),inset 0 -8px 14px rgba(0,0,0,.08),inset 6px 0 10px rgba(255,255,255,.6),0 14px 24px rgba(0,0,0,.28),0 3px 6px rgba(0,0,0,.15)}
@media (orientation:landscape) and (min-height:600px){.remote{width:290px}}
.remote.r-slide{border-radius:30px 30px 44px 44px}
.remote.r-screen{border-radius:20px;background:linear-gradient(115deg,#fbfcfe,#e7ecf3 50%,#cfd6df)}
.remote.r-flip{border-radius:34px 34px 22px 22px}
.remote.r-simple{border-radius:34px}
.ir{justify-self:center;width:46px;height:12px;border-radius:6px;background:linear-gradient(#3a2230,#120a10);box-shadow:inset 0 2px 2px rgba(255,255,255,.25)}
.lcd{position:relative;overflow:hidden;background:linear-gradient(#d4e0c6,#b8c7a6);border-radius:10px;padding:8px 10px;font-family:var(--lcd);color:#26301f;min-height:96px;
  display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center;box-shadow:inset 0 2px 5px rgba(0,0,0,.35),0 1px 0 #fff;border:2px solid #8f9a85;transition:opacity .2s}
.lcd::after{content:"";position:absolute;inset:0 0 55% 0;background:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,0));pointer-events:none}
.lcd.dark{background:linear-gradient(#18263c,#0b1422);color:#8fd0ff;border-color:#0a1220;min-height:150px}
.lcd.off>*{opacity:.15}
.lcd-mode{display:flex;gap:4px;align-items:center}
.lcd-temp{font-size:44px;line-height:1;text-align:right}
.lcd-temp small{font-size:18px}
.lcd-row{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:4px;font-size:13px}
.lcd-row span{display:inline-flex;align-items:center;gap:2px}
.lcd .sel{outline:2px solid currentColor;border-radius:4px;padding:0 2px}
.bars{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.bars i{width:4px;opacity:.2}.bars i.on{opacity:1}
.grid{display:grid;gap:8px}
.b{font:inherit;display:grid;justify-items:center;align-content:center;gap:1px;min-height:46px;border:1px solid rgba(0,0,0,.22);border-radius:14px;
  background:linear-gradient(#ffffff,#e6e8eb);color:#2b2f3a;padding:6px 2px;cursor:pointer;line-height:1.1;
  box-shadow:0 3px 0 #b5bac2,0 5px 6px rgba(0,0,0,.18),inset 0 1px 0 #fff}
.b:active,.b.press{transform:translateY(3px);box-shadow:0 0 0 #b5bac2,0 1px 2px rgba(0,0,0,.2),inset 0 2px 3px rgba(0,0,0,.12)}
.b:focus-visible{outline:3px solid #2b7bff;outline-offset:2px}
.b small{font-size:9px;font-weight:500;color:#6a707a}
.b.pw small{color:rgba(255,255,255,.9)}
.b.pw{min-height:56px;border-color:rgba(0,0,0,.3);box-shadow:0 3px 0 rgba(0,0,0,.35),0 5px 8px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.5)}
.b.round{width:132px;height:132px;border-radius:50%;justify-self:center;margin-top:16px}
.ic{display:grid;place-items:center;line-height:0}
.logo{text-align:center;font-weight:800;letter-spacing:.06em;font-size:12px;opacity:.85}
.coverBox{position:relative;overflow:hidden;border-radius:16px;padding:4px 4px 34px}
.cover{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;cursor:pointer;z-index:2;
  background:linear-gradient(115deg,#fdfdfd,#e8e9ea 60%,#d4d6d8);border:1px solid rgba(0,0,0,.2);box-shadow:inset 0 2px 1px #fff,0 -2px 4px rgba(0,0,0,.08);transition:transform .45s cubic-bezier(.3,.7,.3,1)}
.cover .grip{position:absolute;top:10px;left:30%;right:30%;height:6px;border-radius:3px;background:repeating-linear-gradient(90deg,#c4c7cb 0 3px,transparent 3px 6px)}
.cover.open{transform:translateY(calc(100% - 26px))}
.lid{position:absolute;left:-1px;right:-1px;top:-1px;bottom:-1px;align-content:start;border-radius:34px 34px 22px 22px;transform-origin:50% 0;transition:transform .5s;z-index:3;padding:18px 16px;display:grid;gap:12px;backface-visibility:hidden;
  background:linear-gradient(115deg,#ffffff,var(--rb) 45%,#d8e8eb);border:1px solid rgba(0,0,0,.28);box-shadow:inset 0 2px 1px #fff,0 6px 10px rgba(0,0,0,.2)}
.lid.open{transform:perspective(700px) rotateX(-178deg)}
.hint{font-size:11px;text-align:center;opacity:.75}
</style>
</head>
<body>

<div class="cats" id="cats"></div>
<div class="brands" id="brands" role="tablist"><button class="mute" id="mute">おと ON</button></div>
<div class="stage">
  <div class="room" id="room">
    <div class="tint" id="tint"></div>
    <div class="bubble" id="bubble">ごろごろ♪</div>
    <div class="thermo" id="thermo">へや 30.0℃</div>
  </div>
  <div class="remoteWrap"><div id="remote"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);
if(!window.THREE){document.getElementById('room').insertAdjacentHTML('beforeend','<p style="position:absolute;inset:40% 0;text-align:center;font-weight:800">よみこめませんでした。もういちど ひらいてね</p>');}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const MODES=['auto','cool','dry','heat','fan'];
const MODE_JP={auto:'じどう',cool:'れいぼう',dry:'じょしつ',heat:'だんぼう',fan:'そうふう'};
const MODE_COL={auto:'#ffd23a',cool:'#4fb3ff',dry:'#6fd36f',heat:'#ff9a3c',fan:'#ffffff'};

// ---------- fictional makers: each has its own body shape, remote structure and special feature ----------
const BRANDS=[
  {id:'polar',name:'ほっきょくぐま電機',short:'ほっきょくぐま',color:'#d7262e',remote:'slide',body:'box',beep:2200,special:'しろくまパワー',step:1,
   logoFont:'800 30px "M PLUS Rounded 1c",sans-serif',logoText:'ほっきょくぐま電機',remoteBg:'#f7f7f5'},
  {id:'aozora',name:'アオゾラ テクノ',short:'アオゾラ',color:'#1f6fd6',remote:'screen',body:'sleek',beep:1600,special:'AIおまかせ',step:0.5,
   logoFont:'italic 300 30px "Helvetica Neue",Arial,sans-serif',logoText:'AOZORA TECHNO',remoteBg:'#eef2f7'},
  {id:'soyo',name:'そよかぜ工業',short:'そよかぜ',color:'#16a2b8',remote:'flip',body:'round',beep:2600,special:'きらきらイオン',step:0.5,
   logoFont:'800 28px "M PLUS Rounded 1c",sans-serif',logoText:'そよかぜ工業',remoteBg:'#f4fbfc'},
  {id:'mikan',name:'みかん家電',short:'みかん',color:'#f08a1c',remote:'simple',body:'compact',beep:1200,special:'あしもとぽかぽか',step:1,
   logoFont:'800 30px "M PLUS Rounded 1c",sans-serif',logoText:'みかん家電',remoteBg:'#fffaf2'},
];
const newState=()=>({on:false,mode:'cool',temp:26,fan:0,vane:0,side:0,timerOn:0,timerOff:0,special:false,powerful:false,quiet:false,sleep:false,clean:0,menu:-1,coverOpen:false});
const states={};BRANDS.forEach(b=>states[b.id]=newState());
let brand=BRANDS[0],st=states.polar;
let roomT=30,flap=0,vaneAng=0.3,sideAng=0;

// ---------- sound ----------
let ac=null,muted=false,hum=null,humG=null,master=null;
function OUT(){if(!master){master=ac.createGain();master.gain.value=0.5;master.connect(ac.destination)}return master} // everything plays at half volume
function audio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}return ac}
function beep(f=brand.beep,d=0.08,delay=0,vol=0.06){if(muted||!audio())return;const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(OUT());o.start(t);o.stop(t+d+.02)}
function startHum(){if(hum||muted||!audio())return;const n=ac.sampleRate*2,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);let last=0;for(let i=0;i<n;i++){last=last*0.97+(Math.random()*2-1)*0.03;d[i]=last*6}
  hum=ac.createBufferSource();hum.buffer=b;hum.loop=true;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=700;humG=ac.createGain();humG.gain.value=0;hum.connect(f).connect(humG).connect(OUT());hum.start()}
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'おと OFF':'おと ON';if(humG)humG.gain.value=0};

// ---------- actions (shared by every remote) ----------
const ACT={
  power(){st.on=!st.on;st.clean=0;if(st.on){beep(brand.beep,.07);beep(brand.beep,.07,.12)}else{beep(brand.beep*0.8,.3);st.powerful=false;st.special=false}},
  start(){if(!st.on){st.on=true;st.clean=0;beep(brand.beep,.07);beep(brand.beep,.07,.12)}else beep()},
  stop(){if(st.on){st.on=false;st.powerful=false;st.special=false;beep(brand.beep*0.8,.3)}else beep()},
  mode(){st.mode=MODES[(MODES.indexOf(st.mode)+1)%MODES.length];st.special=false;beep()},
  setMode(m){st.mode=m;st.special=false;if(!st.on){st.on=true;st.clean=0;beep(brand.beep,.07);beep(brand.beep,.07,.12)}else beep()},
  up(){st.temp=clamp(st.temp+brand.step,16,31);beep()},
  down(){st.temp=clamp(st.temp-brand.step,16,31);beep()},
  fan(){st.fan=(st.fan+1)%6;st.powerful=false;st.quiet=false;beep()},
  vane(){st.vane=st.vane==='swing'?1:(st.vane+1)%6;beep()},
  swing(){st.vane=st.vane==='swing'?0:'swing';beep()},
  side(){st.side=st.side==='swing'?-2:st.side>=2?'swing':st.side+1;beep()},
  timerOn(){st.timerOn=(st.timerOn+1)%13;beep()},
  timerOff(){st.timerOff=(st.timerOff+1)%13;beep()},
  powerful(){st.powerful=!st.powerful;st.quiet=false;beep()},
  quiet(){st.quiet=!st.quiet;st.powerful=false;beep()},
  sleep(){st.sleep=!st.sleep;beep()},
  clean(){if(st.on){beep(400,.2);return}st.clean=12;beep();beep(brand.beep,.07,.12)},
  special(){
    st.special=!st.special;beep();beep(brand.beep*1.25,.07,.1);
    if(!st.special)return;
    if(!st.on){st.on=true;st.clean=0}
    if(brand.id==='polar'){st.mode='cool';st.fan=5;st.vane=1}
    if(brand.id==='aozora'){st.mode='auto';st.fan=0;st.vane='swing'}
    if(brand.id==='mikan'){st.mode='heat';st.vane=5;st.powerful=true}
  },
  // the screen remote: a menu picks what ▲▼ changes
  menu(){st.menu=st.menu>=4?-1:st.menu+1;beep()},
  mUp(){menuStep(1)},mDown(){menuStep(-1)},
};
const MENU=['ふうりょう','かざむき','タイマー','AIおまかせ','おそうじ'];
function menuStep(d){
  const m=st.menu;
  if(m<0)return d>0?ACT.up():ACT.down();
  if(m===0){st.fan=(st.fan+d+6)%6;beep()}
  else if(m===1){const opts=[0,1,2,3,4,5,'swing'];st.vane=opts[(opts.indexOf(st.vane)+d+opts.length)%opts.length];beep()}
  else if(m===2){st.timerOff=(st.timerOff+d+13)%13;beep()}
  else if(m===3)ACT.special();
  else ACT.clean();
}
function press(name,arg){audio();startHum();ACT[name](arg);renderLCD()}

// ---------- icons (so the remote reads without words) ----------
function I(n,c='#2b2f3a',sz=26){
  const S=(b)=>`<svg viewBox="0 0 24 24" width="${sz}" height="${sz}" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${b}</svg>`;
  switch(n){
    case 'power':return S('<path d="M7.5 6.5a7 7 0 1 0 9 0"/><path d="M12 3v8"/>');
    case 'up':return S(`<path d="M5 15l7-8 7 8z" fill="${c}"/>`);
    case 'down':return S(`<path d="M5 9l7 8 7-8z" fill="${c}"/>`);
    case 'cool':return S('<path d="M12 2v20M4 7l16 10M20 7L4 17"/><path d="M9.5 3.5L12 6l2.5-2.5M9.5 20.5L12 18l2.5 2.5"/>');
    case 'heat':return S(`<circle cx="12" cy="12" r="4" fill="${c}"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>`);
    case 'dry':return S(`<path d="M12 3c3 4 6 7.5 6 11a6 6 0 0 1-12 0c0-3.5 3-7 6-11z" fill="${c}" fill-opacity=".25"/>`);
    case 'fan':return S('<circle cx="12" cy="12" r="1.5"/><path d="M12 10.5C11 6 13 3 16 4.5s0 5-4 6zM13.3 12.8c4.3 1.4 6.2 4.4 3.5 6.4s-4.6-1.6-3.5-6.4zM10.7 12.7c-3.4 3-7 2.9-7.3-.4s3.6-3.7 7.3.4z"/>');
    case 'auto':return S('<path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v4h-4"/><path d="M9 15l3-7 3 7M10 13h4"/>');
    case 'mode':return S('<path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/>');
    case 'speed':return S(`<circle cx="7" cy="12" r="1.2"/><path d="M7 10.8C6.4 8 7.6 6.2 9.4 7.1s0 3-2.4 3.7zM7.9 12.6c2.6.8 3.7 2.6 2.1 3.8s-2.8-1-2.1-3.8zM6.2 12.5c-2 1.8-4.2 1.7-4.4-.2s2.2-2.2 4.4.2z"/><path d="M14 17v-3M17.5 17v-6M21 17V8"/>`);
    case 'vane':return S('<path d="M3 6h12"/><path d="M15 6c4 1 5 5 3 9"/><path d="M15 13l3 3 3-3"/>');
    case 'swing':return S('<path d="M8 4c-4 4-4 12 0 16M16 4c4 4 4 12 0 16"/><path d="M6 7l2-3 3 1M18 17l-2 3-3-1"/>');
    case 'side':return S('<path d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4"/>');
    case 'timerOn':return S('<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/><circle cx="19" cy="6" r="3" fill="#2fb34a" stroke="#2fb34a"/>');
    case 'timerOff':return S('<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/><circle cx="19" cy="6" r="3" fill="#e5484d" stroke="#e5484d"/>');
    case 'timer':return S('<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>');
    case 'sleep':return S(`<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" fill="${c}" fill-opacity=".25"/><path d="M16 3h3l-3 3h3"/>`);
    case 'powerful':return S(`<path d="M13 2L4 14h7l-1 8 9-12h-7z" fill="#ffcc33"/>`);
    case 'quiet':return S('<path d="M5 19c0-8 6-14 15-15-1 9-7 15-15 15z"/><path d="M5 19l8-8"/>');

function stepWind(dt,t){

  const g=catGoal(),base=new THREE.Vector3(TOWER.x,0,TOWER.z+0.42);catPath=[];
  if(g.floor){
    if(catOnTower)catPath.push({jump:true,to:base});
    catPath.push({to:new THREE.Vector3(g.p.x+0.35,0,g.p.z)});catPath.push({jump:true,to:g.p,small:true});
  }else if(!catOnTower){
    if(catPos.y>0.05)catPath.push({jump:true,to:new THREE.Vector3(catPos.x+0.35,0,catPos.z),small:true});
    catPath.push({to:base});catPath.push({jump:true,to:new THREE.Vector3(TOWER.x,TOWER.y+0.04,TOWER.z),up:true});
  }
}
function moveCat(dt){
  const g=catGoal();
  const atGoal=g.floor?(!catOnTower&&catPos.distanceTo(g.p)<0.08):catOnTower;
  if(g.floor&&atGoal)catHeading=Math.atan2(DEV_POS.x-catPos.x,DEV_POS.z-catPos.z); // sits facing the heater
  if(!atGoal&&!catPath.length&&!catSeg){catWantT+=dt;if(catWantT>(g.floor?0.8:2.5)){planCat();catWantT=0}}else if(atGoal)catWantT=0;
  if(!catSeg&&catPath.length){catSeg=Object.assign({from:catPos.clone(),k:0},catPath.shift());if(catSeg.jump)catOnTower=false}
  if(!catSeg)return false;
  const S=catSeg,d=S.to.clone().sub(S.from);
  if(Math.hypot(d.x,d.z)>0.01)catHeading=Math.atan2(d.x,d.z);
  if(S.jump){S.k=Math.min(1,S.k+dt/(S.small?0.35:0.55));catPos.lerpVectors(S.from,S.to,S.k);catPos.y+=Math.sin(Math.PI*S.k)*(S.small?0.12:0.35)}
  else{const L=Math.max(0.01,d.length());S.k=Math.min(1,S.k+dt*0.7/L);catPos.lerpVectors(S.from,S.to,S.k)}
  if(S.k>=1){if(S.up)catOnTower=true;catSeg=null}
  return true;
}

  }else if(mood==='comfy'){

function devStrength(){
  if(!dev||!dst)return 0;
  if(dev.cat==='heater')return dst.flame>0.5?0.22*(dst.eco?0.7:1):dst.fan*0.08;
  if(!dst.on)return 0;
  let s=dev.cat==='circ'?0.25+dst.speed*0.17:dev.type==='desk'?0.18+dst.speed*0.15:0.15+dst.speed*0.12;
  if(dst.mode==='rhythm')s*=0.55+0.45*Math.sin(t*0.9)**2;
  if(dst.mode==='nature')s*=0.5+0.5*Math.abs(Math.sin(t*0.37)*Math.sin(t*1.3+1));
  return s;
}
function devSource(){
  const s=devStrength();if(!devG||s<=0.01)return null;
  if(dev.cat==='heater'){const o=DV.src.o.clone();devG.localToWorld(o);return {o,d:headDir(devG).add(new THREE.Vector3(0,0.1,0)).normalize(),r:0.17*DEV_K,slotW:0.44*DEV_K,strength:s,col:[1,0.55,0.22],spd:0.7,warm:true,spread0:0.2,spreadK:0.45,len:2.5}}
  if(DV.src.tower){const o=new THREE.Vector3(0,0.55,0.1);DV.pan.localToWorld(o);return {o,d:headDir(DV.pan),r:0.05,slotH:0.6*DEV_K,strength:s,col:[0.85,0.9,1],spd:1+s*2,spread0:0.25,spreadK:0.3,len:3.5}}
  const o=new THREE.Vector3(0,0,0.08);DV.src.head.localToWorld(o);
  const circ=dev.cat==='circ';
  return {o,d:headDir(DV.src.head),r:DV.src.r*DEV_K,strength:s,col:[0.85,0.9,1],spd:circ?1.6+s*3:1+s*2.2,spread0:DV.src.r,spreadK:circ?0.12:0.28,len:circ?6:4};
}
function updateDevice(dt){
  if(!dev||!devG)return;
  const s=dst;
  if(dev.cat==='heater'){
    s.t+=dt;
    if(s.phase==='ignite'){ // fan spins up, igniter clicks, then the burner catches
      s.fan=Math.min(1,s.fan+dt*0.6);
      if(s.t>0.8&&s.t<4.2&&Math.floor(s.t*7)!==Math.floor((s.t-dt)*7))heaterClick();
      if(s.t>=4.4){s.phase='burn';s.t=0;heaterWhoomp();startBurner()}
    }else if(s.phase==='burn'){
      s.flame=Math.min(1,s.flame+dt*1.5);s.fan=1;
      s.fuel=Math.max(0,s.fuel-dt*(s.eco?0.0025:0.004));
      if(s.fuel<=0){s.phase='cool';s.t=0;s.on=false;beepSeq([1800,1800,1800],0.18);renderPanel()}
    }else if(s.phase==='cool'){ // after shutting off the fan keeps blowing for a while
      s.flame=Math.max(0,s.flame-dt*1.2);if(s.t>5){s.fan=Math.max(0,s.fan-dt*0.5);if(s.fan<=0)s.phase='off'}
    }
    if(burnerG)burnerG.gain.value=muted?0:s.flame*0.05;
    if(devHumG)devHumG.gain.value=muted?0:s.fan*0.03;
    const f=s.flame*(0.85+Math.sin(t*23)*0.08+Math.sin(t*7.3)*0.07);
    DV.glowMat.emissive.setRGB(1*f,0.38*f,0.08*f);DV.light.intensity=f*1.2;
    drawHeaterDisplay();
    return;
  }
  // fans and circulators
  const target=s.on?(dev.cat==='circ'?10+s.speed*6:7+s.speed*5)*(devStrength()/(0.15+s.speed*0.12+0.001)):0;
  s.spin+=(target-s.spin)*Math.min(1,dt*(s.on?1.2:0.5));
  if(DV.blades)DV.blades.rotation.z-=s.spin*dt;
  if(devHumG)devHumG.gain.value=muted?0:Math.min(0.06,s.spin*0.0022);
  if(s.osc||s.osc3d)s.oscP+=dt*(dev.cat==='circ'?0.9:0.6);
  if(s.oscV||s.osc3d)s.oscVP+=dt*0.7;
  const pan=(s.osc||s.osc3d)?Math.sin(s.oscP)*(dev.type==='tower'?0.7:0.75):Math.sin(s.oscP)*0; // keeps the last angle when stopped
  if(!(s.osc||s.osc3d))s.panHold=s.panHold??0;else s.panHold=pan;
  if(DV.pan)DV.pan.rotation.y=s.panHold??0;
  const tilt=(s.oscV||s.osc3d)?0.15+0.55*(0.5+0.5*Math.sin(s.oscVP)):s.tilt;
  if(DV.tilt)DV.tilt.rotation.x=-tilt;
  if(DV.led){const on=s.on&&s.mode!=='night';DV.led.emissive.setHex(on?0x3fa9ff:0)}
  if(DV.dial)DV.dial.rotation.y=-(s.on?s.speed:0)*0.9;
  if(DV.keys)DV.keys.forEach((k,i)=>k.position.y=(s.on?s.speed:0)===i?0.088:0.1);
}

function noiseLoop(freq,q){const n=ac.sampleRate*2,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const src=ac.createBufferSource();src.buffer=b;src.loop=true;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;f.Q.value=q;const g=ac.createGain();g.gain.value=0;src.connect(f).connect(g).connect(OUT());src.start();return g}

function heaterClick(){if(muted||!audio())return;const t0=ac.currentTime,n=ac.sampleRate*0.02,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(n*0.12));
  const s=ac.createBufferSource();s.buffer=b;const g=ac.createGain();g.gain.value=0.5;const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=1500;s.connect(f).connect(g).connect(OUT());s.start(t0)}

  const s=ac.createBufferSource();s.buffer=b;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(900,t0);f.frequency.exponentialRampToValueAtTime(150,t0+0.5);const g=ac.createGain();g.gain.value=0.6;s.connect(f).connect(g).connect(OUT());s.start(t0)}

// ---------- loop ----------
let last=performance.now(),t=0;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;t+=dt;
  if(!document.hidden){
    if(st.clean>0){st.clean-=dt;if(st.clean<=0){st.clean=0;beep(brand.beep,.06);renderLCD()}}
    const targetFlap=st.on?1:st.clean>0?0.4:0;
    flap+=(targetFlap-flap)*Math.min(1,dt*(targetFlap>flap?1.6:2.5));
    let vt=st.vane==='swing'?0.5+0.5*Math.sin(t*1.2):st.vane===0?0.35:(st.vane-1)/4;
    if(!st.on)vt=0;
    vaneAng+=(vt-vaneAng)*Math.min(1,dt*3);
    let stg=st.side==='swing'?Math.sin(t*0.9)*2:st.side;if(!st.on)stg=0;
    sideAng+=(stg-sideAng)*Math.min(1,dt*3);
    // room temperature drifts toward the setting
    const lvl=fanLevel();
    if(st.on){
      let target=roomT;
      if(st.mode==='cool'||st.mode==='heat'||st.mode==='auto')target=st.temp-(st.special&&brand.id==='polar'?4:0);
      if(st.mode==='dry')target=Math.min(roomT,st.temp+1);
      if(st.mode==='cool'&&target>roomT)target=roomT;if(st.mode==='heat'&&target<roomT)target=roomT;
      roomT+=(target-roomT)*Math.min(1,dt*0.04*lvl);
    }else roomT+=(30-roomT)*dt*0.01;
    if(dev&&dev.cat==='heater'&&dstates[dev.id].flame>0.5){const hs=dstates[dev.id];roomT+=((hs.temp+1)-roomT)*Math.min(1,dt*(hs.eco?0.02:0.035))}
    if(Math.floor(t*2)!==Math.floor((t-dt)*2)&&dev&&curCat!=='ac')renderPanel();
    $('thermo').textContent=`へや ${roomT.toFixed(1)}℃`;
    const cold=clamp((26-roomT)/8,0,1),hot=clamp((roomT-26)/6,0,1);
    $('tint').style.background=`linear-gradient(rgba(120,190,255,${cold*0.35}),rgba(120,190,255,${cold*0.2})),linear-gradient(rgba(255,150,80,${hot*0.25}),rgba(255,150,80,${hot*0.12}))`;
    if(humG)humG.gain.value=muted?0:(st.on&&flap>0.5?0.02+lvl*0.012:st.clean>0?0.015:0);
    updateAC(t);updateDevice(dt);stepWind(dt,t);updateCat(dt,t);updateCamera(dt);renderer.render(scene,camera);
  }
  requestAnimationFrame(frame);
}
resize();selectBrand(BRANDS[0]);buildTabs();requestAnimationFrame(frame);
})();
</script>
