<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="エアコン">
<meta name="theme-color" content="#f4f1ea">
<title>エアコン リモコン ごっこ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: wall with the air conditioner on top, the remote below (or beside it on wide screens). Single bright room look. */
:root{
  --wall:#f4f1ea; --wall2:#e9e3d6; --ink:#2b2f3a; --paper:#fff; --accent:#ffcc33;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --lcd:"Share Tech Mono",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--wall);color:var(--ink);font-family:var(--font)}
body{display:flex;flex-direction:column;overflow-x:hidden}
.brands{display:flex;gap:6px;overflow-x:auto;padding:calc(env(safe-area-inset-top,0px) + 8px) max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px));flex:none}
.brand{font:inherit;border:3px solid var(--ink);background:#fff;border-radius:14px;padding:6px 10px;cursor:pointer;white-space:nowrap;font-weight:800;font-size:14px;box-shadow:0 3px 0 var(--ink);flex:none}
.brand.sel{transform:translateY(2px);box-shadow:0 1px 0 var(--ink);outline:3px solid var(--accent)}
.brand:focus-visible{outline:4px solid #2b7bff}
.stage{flex:1;display:flex;gap:14px;padding:6px max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(10px,env(safe-area-inset-left,0px));min-height:0}
@media (orientation:portrait){.stage{flex-direction:column}}
.room{position:relative;flex:1.3;min-width:0;min-height:260px;border-radius:18px;overflow:hidden;
  background:linear-gradient(var(--wall) 0 70%,#d9c3a0 70%);border:3px solid var(--ink)}
.room .tint{position:absolute;inset:0;pointer-events:none;transition:background 2s}
.room svg.ac{position:absolute;left:6%;width:88%;top:6%;height:auto;max-height:42%}
.room canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.thermo{position:absolute;right:10px;bottom:10px;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:4px 10px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.sofa{position:absolute;left:8%;bottom:6%;width:34%;height:20%;background:#7aa58a;border:3px solid var(--ink);border-radius:14px 14px 6px 6px}
.plant{position:absolute;right:8%;bottom:6%;width:9%;height:26%}
.remoteWrap{flex:1;display:flex;justify-content:center;align-items:flex-start;min-width:0;overflow:auto;padding-top:4px}
.mute{order:99;margin-left:auto;flex:none;font:inherit;font-weight:800;border:3px solid var(--ink);border-radius:999px;background:#fff;padding:4px 12px;cursor:pointer}

/* ---------- remotes ---------- */
.remote{position:relative;width:min(240px,86vw);}
@media (orientation:landscape) and (min-height:600px){.remote{width:280px}.b{font-size:15px;padding:11px 4px}}
.remote{border:3px solid var(--ink);padding:14px 14px 18px;display:grid;gap:10px;box-shadow:0 8px 0 rgba(0,0,0,.18);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.lcd{background:#c9d7b8;border:3px solid #55604a;border-radius:8px;padding:6px 8px;font-family:var(--lcd);color:#26301f;min-height:86px;display:grid;grid-template-columns:1fr auto;gap:2px 6px;align-items:center;transition:opacity .2s}
.lcd.off{opacity:.25}
.lcd .md{font-family:var(--font);font-weight:800;font-size:15px}
.lcd .tp{font-size:40px;line-height:1;grid-row:span 2;text-align:right}
.lcd .tp small{font-size:16px}
.lcd .sub{font-size:13px;font-family:var(--font);font-weight:800}
.lcd .row{grid-column:1/-1;display:flex;justify-content:space-between;font-size:12px;font-family:var(--font);font-weight:800}
.bars{display:inline-flex;gap:2px;align-items:flex-end;height:14px;vertical-align:middle}
.bars i{width:4px;background:#26301f;opacity:.2}.bars i.on{opacity:1}
.grid{display:grid;gap:8px}
.b{font:inherit;font-weight:800;font-size:13px;border:2px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink);padding:9px 4px;cursor:pointer;box-shadow:0 3px 0 var(--ink);line-height:1.1}
.b:active,.b.press{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.b:focus-visible{outline:3px solid #2b7bff;outline-offset:2px}
.b.pw{font-size:15px}
.b small{display:block;font-size:10px;font-weight:500}
.logo{text-align:center;font-weight:800;letter-spacing:.06em;font-size:13px}
/* slide cover (Polar style) */
.coverBox{position:relative;overflow:hidden;border-radius:12px}
.cover{position:absolute;inset:0;border:2px solid rgba(0,0,0,.25);border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:13px;cursor:pointer;transition:transform .45s cubic-bezier(.3,.7,.3,1);z-index:2}
.cover.open{transform:translateY(calc(100% - 22px))}
/* flip lid (Soyokaze style) */
.lid{position:absolute;left:-3px;right:-3px;top:-3px;border:3px solid var(--ink);border-radius:30px 30px 18px 18px;transform-origin:50% 0;transition:transform .5s;z-index:3;padding:14px;display:grid;gap:10px;backface-visibility:hidden}
.lid.open{transform:perspective(600px) rotateX(-178deg)}
.hint{font-size:11px;text-align:center;opacity:.75}
.menuSel{outline:3px solid #26301f;border-radius:4px;padding:0 3px}
</style>
</head>
<body>

<div class="brands" id="brands" role="tablist"><button class="mute" id="mute">おと ON</button></div>
<div class="stage">
  <div class="room" id="room">
    <div class="tint" id="tint"></div>
    <div class="sofa"></div>
    <svg class="plant" viewBox="0 0 40 110"><rect x="8" y="70" width="24" height="38" rx="4" fill="#d8744a" stroke="#2b2f3a" stroke-width="3"/><ellipse cx="20" cy="45" rx="17" ry="30" fill="#5fa35a" stroke="#2b2f3a" stroke-width="3"/></svg>
    <svg class="ac" id="ac" viewBox="0 0 800 300"></svg>
    <canvas id="wind"></canvas>
    <div class="thermo" id="thermo">へや 30.0℃</div>
  </div>
  <div class="remoteWrap"><div id="remote"></div></div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const MODES=['auto','cool','dry','heat','fan'];
const MODE_JP={auto:'じどう',cool:'れいぼう',dry:'じょしつ',heat:'だんぼう',fan:'そうふう'};
const MODE_COL={auto:'#ffd23a',cool:'#4fb3ff',dry:'#6fd36f',heat:'#ff9a3c',fan:'#ffffff'};

// ---------- fictional makers: each has its own body shape, remote structure and special feature ----------
const BRANDS=[
  {id:'polar',name:'ほっきょくぐま電機',short:'ほっきょくぐま',color:'#d7262e',remote:'slide',body:'box',beep:2200,special:'しろくまパワー',step:1,
   logoFont:'800 30px "M PLUS Rounded 1c",sans-serif',logoText:'ほっきょくぐま電機',remoteBg:'#f7f7f5'},
  {id:'aozora',name:'アオゾラ テクノ',short:'アオゾラ',color:'#1f6fd6',remote:'screen',body:'sleek',beep:1600,special:'AIおまかせ',step:0.5,
   logoFont:'italic 300 30px "Helvetica Neue",Arial,sans-serif',logoText:'AOZORA TECHNO',remoteBg:'#eef2f7'},
  {id:'soyo',name:'そよかぜ工業',short:'そよかぜ',color:'#16a2b8',remote:'flip',body:'round',beep:2600,special:'きらきらイオン',step:0.5,
   logoFont:'800 28px "M PLUS Rounded 1c",sans-serif',logoText:'そよかぜ工業',remoteBg:'#f4fbfc'},
  {id:'mikan',name:'みかん家電',short:'みかん',color:'#f08a1c',remote:'simple',body:'compact',beep:1200,special:'あしもとぽかぽか',step:1,
   logoFont:'800 30px "M PLUS Rounded 1c",sans-serif',logoText:'みかん家電',remoteBg:'#fffaf2'},
];
const newState=()=>({on:false,mode:'cool',temp:26,fan:0,vane:0,side:0,timerOn:0,timerOff:0,special:false,powerful:false,quiet:false,sleep:false,clean:0,menu:-1,coverOpen:false});
const states={};BRANDS.forEach(b=>states[b.id]=newState());
let brand=BRANDS[0],st=states.polar;
let roomT=30,flap=0,vaneAng=0.3,sideAng=0;

// ---------- sound ----------
let ac=null,muted=false,hum=null,humG=null;
function audio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}return ac}
function beep(f=brand.beep,d=0.08,delay=0,vol=0.06){if(muted||!audio())return;const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02)}
function startHum(){if(hum||muted||!audio())return;const n=ac.sampleRate*2,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);let last=0;for(let i=0;i<n;i++){last=last*0.97+(Math.random()*2-1)*0.03;d[i]=last*6}
  hum=ac.createBufferSource();hum.buffer=b;hum.loop=true;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=700;humG=ac.createGain();humG.gain.value=0;hum.connect(f).connect(humG).connect(ac.destination);hum.start()}
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'おと OFF':'おと ON';if(humG)humG.gain.value=0};

// ---------- actions (shared by every remote) ----------
function fanLevel(){return st.powerful?6:st.quiet?0.6:st.fan===0?3:st.fan}
const ACT={
  power(){st.on=!st.on;st.clean=0;if(st.on){beep(brand.beep,.07);beep(brand.beep,.07,.12)}else{beep(brand.beep*0.8,.3);st.powerful=false;st.special=false}},
  start(){if(!st.on){st.on=true;st.clean=0;beep(brand.beep,.07);beep(brand.beep,.07,.12)}else beep()},
  stop(){if(st.on){st.on=false;st.powerful=false;st.special=false;beep(brand.beep*0.8,.3)}else beep()},
  mode(){st.mode=MODES[(MODES.indexOf(st.mode)+1)%MODES.length];st.special=false;beep()},
  setMode(m){st.mode=m;st.special=false;if(!st.on){st.on=true;st.clean=0;beep(brand.beep,.07);beep(brand.beep,.07,.12)}else beep()},
  up(){st.temp=clamp(st.temp+brand.step,16,31);beep()},
  down(){st.temp=clamp(st.temp-brand.step,16,31);beep()},
  fan(){st.fan=(st.fan+1)%6;st.powerful=false;st.quiet=false;beep()},
  vane(){st.vane=st.vane==='swing'?1:(st.vane+1)%6;beep()},
  swing(){st.vane=st.vane==='swing'?0:'swing';beep()},
  side(){st.side=st.side==='swing'?-2:st.side>=2?'swing':st.side+1;beep()},
  timerOn(){st.timerOn=(st.timerOn+1)%13;beep()},
  timerOff(){st.timerOff=(st.timerOff+1)%13;beep()},
  powerful(){st.powerful=!st.powerful;st.quiet=false;beep()},
  quiet(){st.quiet=!st.quiet;st.powerful=false;beep()},
  sleep(){st.sleep=!st.sleep;beep()},
  clean(){if(st.on){beep(400,.2);return}st.clean=12;beep();beep(brand.beep,.07,.12)},
  special(){
    st.special=!st.special;beep();beep(brand.beep*1.25,.07,.1);
    if(!st.special)return;
    if(!st.on){st.on=true;st.clean=0}
    if(brand.id==='polar'){st.mode='cool';st.fan=5;st.vane=1}
    if(brand.id==='aozora'){st.mode='auto';st.fan=0;st.vane='swing'}
    if(brand.id==='mikan'){st.mode='heat';st.vane=5;st.powerful=true}
  },
  // the screen remote: a menu picks what ▲▼ changes
  menu(){st.menu=st.menu>=4?-1:st.menu+1;beep()},
  mUp(){menuStep(1)},mDown(){menuStep(-1)},
};
const MENU=['ふうりょう','かざむき','タイマー','AIおまかせ','おそうじ'];
function menuStep(d){
  const m=st.menu;
  if(m<0)return d>0?ACT.up():ACT.down();
  if(m===0){st.fan=(st.fan+d+6)%6;beep()}
  else if(m===1){const opts=[0,1,2,3,4,5,'swing'];st.vane=opts[(opts.indexOf(st.vane)+d+opts.length)%opts.length];beep()}
  else if(m===2){st.timerOff=(st.timerOff+d+13)%13;beep()}
  else if(m===3)ACT.special();
  else ACT.clean();
}
function press(name,arg){audio();startHum();ACT[name](arg);renderLCD()}

// ---------- remotes ----------
function btn(label,act,o={}){
  const b=document.createElement('button');b.className='b'+(o.cls?' '+o.cls:'');b.innerHTML=label;
  if(o.style)b.style.cssText=o.style;
  b.addEventListener('click',e=>{e.stopPropagation();press(act,o.arg)});return b;
}
function grid(cols,items,gap){const g=document.createElement('div');g.className='grid';g.style.gridTemplateColumns=`repeat(${cols},1fr)`;if(gap)g.style.gap=gap;items.forEach(i=>g.appendChild(i));return g}
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e}
function lcdBox(){const l=el('div','lcd');l.id='lcd';return l}
function buildRemote(){
  const host=$('remote');host.innerHTML='';
  const r=el('div','remote');r.style.background=brand.remoteBg;host.appendChild(r);
  const C=brand.color;
  if(brand.remote==='slide'){ // tall remote; slide the lower cover down for detailed buttons
    r.style.borderRadius='26px 26px 36px 36px';
    r.appendChild(lcdBox());
    r.appendChild(grid(2,[btn('うんてん<br>ていし','power',{cls:'pw',style:`background:${C};color:#fff;grid-column:span 2`}),btn('▲<small>おんど</small>','up'),btn('▼<small>おんど</small>','down'),btn('うんてん<br>きりかえ','mode',{style:'grid-column:span 2'})]));
    const box=el('div','coverBox');
    box.appendChild(grid(3,[btn('ふうりょう','fan'),btn('かざむき','vane'),btn('スイング','swing'),btn('さゆう','side'),btn('入<small>タイマー</small>','timerOn'),btn('切<small>タイマー</small>','timerOff'),btn('おやすみ','sleep'),btn('パワフル','powerful'),btn('しずか','quiet'),btn(brand.special,'special',{style:`grid-column:span 2;background:#e6f3ff`}),btn('おそうじ','clean')],'6px'));
    const cover=el('div','cover'+(st.coverOpen?' open':''),'▼ ふたを スライド');cover.style.background='#e9e9e4';
    cover.onclick=()=>{st.coverOpen=!st.coverOpen;cover.classList.toggle('open',st.coverOpen);cover.textContent=st.coverOpen?'▲ ふたを もどす':'▼ ふたを スライド';audio();beep(600,.04,0,.03)};
    box.appendChild(cover);r.appendChild(box);
  }else if(brand.remote==='screen'){ // big screen, few keys: MENU chooses what ▲▼ does
    r.style.borderRadius='18px';r.style.background='linear-gradient(#f9fbfd,#dfe6ef)';
    const l=lcdBox();l.style.background='#0f1b2d';l.style.color='#8fd0ff';l.style.borderColor='#0a1220';l.style.minHeight='150px';r.appendChild(l);
    r.appendChild(grid(3,[btn('モード','mode'),btn('▲','mUp',{style:'font-size:18px'}),btn('メニュー','menu')]));
    r.appendChild(grid(3,[btn('おやすみ','sleep'),btn('▼','mDown',{style:'font-size:18px'}),btn('パワフル','powerful')]));
    r.appendChild(btn('● うんてん / ていし','power',{cls:'pw',style:`background:${C};color:#fff;border-radius:999px`}));
    r.appendChild(el('div','hint','「メニュー」で えらんで ▲▼ で かえる'));
  }else if(brand.remote==='flip'){ // flip lid: big round button outside, full keypad inside
    r.style.borderRadius='30px 30px 18px 18px';r.style.minHeight='420px';
    const inside=el('div','grid');inside.style.gap='8px';
    inside.appendChild(lcdBox());
    inside.appendChild(grid(4,[btn('じどう','setMode',{arg:'auto'}),btn('れいぼう','setMode',{arg:'cool',style:'background:#dff1ff'}),btn('じょしつ','setMode',{arg:'dry',style:'background:#e5f8e5'}),btn('だんぼう','setMode',{arg:'heat',style:'background:#ffeede'})],'5px'));
    inside.appendChild(grid(3,[btn('▲<small>おんど</small>','up'),btn('ていし','stop',{style:'background:#444;color:#fff'}),btn('▼<small>おんど</small>','down'),btn('ふうりょう','fan'),btn('じょうげ','vane'),btn('さゆう','side'),btn('スイング','swing'),btn('切<small>タイマー</small>','timerOff'),btn('おそうじ','clean')],'6px'));
    inside.appendChild(btn(brand.special,'special',{style:`background:${C};color:#fff`}));
    r.appendChild(inside);
    const lid=el('div','lid'+(st.coverOpen?' open':''));lid.style.background=`linear-gradient(${brand.remoteBg},#d6eef2)`;
    const big=btn('うんてん<br>ていし','power',{style:`width:120px;height:120px;border-radius:50%;justify-self:center;background:${C};color:#fff;font-size:18px;margin-top:30px`});
    lid.appendChild(el('div','logo',brand.name));lid.appendChild(big);
    lid.appendChild(grid(2,[btn('▲<small>おんど</small>','up'),btn('▼<small>おんど</small>','down')]));
    const op=el('button','b','ふたを ひらく ▼');op.onclick=e=>{e.stopPropagation();st.coverOpen=true;lid.classList.add('open');audio();beep(600,.04,0,.03)};lid.appendChild(op);
    r.appendChild(lid);
    const cl=el('button','b','ふたを しめる ▲');cl.onclick=()=>{st.coverOpen=false;lid.classList.remove('open');beep(600,.04,0,.03)};r.appendChild(cl);
  }else{ // simple: a few big buttons
    r.style.borderRadius='28px';
    r.appendChild(lcdBox());
    r.appendChild(btn('でんげん','power',{cls:'pw',style:`background:${C};color:#fff;border-radius:999px;font-size:20px;padding:14px`}));
    r.appendChild(grid(2,[btn('＋','up',{style:'font-size:24px'}),btn('ー','down',{style:'font-size:24px'}),btn('モード','mode'),btn('かぜ','fan'),btn('かざむき','vane'),btn('タイマー','timerOff')]));
    r.appendChild(btn(brand.special,'special',{style:'background:#fff1dd'}));
  }
  const lg=el('div','logo',brand.name);lg.style.color=C;r.appendChild(lg);
  renderLCD();
}
function renderLCD(){
  const l=$('lcd');if(!l)return;
  l.classList.toggle('off',!st.on&&!st.clean);
  if(st.clean&&!st.on){l.innerHTML='<div class="md">おそうじちゅう</div><div class="tp">--</div><div class="sub">かわかしています</div>';return}
  const bars=n=>'<span class="bars">'+[1,2,3,4,5].map(i=>`<i class="${i<=n?'on':''}" style="height:${3+i*2}px"></i>`).join('')+'</span>';
  const fanTxt=st.powerful?'パワフル':st.quiet?'しずか':st.fan===0?'じどう':bars(st.fan);
  const vaneTxt=st.vane==='swing'?'スイング':st.vane===0?'じどう':'▼'.repeat(1)+st.vane;
  const sideTxt=st.side==='swing'?'↔':st.side===0?'・':st.side<0?'←'.repeat(-st.side):'→'.repeat(st.side);
  const tm=(st.timerOff?`切 ${st.timerOff}h `:'')+(st.timerOn?`入 ${st.timerOn}h`:'');
  const sel=i=>brand.remote==='screen'&&st.menu===i?' class="menuSel"':'';
  const tempTxt=st.mode==='fan'?'--':(brand.step<1?st.temp.toFixed(1):st.temp);
  l.innerHTML=`<div class="md">${MODE_JP[st.mode]}${st.special?' ★':''}</div><div class="tp">${tempTxt}<small>℃</small></div>
    <div class="sub"><span${sel(0)}>${fanTxt}</span></div>
    <div class="row"><span${sel(1)}>かぜ ${vaneTxt}</span><span>${sideTxt}</span><span${sel(2)}>${tm||'タイマー なし'}</span></div>
    ${st.special?`<div class="row"><span${sel(3)}>${brand.special} ON</span></div>`:brand.remote==='screen'&&st.menu>=0?`<div class="row"><span class="menuSel">メニュー：${MENU[st.menu]}</span></div>`:''}
    ${st.sleep?'<div class="row"><span>おやすみ</span></div>':''}`;
}

// ---------- the air conditioner body (SVG) ----------
const NS='http://www.w3.org/2000/svg';
let svgEls={};
function svg(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);(parent||$('ac')).appendChild(e);return e}
function buildAC(){
  const s=$('ac');s.innerHTML='';svgEls={};
  const B=brand,C=B.color;
  const shape={box:{rx:10,h:210},sleek:{rx:40,h:190},round:{rx:80,h:220},compact:{rx:24,h:180}}[B.body];
  const x0=40,w=720,h=shape.h,y0=20;
  svg('rect',{x:x0+6,y:y0+10,width:w,height:h,rx:shape.rx,fill:'rgba(0,0,0,.12)'});
  const grad=svg('defs',{});grad.innerHTML=`<linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="${B.body==='sleek'?'#d9dee6':'#ececea'}"/></linearGradient>`;
  svg('rect',{x:x0,y:y0,width:w,height:h,rx:shape.rx,fill:'url(#bodyG)',stroke:'#2b2f3a','stroke-width':4});
  // outlet slot at the bottom
  const sy=y0+h-62,sx=x0+(B.body==='round'?90:50),sw=w-(B.body==='round'?180:100),sh=46;
  svgEls.slot={x:sx,y:sy,w:sw,h:sh};
  svg('rect',{x:sx,y:sy,width:sw,height:sh,rx:8,fill:'#1d2330'});
  // side louvers (vertical slats) inside the slot
  svgEls.sides=[];for(let i=1;i<8;i++){svgEls.sides.push(svg('line',{x1:sx+sw*i/8,y1:sy+4,x2:sx+sw*i/8,y2:sy+sh-4,stroke:'#5a6478','stroke-width':4,'stroke-linecap':'round'}))}
  // up/down vanes (horizontal slats)
  svgEls.vanes=[0,1].map(i=>svg('rect',{x:sx+6,y:sy+10+i*16,width:sw-12,height:6,rx:3,fill:'#e8ebf0',stroke:'#8a93a5','stroke-width':1.5}));
  // front flap that swings open
  svgEls.flap=svg('rect',{x:sx-6,y:sy-2,width:sw+12,height:sh+6,rx:10,fill:B.body==='sleek'?'#e3e8ef':'#f6f6f3',stroke:'#2b2f3a','stroke-width':3});
  // panel line + brand details
  if(B.body==='box')svg('line',{x1:x0+20,y1:y0+46,x2:x0+w-20,y2:y0+46,stroke:'#c9c9c4','stroke-width':3});
  if(B.body==='sleek'){svgEls.bar=svg('rect',{x:x0+w-300,y:y0+30,width:240,height:6,rx:3,fill:'#cfd6e0'})}
  if(B.body==='round')svg('path',{d:`M${x0+60} ${y0+70} Q${x0+w/2} ${y0+40} ${x0+w-60} ${y0+70}`,stroke:C,'stroke-width':4,fill:'none',opacity:.6});
  if(B.body==='compact')svg('circle',{cx:x0+50,cy:y0+40,r:12,fill:C});
  const logo=svg('text',{x:B.body==='compact'?x0+72:x0+40,y:y0+(B.body==='box'?34:B.body==='round'?110:52),fill:C,style:`font:${B.logoFont}`});logo.textContent=B.logoText;
  if(B.body==='round'){logo.setAttribute('x',x0+w/2);logo.setAttribute('text-anchor','middle')}
  // display + lamps
  if(B.body==='box'||B.body==='round'){
    const dx=B.body==='box'?x0+w-170:x0+w/2-60,dy=B.body==='box'?y0+70:y0+120;
    svg('rect',{x:dx,y:dy,width:120,height:44,rx:8,fill:'#141821'});
    svgEls.disp=svg('text',{x:dx+60,y:dy+33,'text-anchor':'middle',fill:'#ff5b4f',style:'font:28px "Share Tech Mono",monospace'});
  }
  svgEls.lamps=[0,1,2].map(i=>svg('circle',{cx:x0+w-(B.body==='round'?120:60)-i*22,cy:B.body==='box'?y0+140:B.body==='round'?y0+150:y0+60,r:6,fill:'#cfd3da',stroke:'#2b2f3a','stroke-width':1.5}));
}
function updateAC(t){
  const S=svgEls.slot;if(!S)return;
  const running=st.on||st.clean>0;
  // flap: closed → swung down below the slot
  const fA=flap;
  svgEls.flap.setAttribute('y',S.y-2+fA*(S.h+8));
  svgEls.flap.setAttribute('height',Math.max(4,(S.h+6)*(1-fA*0.78)));
  svgEls.flap.setAttribute('opacity',1-fA*0.15);
  // up/down vanes: thin when blowing straight, thick when tilted down
  svgEls.vanes.forEach((v,i)=>{const th=4+vaneAng*14;v.setAttribute('height',th);v.setAttribute('y',S.y+8+i*17-th*0.2+vaneAng*4)});
  svgEls.sides.forEach((l,i)=>{const off=sideAng*9;l.setAttribute('x2',S.x+S.w*(i+1)/8+off)});
  const col=MODE_COL[st.special&&brand.id==='polar'?'cool':st.mode];
  svgEls.lamps.forEach((l,i)=>{
    let f='#cfd3da';
    if(st.on&&i===0)f=col;
    if(st.on&&i===1&&(st.timerOn||st.timerOff))f='#ffa94d';
    if(st.on&&i===2&&(st.special||st.powerful))f=brand.color;
    if(!st.on&&st.clean>0&&i===0)f=Math.floor(t*2)%2?'#6fd36f':'#cfd3da';
    l.setAttribute('fill',f);
  });
  if(svgEls.disp)svgEls.disp.textContent=st.on?(st.mode==='fan'?'--':(brand.step<1?st.temp.toFixed(1):st.temp)):'';
  if(svgEls.bar)svgEls.bar.setAttribute('fill',st.on?col:'#cfd6e0');
}

// ---------- wind particles ----------
const cv=$('wind'),ctx=cv.getContext('2d');let dpr=1;
function resize(){dpr=Math.min(1.5,devicePixelRatio||1);const r=cv.getBoundingClientRect();cv.width=r.width*dpr;cv.height=r.height*dpr}
addEventListener('resize',resize);
const parts=[];
function slotScreen(){ // slot position in canvas pixels
  const s=$('ac').getBoundingClientRect(),c=cv.getBoundingClientRect(),S=svgEls.slot;if(!S)return null;
  const k=s.width/800;return {x:(s.left-c.left+S.x*k)*dpr,y:(s.top-c.top+(S.y+S.h)*k)*dpr,w:S.w*k*dpr};
}
function airColor(){
  if(st.clean>0&&!st.on)return [235,245,255];
  let m=st.mode;if(m==='auto')m=roomT>st.temp+0.5?'cool':roomT<st.temp-0.5?'heat':'fan';
  if(st.special&&brand.id==='polar')m='cool';
  return {cool:[120,200,255],heat:[255,160,80],dry:[150,230,150],fan:[240,245,255]}[m];
}
function stepWind(dt,t){
  const sl=slotScreen();if(!sl)return;
  const blowing=(st.on&&flap>0.8)||(st.clean>0&&flap>0.3);
  const lvl=st.clean>0&&!st.on?1:fanLevel();
  if(blowing){
    const n=lvl*16*dt*(1+cv.width/1600);
    for(let i=0;i<n;i++){
      const col=airColor(),sparkle=st.special&&(brand.id==='soyo'||brand.id==='aozora')&&Math.random()<0.25,snow=st.special&&brand.id==='polar'&&Math.random()<0.2;
      parts.push({x:sl.x+Math.random()*sl.w,y:sl.y,vx:sideAng*40*dpr+rand(-10,10)*dpr,vy:(20+vaneAng*80+lvl*12)*dpr,grow:rand(0.6,1.2),life:0,max:rand(1.4,2.4)*(1+lvl*0.1),col,sparkle,snow});
    }
  }
  ctx.clearRect(0,0,cv.width,cv.height);
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.life+=dt;if(p.life>p.max){parts.splice(i,1);continue}
    const spd=1+lvl*0.25;p.x+=p.vx*dt*spd+ (p.x-(sl.x+sl.w/2))*dt*0.25;p.y+=p.vy*dt*spd;p.vy+=(st.mode==='heat'?-6:8)*dt*dpr;
    const a=Math.sin(Math.PI*p.life/p.max)*(p.sparkle||p.snow?0.95:0.45),len=(10+p.life*30*p.grow)*dpr;
    if(p.snow){ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.beginPath();ctx.arc(p.x,p.y,3*dpr*p.grow,0,7);ctx.fill();continue}
    if(p.sparkle){ctx.fillStyle=`rgba(255,255,200,${a})`;const r=2.5*dpr;ctx.fillRect(p.x-r,p.y-r/3,r*2,r*0.66);ctx.fillRect(p.x-r/3,p.y-r,r*0.66,r*2);continue}
    ctx.strokeStyle=`rgba(${p.col[0]},${p.col[1]},${p.col[2]},${a})`;ctx.lineWidth=(2+p.life*3*p.grow)*dpr;ctx.lineCap='round';
    const vl=Math.hypot(p.vx,p.vy)||1;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx/vl*len,p.y-p.vy/vl*len);ctx.stroke();
  }
}

// ---------- brand tabs ----------
function selectBrand(b){
  brand=b;st=states[b.id];
  document.querySelectorAll('.brand').forEach(e=>e.classList.toggle('sel',e.dataset.id===b.id));
  buildAC();buildRemote();parts.length=0;flap=st.on?1:0;
}
BRANDS.forEach(b=>{const e=el('button','brand',b.short);e.dataset.id=b.id;e.style.color=b.color;e.onclick=()=>{selectBrand(b);audio();beep(900,.04,0,.03)};$('brands').appendChild(e)});

// ---------- loop ----------
let last=performance.now(),t=0;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;t+=dt;
  if(!document.hidden){
    if(st.clean>0){st.clean-=dt;if(st.clean<=0){st.clean=0;beep(brand.beep,.06);renderLCD()}}
    const targetFlap=st.on?1:st.clean>0?0.4:0;
    flap+=(targetFlap-flap)*Math.min(1,dt*(targetFlap>flap?1.6:2.5));
    let vt=st.vane==='swing'?0.5+0.5*Math.sin(t*1.2):st.vane===0?0.35:(st.vane-1)/4;
    if(!st.on)vt=0;
    vaneAng+=(vt-vaneAng)*Math.min(1,dt*3);
    let stg=st.side==='swing'?Math.sin(t*0.9)*2:st.side;if(!st.on)stg=0;
    sideAng+=(stg-sideAng)*Math.min(1,dt*3);
    // room temperature drifts toward the setting
    const lvl=fanLevel();
    if(st.on){
      let target=roomT;
      if(st.mode==='cool'||st.mode==='heat'||st.mode==='auto')target=st.temp-(st.special&&brand.id==='polar'?4:0);
      if(st.mode==='dry')target=Math.min(roomT,st.temp+1);
      if(st.mode==='cool'&&target>roomT)target=roomT;if(st.mode==='heat'&&target<roomT)target=roomT;
      roomT+=(target-roomT)*Math.min(1,dt*0.04*lvl);
    }else roomT+=(30-roomT)*dt*0.01;
    $('thermo').textContent=`へや ${roomT.toFixed(1)}℃`;
    const cold=clamp((26-roomT)/8,0,1),hot=clamp((roomT-26)/6,0,1);
    $('tint').style.background=`linear-gradient(rgba(120,190,255,${cold*0.35}),rgba(120,190,255,${cold*0.2})),linear-gradient(rgba(255,150,80,${hot*0.25}),rgba(255,150,80,${hot*0.12}))`;
    if(humG)humG.gain.value=muted?0:(st.on&&flap>0.5?0.02+lvl*0.012:st.clean>0?0.015:0);
    updateAC(t);stepWind(dt,t);
  }
  requestAnimationFrame(frame);
}
resize();selectBrand(BRANDS[0]);requestAnimationFrame(frame);
})();
</script>

<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('../sw.js').catch(()=>{}));</script>
