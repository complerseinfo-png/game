<html lang="ja">
<head>

<meta name="theme-color" content="#9fd8ff">
<title>すべりだい だいすき</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--ink:#2a2430;--font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#9fd8ff;font-family:var(--font);color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
[hidden]{display:none!important}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none}#hud>*{pointer-events:auto}
.pill{position:absolute;font:800 15px var(--font);padding:6px 12px;border-radius:999px;border:3px solid var(--ink);background:#fff;color:var(--ink)}
#mute{top:10px;left:10px}#full{top:10px;left:100px}
#map{position:absolute;top:10px;right:10px;width:min(26vw,200px);border:4px solid var(--ink);border-radius:14px;background:#9ad57a;box-shadow:0 4px 0 var(--ink);cursor:pointer}
#score{position:absolute;left:50%;top:10px;transform:translateX(-50%);font:800 18px var(--font);background:rgba(255,255,255,.92);border:3px solid var(--ink);border-radius:999px;padding:4px 16px;pointer-events:none;white-space:nowrap}
#toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);font:800 clamp(24px,5vw,46px) var(--font);color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink);white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none}

#act:active{transform:translateX(-50%) translateY(4px);box-shadow:0 2px 0 var(--ink)}
.sb{position:absolute;bottom:24px;width:clamp(100px,18vw,150px);height:clamp(100px,18vw,150px);border-radius:50%;border:6px solid var(--ink);background:rgba(255,255,255,.9);font:800 54px var(--font);color:var(--ink);box-shadow:0 6px 0 var(--ink)}
.sb.on{background:#ffcc33}.sb.hint{animation:hint .35s infinite alternate}
@keyframes hint{from{box-shadow:0 6px 0 var(--ink),0 0 0 0 #ff4a6a}to{box-shadow:0 6px 0 var(--ink),0 0 0 14px #ff4a6a}}
#bL{left:18px}#bR{right:18px}
#gauge{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);width:min(44vw,320px)}
#rot{position:absolute;right:12px;bottom:12px;display:flex;gap:10px}
.rb{font:800 28px var(--font);width:64px;height:64px;border-radius:50%;border:4px solid var(--ink);background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--ink)}
#hint{position:absolute;left:14px;bottom:14px;font:800 15px var(--font);background:rgba(255,255,255,.88);border:3px solid var(--ink);border-radius:14px;padding:6px 10px;pointer-events:none}
.ov{position:fixed;inset:0;display:grid;place-items:center;background:rgba(20,40,60,.5);z-index:20;padding:16px}
.card{background:#fffaf0;border:5px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:22px 26px;max-width:560px;width:100%;text-align:center}
.card h1{margin:0 0 6px;font-size:clamp(28px,6.5vw,48px);white-space:nowrap;color:#ff7a2a;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.card p{margin:6px 0;font-size:18px}
.big{font:800 30px var(--font);padding:12px 48px;border-radius:999px;border:4px solid var(--ink);background:#ffcc33;color:var(--ink);box-shadow:0 6px 0 var(--ink);margin-top:12px}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#9fd8ff;font:800 28px var(--font);z-index:30}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <button class="pill" id="mute">おと ON</button><button class="pill" id="full">ぜんがめん</button>
  <canvas id="map" width="400" height="300"></canvas>
  <div id="score">きれいに すべれた 0/9</div>
  <div id="toast"></div>
  <button id="act" hidden>のぼる！</button>
  <button class="sb" id="bL" hidden>◀</button><button class="sb" id="bR" hidden>▶</button>
  <canvas id="gauge" width="320" height="120" hidden></canvas>
  <div id="rot"><button class="rb" id="rotL">⟲</button><button class="rb" id="rotR">⟳</button></div>
  <div id="hint">スワイプで はしる ・ タッチで とまる</div>
</div>
<div class="ov" id="title"><div class="card"><h1>すべりだい だいすき</h1><p>はしごを のぼって すべろう！</p><p>すべる ときは ◀ ▶ で からだを まっすぐに！</p><p>ぐらぐらすると へんな かっこうで おちちゃうよ</p><button class="big" id="startBtn">あそぶ！</button></div></div>
<div id="loading">よみこみちゅう…</div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a);

const FONT='"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif';
// ---------- sound ----------

function tone(f,d,type='sine',vol=.08,slide=0,delay=0){if(muted||!audio())return;const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(master);o.start(t);o.stop(t+d+.05)}
function noise(d,vol=.1,f=1000,q=1,delay=0,type='bandpass',fEnd=0){if(muted||!audio())return;const t=ac.currentTime+delay,n=Math.floor(ac.sampleRate*d),b=ac.createBuffer(1,n,ac.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=Math.random()*2-1;const s=ac.createBufferSource();s.buffer=b;const fl=ac.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t);if(fEnd)fl.frequency.exponentialRampToValueAtTime(fEnd,t+d);fl.Q.value=q;const g=ac.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl).connect(g).connect(master);s.start(t)}
let swoosh=null;
function swooshOn(v){if(!audio())return;if(!swoosh){const n=ac.sampleRate*2,b=ac.createBuffer(1,n,ac.sampleRate),c=b.getChannelData(0);let l=0;for(let i=0;i<n;i++){l=l*0.95+(Math.random()*2-1)*0.05;c[i]=l*5}const s=ac.createBufferSource();s.buffer=b;s.loop=true;const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=900;f.Q.value=0.5;swoosh=ac.createGain();swoosh.gain.value=0;s.connect(f).connect(swoosh).connect(master);s.start()}swoosh.gain.setTargetAtTime(muted?0:v,ac.currentTime,0.15)}
function chime(){[523,659,784,1047].forEach((f,i)=>tone(f,.35,'triangle',.07,0,i*.1))}
// ---------- three ----------
const canvas=$('c');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});let quality=Math.min(1.5,devicePixelRatio||1);renderer.setPixelRatio(quality);
const scene=new THREE.Scene();const SKY=0x9fd8ff;scene.background=new THREE.Color(SKY);scene.fog=new THREE.Fog(SKY,80,220);

scene.add(new THREE.HemisphereLight(0xffffff,0x6a8a4a,0.78));const sun=new THREE.DirectionalLight(0xfff4e0,0.5);sun.position.set(-30,60,30);scene.add(sun);
const lam=c=>new THREE.MeshLambertMaterial({color:c});const flat=c=>new THREE.MeshPhongMaterial({color:c,flatShading:true,shininess:5});const basic=c=>new THREE.MeshBasicMaterial({color:c});
function mesh(geo,mat,x=0,y=0,z=0,p){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);(p||scene).add(m);return m}
const SPH=new THREE.SphereGeometry(1,16,12);

function cyl(rt,rb,h,mat,x,y,z,p,seg=12){return mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat,x,y,z,p)}
function boxm(w,h,d,mat,x,y,z,p){return mesh(new THREE.BoxGeometry(w,h,d),mat,x,y,z,p)}
function grp(x=0,y=0,z=0,p){const g=new THREE.Group();g.position.set(x,y,z);(p||scene).add(g);return g}
function beam(a,b,r,mat,p){const d=new THREE.Vector3().subVectors(b,a);const L=d.length();const m=cyl(r,r,L,mat,(a.x+b.x)/2,(a.y+b.y)/2,(a.z+b.z)/2,p,8);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());return m}
function signTex(text,bg){const c=document.createElement('canvas');c.width=512;c.height=128;const g=c.getContext('2d');g.fillStyle=bg;g.beginPath();g.roundRect?g.roundRect(4,4,504,120,40):g.rect(4,4,504,120);g.fill();g.fillStyle='#fff';g.font=`800 ${text.length>8?52:64}px ${FONT}`;g.textAlign='center';g.textBaseline='middle';g.fillText(text,256,68);return new THREE.CanvasTexture(c)}
function floatSign(text,x,y,z,bg,w=7){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:signTex(text,bg),fog:false}));s.scale.set(w,w/4,1);s.position.set(x,y,z);scene.add(s);return s}

// ---------- ground ----------
const FW=90,FD=70;
{const c=document.createElement('canvas');c.width=1024;c.height=800;const g=c.getContext('2d');g.fillStyle='#8fd06a';g.fillRect(0,0,1024,800);for(let i=0;i<6000;i++){g.fillStyle=Math.random()<.5?'rgba(255,255,255,.08)':'rgba(30,90,20,.1)';g.fillRect(Math.random()*1024,Math.random()*800,3,7)}
  g.fillStyle='#f4e8c4';g.beginPath();g.arc(512,400,90,0,7);g.fill();window.__GT=c;
  const t=new THREE.CanvasTexture(c);const m=mesh(new THREE.PlaneGeometry(FW*2,FD*2),new THREE.MeshLambertMaterial({map:t}));m.rotation.x=-Math.PI/2;
  const o=mesh(new THREE.PlaneGeometry(800,800),lam(0x7cbf58),0,-0.05,0);o.rotation.x=-Math.PI/2}
for(const[x,z,r]of[[-150,-120,70],[60,-170,80],[170,40,60],[-170,90,60],[30,170,60]]){const h=ball(r,flat(0x6fb24a),x,-r*0.55,z);h.scale.y*=0.6}
{const fm=lam(0xffffff);for(const[a,b,c2,d]of[[-FW,-FD,FW,-FD],[FW,-FD,FW,FD],[FW,FD,-FW,FD],[-FW,FD,-FW,-FD]]){const L=Math.hypot(c2-a,d-b);for(let k=0;k<L;k+=3)cyl(0.1,0.1,1.4,fm,a+(c2-a)*k/L,0.7,b+(d-b)*k/L,null,5);const r=boxm(L,0.15,0.1,fm,(a+c2)/2,1.2,(b+d)/2);r.rotation.y=-Math.atan2(d-b,c2-a)}}
{const ts=[];for(let i=0;i<70;i++){const a=rand(0,6.28),x=Math.cos(a)*rand(70,86),z=Math.sin(a)*rand(52,66);ts.push([x,z])}
 const tr=new THREE.InstancedMesh(new THREE.CylinderGeometry(0.35,0.5,3,6),lam(0x8a5a3a),ts.length),cr=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(2.4,0),flat(0x3f9a45),ts.length);const m4=new THREE.Matrix4();
 ts.forEach(([x,z],i)=>{m4.makeTranslation(x,1.5,z);tr.setMatrixAt(i,m4);m4.makeTranslation(x,4.2,z);cr.setMatrixAt(i,m4)});scene.add(tr);scene.add(cr)}

// ---------- slides ----------
const UP=new THREE.Vector3(0,1,0);
const SLIDES=[];
function smooth(t){return t*t*(3-2*t)}
function makeSlide(o){
  // o: name,color,w,wall,pts(local [x,y,z] from top),x,z,rot,bumpy,instab,tube,rainbow
  const g=grp(o.x,0,o.z);g.rotation.y=o.rot||0;g.updateMatrixWorld();
  const pts=o.pts.map(p=>new THREE.Vector3(...p).applyMatrix4(g.matrixWorld));
  const curve=new THREE.CatmullRomCurve3(pts);const L=curve.getLength();
  const N=Math.max(40,Math.ceil(L*3)),M=o.tube?20:14;const pos=[],col=[],idx=[];const cc=new THREE.Color();
  const frames=[];let prevSide=null;
  for(let i=0;i<=N;i++){const u=i/N,p=curve.getPointAt(u),t=curve.getTangentAt(u);let side=new THREE.Vector3().crossVectors(UP,t);if(side.lengthSq()<1e-4)side.copy(prevSide);side.normalize();prevSide=side;const up=new THREE.Vector3().crossVectors(t,side).normalize();frames.push({p,t,side,up});
    for(let j=0;j<=M;j++){let x,yy;if(o.tube){const a=-Math.PI/2+(j/M)*Math.PI*2;x=Math.cos(a)*o.w/2;yy=(Math.sin(a)+1)*o.w/2}else{x=(j/M-0.5)*o.w;yy=o.wall*Math.pow(Math.abs(x)/(o.w/2),4)}
      pos.push(p.x+side.x*x+up.x*yy,p.y+side.y*x+up.y*yy,p.z+side.z*x+up.z*yy);
      if(o.rainbow)cc.setHSL((j/M)*0.85,0.85,0.6);else cc.setHex(o.color).offsetHSL(0,0,(j%2?0.03:0));col.push(cc.r,cc.g,cc.b);
      if(i<N&&j<M){const a=i*(M+1)+j;idx.push(a,a+M+1,a+1,a+1,a+M+1,a+M+2)}}}
  const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));geo.setAttribute('color',new THREE.Float32BufferAttribute(col,3));geo.setIndex(idx);geo.computeVertexNormals();
  const bed=new THREE.Mesh(geo,new THREE.MeshPhongMaterial({vertexColors:true,side:THREE.DoubleSide,shininess:90,transparent:!!o.tube,opacity:o.tube?0.55:1,depthWrite:!o.tube}));scene.add(bed);
  if(!o.tube)for(const s of[-1,1]){const rp=frames.map(f=>f.p.clone().addScaledVector(f.side,s*o.w/2).addScaledVector(f.up,o.wall+0.08));mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(rp),N,0.1,5),lam(0xffffff))}
  // supports
  for(let s=1.5;s<L;s+=3){const f=frames[Math.round(s/L*N)];if(f.p.y<0.9)continue;cyl(0.14,0.18,f.p.y-0.05,lam(0xcfd5da),f.p.x,(f.p.y-0.05)/2,f.p.z,null,6)}
  // top deck + ladder behind it
  const f0=frames[0];const back=new THREE.Vector3(f0.t.x,0,f0.t.z).normalize();const H=f0.p.y;
  const deck=f0.p.clone().addScaledVector(back,-1.1);const dg=grp(deck.x,0,deck.z);dg.rotation.y=Math.atan2(back.x,back.z);
  boxm(o.w+0.8,0.25,2.2,lam(0xf2f2f2),0,H-0.15,0,dg);for(const s of[-1,1]){boxm(0.1,1.1,2.2,lam(o.color),s*(o.w/2+0.4),H+0.4,0,dg);cyl(0.12,0.12,H,lam(0xcfd5da),s*(o.w/2+0.3),H/2,-1,dg,6);cyl(0.12,0.12,H,lam(0xcfd5da),s*(o.w/2+0.3),H/2,1,dg,6)}
  boxm(o.w+0.8,1.1,0.1,lam(o.color),0,H+0.4,1.1,dg).visible=false;
  // ladder (stairs when tall)
  const lad=grp(0,0,-1.15,dg);for(const s of[-0.5,0.5])cyl(0.06,0.06,H+1.2,lam(o.ladder||0xffd23b),s,(H+1.2)/2,0,lad,6);for(let y=0.35;y<H;y+=0.4)cyl(0.04,0.04,1,lam(0xffffff),0,y,0,lad,5).rotation.z=Math.PI/2;
  const ladderBase=new THREE.Vector3(0,0,-1.6).applyMatrix4(dg.matrixWorld||(dg.updateMatrixWorld(),dg.matrixWorld));dg.updateMatrixWorld();ladderBase.copy(new THREE.Vector3(0,0,-1.7)).applyMatrix4(dg.matrixWorld);

  const fe=frames[N];const out=new THREE.Vector3(fe.t.x,0,fe.t.z).normalize();const pitC=fe.p.clone().addScaledVector(out,3);const pit=mesh(new THREE.CircleGeometry(3.6,24),lam(0xf0dca0),pitC.x,0.03,pitC.z);pit.rotation.x=-Math.PI/2;

  const sign=floatSign(o.name,deck.x,H+3,deck.z,'#'+new THREE.Color(o.color).getHexString(),7);
  const S={...o,curve,L,frames,N,ladderBase,ladderTop,seat,H,out,pitC,clean:false,sign,pad};SLIDES.push(S);return S}
// local shapes (+z downhill)
const straight=(h,len,n=8)=>{const a=[];for(let i=0;i<=n;i++){const t=i/n;a.push([0,0.35+(h-0.35)*(1-smooth(Math.min(1,t*1.05))),t*len])}return a};
makeSlide({name:'ちいさい すべりだい',color:0xff8ad8,w:1.4,wall:0.35,pts:straight(2,4.5,5),x:-8,z:10,rot:0.3,bumpy:0,instab:0.4});
makeSlide({name:'ふつうの すべりだい',color:0xffd23b,w:1.5,wall:0.4,pts:straight(3.8,8,6),x:14,z:12,rot:-0.4,bumpy:0.2,instab:1});
makeSlide({name:'ながーい すべりだい',color:0x3fa9f5,w:1.6,wall:0.45,pts:straight(6,30,10),x:-40,z:-30,rot:0.55,bumpy:0.3,instab:1.2});
{const a=[];const turns=2.4,r=4,h=9;for(let i=0;i<=40;i++){const t=i/40,ang=t*turns*Math.PI*2;a.push([Math.cos(ang)*r-r,0.4+(h-0.4)*(1-t),Math.sin(ang)*r])}a.push([a[40][0]+0.5,0.35,a[40][2]+3]);
 makeSlide({name:'ぐるぐる らせん',color:0x6fdc6f,w:1.6,wall:0.6,pts:a,x:35,z:-28,rot:0,bumpy:0.2,instab:1.3})}
{const a=[];const h=6,len=24;for(let i=0;i<=24;i++){const t=i/24;a.push([0,0.35+(h-0.35)*(1-t)+Math.sin(t*Math.PI*5)*0.7*(1-t*0.7),t*len])}makeSlide({name:'なみなみ すべりだい',color:0xff9a2a,w:1.8,wall:0.45,pts:a,x:42,z:20,rot:-1.3,bumpy:1.3,instab:1.3})}
makeSlide({name:'ひろーい すべりだい',color:0xffffff,w:12,wall:0.8,rainbow:1,pts:straight(6.5,18,8),x:-30,z:24,rot:2.6,bumpy:0.4,instab:1.1,wide:1});
{const a=[];const h=8,len=28;for(let i=0;i<=28;i++){const t=i/28;a.push([Math.sin(t*Math.PI*3)*5,0.35+(h-0.35)*(1-smooth(t)),t*len])}makeSlide({name:'くねくね すべりだい',color:0xb36ad1,w:1.7,wall:0.6,pts:a,x:-60,z:5,rot:-1.4,bumpy:0.3,instab:1.4})}
{const a=[];const h=7,len=22;for(let i=0;i<=22;i++){const t=i/22;a.push([Math.sin(t*Math.PI*2)*4,0.6+(h-0.6)*(1-t),t*len])}makeSlide({name:'トンネル すべりだい',color:0x5ad8e8,w:2.2,wall:0,tube:1,pts:a,x:10,z:-40,rot:0.2,bumpy:0.4,instab:1.2})}
{const a=[];const h=15,len=34;for(let i=0;i<=16;i++){const t=i/16;const y=t<0.35?h-(h-3)*Math.pow(t/0.35,1.3)*0.9:Math.max(0.35,(h-(h-3)*0.9)*(1-(t-0.35)/0.65));a.push([0,y,t*len])}makeSlide({name:'メガ すべりだい',color:0xe8402a,w:2,wall:0.6,pts:a,x:62,z:-8,rot:-2.2,bumpy:0.6,instab:1.6,ladder:0xffffff})}

// ---------- the boy (with joints for poses) ----------
function makeBoy(){const g=new THREE.Group();scene.add(g);const pose=grp(0,0,0,g);const root=grp(0,0,0,pose);const skin=lam(0xffd9b8);const P={g,pose,root,legs:[],arms:[]};

// ---------- state ----------
const B={x:0,z:2,h:Math.PI,v:0};
let state='walk',cur=null,started=false,toastT=0,shake=0;
const P={s:0,v:0,lat:0,latV:0,phi:0,phiV:0,t:0,pose:null,fallT:0,landT:0,climbT:0};

const keys={};addEventListener('keydown',e=>keys[e.code]=true);addEventListener('keyup',e=>keys[e.code]=false);
const press={l:false,r:false};
for(const[id,k]of[['bL','l'],['bR','r']]){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();press[k]=true;b.classList.add('on')});for(const ev of['pointerup','pointerleave','pointercancel'])b.addEventListener(ev,()=>{press[k]=false;b.classList.remove('on')})}
let rotDir=0;for(const[id,d]of[['rotL',1],['rotR',-1]]){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();rotDir=d});for(const ev of['pointerup','pointerleave','pointercancel'])b.addEventListener(ev,()=>rotDir=0)}
// swipe to run, tap to stop

const marker=mesh(new THREE.RingGeometry(0.5,0.8,24),new THREE.MeshBasicMaterial({color:0xffd23b,transparent:true,opacity:0.9,depthWrite:false}),0,0.06,0);marker.rotation.x=-Math.PI/2;marker.visible=false;
function swipeRun(dx,dy){const fx=-Math.sin(camYaw),fz=-Math.cos(camYaw),rx=-fz,rz=fx;let wx=rx*dx+fx*(-dy),wz=rz*dx+fz*(-dy);const l=Math.hypot(wx,wz)||1;go.target={x:clamp(B.x+wx/l*20,-FW+1,FW-1),z:clamp(B.z+wz/l*20,-FD+1,FD-1)};go.stuck=0;marker.position.set(go.target.x,0.06,go.target.z);marker.visible=true;go.swiped=true;$('hint').hidden=true}

// ---------- map (tap to warp) ----------
const mapC=$('map'),mg=mapC.getContext('2d');
function drawMap(){const w=mapC.width,h=mapC.height;mg.drawImage(window.__GT,0,0,w,h);const sx=w/(FW*2),sz=h/(FD*2);
  for(const s of SLIDES){mg.strokeStyle='#'+new THREE.Color(s.color===0xffffff?0xff5a8a:s.color).getHexString();mg.lineWidth=6;mg.beginPath();for(let i=0;i<=20;i++){const p=s.curve.getPointAt(i/20);const x=(p.x+FW)*sx,y=(p.z+FD)*sz;i?mg.lineTo(x,y):mg.moveTo(x,y)}mg.stroke();
    const x=(s.ladderBase.x+FW)*sx,y=(s.ladderBase.z+FD)*sz;mg.fillStyle=s.clean?'#ffd23b':'#fff';mg.strokeStyle='#2a2430';mg.lineWidth=3;mg.beginPath();mg.arc(x,y,8,0,7);mg.fill();mg.stroke()}
  const bx=(B.x+FW)*sx,by=(B.z+FD)*sz;mg.save();mg.translate(bx,by);mg.rotate(-B.h+Math.PI);mg.fillStyle='#ff4a3a';mg.strokeStyle='#2a2430';mg.lineWidth=3;mg.beginPath();mg.moveTo(0,-11);mg.lineTo(8,8);mg.lineTo(-8,8);mg.closePath();mg.fill();mg.stroke();mg.restore()}
mapC.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(state!=='walk'||!started)return;const rc=mapC.getBoundingClientRect();const mx=(e.clientX-rc.left)/rc.width*FW*2-FW,mz=(e.clientY-rc.top)/rc.height*FD*2-FD;

  if(best){B.x=best.ladderBase.x-Math.sin(Math.atan2(best.ladderTop.x-best.ladderBase.x,best.ladderTop.z-best.ladderBase.z))*1.5;B.z=best.ladderBase.z-Math.cos(Math.atan2(best.ladderTop.x-best.ladderBase.x,best.ladderTop.z-best.ladderBase.z))*1.5;toast(best.name+'へ ワープ！',1.4)}else{B.x=mx;B.z=mz;toast('ワープ！',1)}
  go.target=null;marker.visible=false;camYaw=B.h+Math.PI;[880,1320,1760].forEach((f,i)=>tone(f,.12,'sine',.06,0,i*.06))});

// ---------- flow ----------
function nearSlide(){for(const s of SLIDES)if(Math.hypot(B.x-s.ladderBase.x,B.z-s.ladderBase.z)<2.2)return s;return null}
$('act').addEventListener('click',()=>{if(state==='walk'){const s=nearSlide();if(s)startClimb(s)}else if(state==='top')startSlide()});
function startClimb(s){cur=s;state='climb';P.climbT=0;$('act').hidden=true;$('rot').hidden=true;go.target=null;marker.visible=false;resetPose();toast('よいしょ よいしょ',1.5)}

const POSES=['belly','back','spin','roll','upside','star'];

    B.x=clamp(B.x,-FW+1,FW-1);B.z=clamp(B.z,-FD+1,FD-1);if(go.target&&m>0.1&&Math.hypot(B.x-px,B.z-pz)<0.01){go.stuck+=dt;if(go.stuck>0.6){go.target=null;marker.visible=false}}

  else if(state==='top'){P.topT+=dt;boy.legs.forEach(l=>l.rotation.x=-1.45);boy.root.position.y=-0.42;boy.arms.forEach((a,i)=>a.rotation.z=(i?1:-1)*0.6);if(P.topT>6)startSlide()}

    P.v+=(9.8*slope*(state==='fallen'?0.95:1)-0.25*P.v-0.015*P.v*P.v)*dt;if(P.v<1.2)P.v=1.2;

      boy.arms.forEach((a,i)=>{const s=i?1:-1;a.rotation.z=s*(0.5+Math.max(0,s*P.phi)*2.2+Math.abs(P.phi)*Math.sin(P.t*20)*0.5)});boy.mouth.rotation.z=Math.abs(P.phi)>0.45?0:Math.PI;}

function updScore(){const n=SLIDES.filter(s=>s.clean).length;$('score').textContent=`きれいに すべれた ${n}/${SLIDES.length}`;if(n===SLIDES.length)setTimeout(()=>toast('ぜんぶ クリア！ すごい！',3),1800)}

// ---------- loop ----------
let last=performance.now(),frames=0,fpsT=0;
function frame(now){const dt=Math.max(0,Math.min(0.05,(now-last)/1000));last=now;const t=now/1000;
  if(started)update(dt,t);else{camera.position.set(Math.sin(t*0.1)*60,30,Math.cos(t*0.1)*50);camera.lookAt(0,4,0)}
  for(const s of SLIDES){const d=Math.hypot(s.sign.position.x-B.x,s.sign.position.z-B.z);s.sign.visible=(state==='walk'||!started)&&d<70&&d>6}
  if(Math.floor(t*4)!==Math.floor((t-dt)*4))drawMap();
  renderer.render(scene,camera);
  frames++;fpsT+=dt;if(fpsT>3){const fps=frames/fpsT;if(fps<28&&quality>0.7){quality=Math.max(0.7,quality-0.25);renderer.setPixelRatio(quality);resize()}frames=0;fpsT=0}
  requestAnimationFrame(frame)}
function goFull(){const el=document.documentElement,f=el.requestFullscreen||el.webkitRequestFullscreen;if(!f||document.fullscreenElement||document.webkitFullscreenElement)return;try{const r=f.call(el,{navigationUI:'hide'});if(r&&r.catch)r.catch(()=>{})}catch(e){}}
$('full').onclick=()=>{if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document);else goFull()};
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'おと OFF':'おと ON';swooshOn(0)};
$('startBtn').onclick=()=>{audio();goFull();$('title').hidden=true;started=true;camYaw=B.h+Math.PI;camera.position.set(B.x+Math.sin(camYaw)*9,5,B.z+Math.cos(camYaw)*9);toast('すきな すべりだいへ いこう！',2.2)};
resize();boy.g.position.set(B.x,0,B.z);boy.g.rotation.y=B.h;
$('loading').hidden=true;requestAnimationFrame(frame);

})();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('../sw.js').catch(()=>{}));</script>
