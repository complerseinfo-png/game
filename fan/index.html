<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ふきとばせ！せんぷうき</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: full-screen 3D room, HTML overlays for HUD and menus. One bright "messy home" look on purpose. */
:root{
  --wall:#eef3f7; --ink:#24324a; --paper:#ffffff; --sky:#9fd8ff; --accent:#ffcc33; --wind:#3fb6ff; --red:#ff5a5a;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--wall);color:var(--ink);font-family:var(--font)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-tap-highlight-color:transparent}
.hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));
  pointer-events:none;font-weight:800}
.pill{background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:4px 12px;font-size:clamp(13px,3.6vw,18px);
  font-variant-numeric:tabular-nums;box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.col{display:grid;gap:6px;justify-items:start;min-width:0}
.mid{display:grid;gap:6px;justify-items:center;min-width:0}
.lv{background:var(--wind);color:#fff;-webkit-text-stroke:0;font-size:clamp(14px,4vw,20px)}
.bar{width:clamp(120px,34vw,200px);height:16px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden;box-shadow:0 3px 0 var(--ink)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7be04a,#ffd23a);transition:width .3s}
.mute{pointer-events:auto;font:inherit;cursor:pointer;color:var(--ink)}
#joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:3px solid rgba(255,255,255,.9);background:rgba(255,255,255,.22);pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 2px 6px rgba(0,0,0,.25)}
#trail{position:fixed;height:10px;margin-top:-5px;border-radius:5px;background:rgba(255,255,255,.9);transform-origin:0 50%;
  pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:0 0 0 3px rgba(36,50,74,.35)}
.mk{position:fixed;margin:-16px 0 0 -30px;width:60px;height:32px;border-radius:10px;border:3px solid var(--ink);background:var(--sky);
  pointer-events:none;font-weight:800;font-size:14px;display:grid;place-items:center;box-shadow:0 2px 0 var(--ink)}
#toast{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);font-weight:800;font-size:clamp(20px,6vw,40px);width:max-content;max-width:92vw;color:#fff;
  -webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);pointer-events:none;white-space:normal;line-height:1.25;transition:opacity .3s;text-align:center}
.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-left,0px));background:rgba(36,50,74,.3);overflow:auto}
.card{background:var(--paper);border:4px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);
  padding:22px 20px;max-width:460px;width:100%;text-align:center;display:grid;gap:12px}
.card h1{margin:0;font-size:clamp(28px,8vw,46px);line-height:1.1;font-weight:800;color:var(--wind);
  -webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);text-wrap:balance}
.card p{margin:0;font-size:15px;line-height:1.6;font-weight:500}
.ladder{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;font-size:12px;font-weight:800}
.ladder span{background:#e6f5ff;border:2px solid var(--ink);border-radius:10px;padding:3px 7px}
.btn{font:inherit;font-weight:800;font-size:24px;background:var(--accent);color:var(--ink);border:4px solid var(--ink);
  border-radius:999px;padding:12px 24px;box-shadow:0 6px 0 var(--ink);cursor:pointer;justify-self:center;min-width:220px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.btn:focus-visible,.mute:focus-visible{outline:4px solid #2b7bff;outline-offset:3px}
.small{font-size:13px!important;opacity:.85}
.big{font-size:clamp(26px,7vw,36px);font-weight:800;font-variant-numeric:tabular-nums}
.new{color:var(--red);font-weight:800}
.loading{background:var(--wall);align-content:center;justify-items:center;gap:18px}
.lfan{width:90px;height:90px;border-radius:50%;border:5px solid var(--ink);background:#fff;position:relative;animation:spin .8s linear infinite}
.lfan::before,.lfan::after{content:"";position:absolute;left:50%;top:6px;width:24px;height:36px;margin-left:-12px;border-radius:50%;background:var(--wind)}
.lfan::after{transform:rotate(120deg);transform-origin:12px 39px}
@keyframes spin{to{transform:rotate(360deg)}}
.ltext{font-weight:800;font-size:20px}
@media (prefers-reduced-motion:reduce){.lfan{animation:none}}
[hidden]{display:none!important}
</style>
</head>
<body>

<canvas id="c" aria-label="ゲーム画面"></canvas>
<div class="hud">
  <div class="col"><div class="pill lv" id="lv">ハンディせんぷうき</div><div class="bar" aria-label="パワーアップまで"><i id="barFill"></i></div><div class="pill" id="batt">パワーアップまで 40びょう</div></div>
  <div class="mid"><div class="pill" id="left">のこり 0</div></div>
  <button class="pill mute" id="mute">おと ON</button>
</div>
<div id="joy" hidden><div id="knob"></div></div>
<div class="mk" id="mkWin" hidden>まど</div>
<div id="toast" style="opacity:0"></div>

<div class="overlay loading" id="loading">
  <div class="lfan" aria-hidden="true"></div>
  <div class="ltext" id="ltext">よみこみちゅう…</div>
</div>

<div class="overlay" id="menu" hidden>
  <div class="card">
    <h1>ふきとばせ！<br>せんぷうき</h1>
    <button class="btn" id="startBtn">スタート</button>
    <p class="small" id="bestLine"></p>
    <div class="ladder"><span>ハンディ</span>→<span>たくじょう</span>→<span>かていよう</span>→<span>ぎょうむよう</span>→<span>ちょうきょだい</span></div>
    <p>がめんを <b>おしたまま ゆびを うごかす</b> と すすむよ。せんぷうきは むいている ほうに かぜを だすよ。<br>40びょう ごとに せんぷうきが <b>パワーアップ</b>！<br>ゴミや ものは ひらいた <b>まど</b>から そとへ ふきとばそう。</p>
    <p class="small">いえの なかを ぜんぶ そとに だしたら クリア！ ねこは もどってくるよ<br>パソコンは やじるしキー でも うごかせます</p>
  </div>
</div>

<div class="overlay" id="over" hidden>
  <div class="card">
    <h1>クリア！</h1>
    <div class="big" id="finalTime">0 びょう</div>
    <p id="finalDetail">いえが からっぽに なった！</p>
    <p id="bestMsg"></p>
    <button class="btn" id="againBtn">もういちど</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);
if(!window.THREE){$('ltext').textContent='よみこめませんでした。もういちど ひらいてね';return;}
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];

// ---------- renderer / scene ----------
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9fd8ff);
const camera=new THREE.PerspectiveCamera(58,1,0.1,300);
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?72:58;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
scene.add(new THREE.HemisphereLight(0xffffff,0x8a8a7a,0.8));
const sun=new THREE.DirectionalLight(0xfff6e0,0.7);
sun.position.set(14,26,8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-26,right:30,top:20,bottom:-20,near:1,far:80});sun.shadow.bias=-0.0008;
scene.add(sun);

const lam=c=>new THREE.MeshLambertMaterial({color:c});
const phongFlat=c=>new THREE.MeshPhongMaterial({color:c,flatShading:true,shininess:5});
function mesh(geo,mat,x=0,y=0,z=0,parent=scene,shadow=true){
  const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);
  if(shadow){m.castShadow=true;m.receiveShadow=true}
  parent.add(m);return m;
}
function canvasTex(w,h,draw,rx=1,ry=1){
  const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);return t;
}
function makeLabel(text,color='#ff5a5a'){
  const c=document.createElement('canvas');c.width=256;c.height=96;const g=c.getContext('2d');
  g.fillStyle='#ffffff';g.strokeStyle='#24324a';g.lineWidth=8;
  g.beginPath();g.roundRect?g.roundRect(8,8,240,64,30):g.rect(8,8,240,64);g.fill();g.stroke();
  g.beginPath();g.moveTo(112,72);g.lineTo(128,92);g.lineTo(144,72);g.fill();
  g.fillStyle=color;g.font='800 38px "M PLUS Rounded 1c",sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(text,128,42);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));
  s.scale.set(2.6,1,1);s.renderOrder=10;return s;
}

// ---------- room: 1 unit ≈ 30cm. The big window on the right wall is wide open ----------
const W=16,D=12,WIN=5; // window opening: x=+W, |z|<WIN
const obs=[];
const box=(x,z,w,d,h,o={})=>{const b={t:'box',x,z,hx:w/2,hz:d/2,b:o.b||0,h,solid:o.solid!==false,platform:!!o.platform};obs.push(b);return b};
const circ=(x,z,r,h,o={})=>{const c={t:'circ',x,z,r,b:o.b||0,h,solid:o.solid!==false,platform:!!o.platform};obs.push(c);return c};
{
  const ft=canvasTex(512,512,(g,w,h)=>{
    const cols=['#d9a66a','#cf9a5e','#e0b07a','#d29f66'],pw=128;
    for(let i=0;i<w/pw;i++){let y=-(i*137)%300;while(y<h){const L=rand(260,420);g.fillStyle=pick(cols);g.fillRect(i*pw,y,pw,L);g.fillStyle='rgba(60,30,10,.3)';g.fillRect(i*pw,y,pw,3);y+=L}
      g.fillStyle='rgba(60,30,10,.35)';g.fillRect(i*pw,0,3,h)}
  },3,2.2);
  const floor=mesh(new THREE.PlaneGeometry(W*2,D*2),new THREE.MeshLambertMaterial({map:ft}),0,0,0);floor.rotation.x=-Math.PI/2;floor.castShadow=false;
  const dirt=canvasTex(1024,768,(g,w,h)=>{
    for(let i=0;i<70;i++){const x=rand(0,w),y=rand(0,h),r=rand(15,70);const gr=g.createRadialGradient(x,y,0,x,y,r);
      gr.addColorStop(0,`rgba(${pick(['90,70,50','70,70,70','110,90,40'])},${rand(.15,.35)})`);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.beginPath();g.ellipse(x,y,r,r*rand(.5,1),rand(0,3),0,7);g.fill()}
    for(let i=0;i<2500;i++){g.fillStyle=`rgba(80,70,60,${rand(.1,.4)})`;g.fillRect(rand(0,w),rand(0,h),rand(1,4),rand(1,3))}
    g.strokeStyle='rgba(60,60,60,.25)';g.lineWidth=1;for(let i=0;i<120;i++){const x=rand(0,w),y=rand(0,h);g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+rand(-15,15),y+rand(-15,15),x+rand(-25,25),y+rand(-25,25));g.stroke()}
  });
  const df=mesh(new THREE.PlaneGeometry(W*2,D*2),new THREE.MeshLambertMaterial({map:dirt,transparent:true,depthWrite:false}),0,0.012,0,scene,false);df.rotation.x=-Math.PI/2;df.receiveShadow=true;
  // garden outside the window
  const gt=canvasTex(256,256,(g,w)=>{g.fillStyle='#7cc46a';g.fillRect(0,0,w,w);for(let i=0;i<1500;i++){g.fillStyle=Math.random()<.5?'#8fd47a':'#6ab35a';g.fillRect(rand(0,w),rand(0,w),2,4)}},8,8);
  const garden=mesh(new THREE.PlaneGeometry(60,80),new THREE.MeshLambertMaterial({map:gt}),W+30,-0.02,0);garden.rotation.x=-Math.PI/2;garden.castShadow=false;
  for(let z=-36;z<=36;z+=3){mesh(new THREE.BoxGeometry(0.3,2.4,0.3),lam(0xffffff),W+28,1.2,z)}
  mesh(new THREE.BoxGeometry(0.15,0.3,72),lam(0xffffff),W+28,1.9,0);mesh(new THREE.BoxGeometry(0.15,0.3,72),lam(0xffffff),W+28,0.9,0);
  for(const[x,z,s]of[[W+20,-14,1.4],[W+24,10,1.8],[W+12,18,1.2],[W+10,-20,1.5]]){mesh(new THREE.CylinderGeometry(0.4*s,0.5*s,4*s,8),lam(0x8a5a3a),x,2*s,z);mesh(new THREE.IcosahedronGeometry(2.6*s,0),phongFlat(0x4f9a4a),x,5*s,z)}
  const wm=lam(0xeef3f7),bm=lam(0xffffff);
  const wall=(x,z,w,d,h)=>{mesh(new THREE.BoxGeometry(w,h,d),wm,x,h/2,z);mesh(new THREE.BoxGeometry(w+0.02,0.5,d+0.08),bm,x,0.25,z)};
  wall(0,-D-0.2,W*2+0.8,0.4,10);wall(-W-0.2,0,0.4,D*2,10);wall(0,D+0.2,W*2+0.8,0.4,10);
  // right wall with the open window
  wall(W+0.2,-(D+WIN)/2,0.4,D-WIN,10);wall(W+0.2,(D+WIN)/2,0.4,D-WIN,10);
  mesh(new THREE.BoxGeometry(0.4,2.4,WIN*2),wm,W+0.2,8.8,0);
  // window frame + glass panels slid fully open
  mesh(new THREE.BoxGeometry(0.5,0.25,WIN*2+0.4),lam(0x9aa7b5),W+0.2,7.55,0);
  for(const s of[-1,1]){mesh(new THREE.BoxGeometry(0.5,7.6,0.25),lam(0x9aa7b5),W+0.2,3.8,s*WIN);
    const glass=mesh(new THREE.BoxGeometry(0.1,7.2,2.2),new THREE.MeshLambertMaterial({color:0xcdeeff,transparent:true,opacity:0.35}),W+0.45,3.7,s*(WIN+1.3),scene,false)}
  // curtains blowing outward
  for(const s of[-1,1]){const c=mesh(new THREE.BoxGeometry(0.15,7,1.4),lam(0xffd9a8),W-0.3,4,s*(WIN+0.6));c.name='curtain'+s}
  const wl=makeLabel('まど','#2b7bff');wl.position.set(W-0.6,8.5,0);wl.scale.set(3.4,1.3,1);scene.add(wl);
  // floor arrows toward the window
  for(let i=0;i<3;i++){const a=new THREE.Mesh(new THREE.ConeGeometry(0.6,1.2,3),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.55}));a.rotation.set(-Math.PI/2,0,-Math.PI/2);a.position.set(W-6+i*1.8,0.03,0);scene.add(a)}
  mesh(new THREE.BoxGeometry(0.12,1.6,2.4),lam(0xe9785a),-W+0.06,5,-4,scene,false);
}

// ---------- physics helpers ----------
const G=24,STEP=0.3;
function collide(e,onHit){
  const r=e.r;
  if(!e.out){
    if(e.x<-W+r){hit(e,1,0,onHit,null);e.x=-W+r}
    const inWin=Math.abs(e.z)<WIN-0.3&&!e.noExit; // the open window lets anything through
    if(e.x>W-r&&!inWin){hit(e,-1,0,onHit,null);e.x=W-r}
    if(e.z<-D+r){hit(e,0,1,onHit,null);e.z=-D+r}
    if(e.z>D-r){hit(e,0,-1,onHit,null);e.z=D-r}
  }else{
    if(e.x<W+r&&Math.abs(e.z)>WIN-0.5){e.x=W+r;hit(e,1,0,null,null)}
    if(e.x>W+27){e.x=W+27;hit(e,-1,0,null,null)}
    e.z=clamp(e.z,-38,38);
  }
  for(const o of obs){
    if(!o.solid||e.y>=o.h-0.05||e.y+(e.tall||1.0)<=o.b)continue;
    if(o.platform&&e.ground&&o.h-e.y<=(e.step??STEP))continue;
    let nx,nz,pen;
    if(o.t==='circ'){
      const dx=e.x-o.x,dz=e.z-o.z,d=Math.hypot(dx,dz);
      if(d>=r+o.r)continue;
      nx=d?dx/d:1;nz=d?dz/d:0;pen=r+o.r-d;
    }else{
      const cx=clamp(e.x,o.x-o.hx,o.x+o.hx),cz=clamp(e.z,o.z-o.hz,o.z+o.hz);
      const dx=e.x-cx,dz=e.z-cz,d=Math.hypot(dx,dz);
      if(d>=r)continue;
      if(d>0){nx=dx/d;nz=dz/d;pen=r-d}
      else{const px=o.hx-Math.abs(e.x-o.x),pz=o.hz-Math.abs(e.z-o.z);
        if(px<pz){nx=Math.sign(e.x-o.x)||1;nz=0;pen=px+r}else{nx=0;nz=Math.sign(e.z-o.z)||1;pen=pz+r}}
    }
    e.x+=nx*pen;e.z+=nz*pen;hit(e,nx,nz,onHit,o);
  }
}
function hit(e,nx,nz,onHit,o){
  const vn=e.vx*nx+e.vz*nz;if(vn>=0)return;
  e.vx-=(1+e.rest)*vn*nx;e.vz-=(1+e.rest)*vn*nz;if(onHit)onHit(-vn,o);
}
function support(e,prevY,step){
  let s=0;
  if(e.out)return 0;
  for(const o of obs){
    if(!o.platform||o.h>prevY+step)continue;
    const inside=o.t==='circ'?Math.hypot(e.x-o.x,e.z-o.z)<o.r:Math.abs(e.x-o.x)<o.hx&&Math.abs(e.z-o.z)<o.hz;
    if(inside&&o.h>s)s=o.h;
  }
  return s;
}
function vertical(e,dt){
  const prevY=e.y;e.vy-=G*dt;e.y+=e.vy*dt;
  const s=support(e,prevY,e.ground?(e.step??STEP):0.08);
  if(e.y<=s){const land=e.vy;e.y=s;
    if(land<-8&&e.bounce){e.vy=-land*0.3}else e.vy=0;
    if(!e.ground&&land<-5&&e.onLand)e.onLand(land);
    e.ground=e.vy===0;
  }else e.ground=false;
}

// ---------- things in the house ----------
// weight: 1 dust, 2 paper, 3 bottles/cans, 4 small things, 5 furniture & people
const items=[];
const WOBS=new Map(); // furniture item -> its static obstacles
const OBS2IT=new Map();
function newItem(kind,weight,x,z,y,r,lift,g,o={}){
  const it=Object.assign({kind,weight,x,z,y,vx:0,vz:0,vy:0,r,lift,g,rest:0.3,ground:true,step:0.12,out:false,static:false,
    roll:false,count:weight>=2,battery:weight<=4,moved:false,expo:0,windT:0,spin:0,ox:x,oz:z,tall:1.2},o);
  g.position.set(x,y+lift,z);items.push(it);return it;
}
function grp(){const g=new THREE.Group();scene.add(g);return g}
const DUSTM=[lam(0x9a9a9a),lam(0xb0aca6),lam(0x8c8a86)],HAIRM=lam(0x666666),TISM=phongFlat(0xffffff);
// big dust mounds: blowing knocks them down one size at a time
function dust(x,z,size=rand(1.8,3.8)){
  const g=grp(),k=new THREE.Group();g.add(k);
  const big=mesh(new THREE.SphereGeometry(0.6,10,7),DUSTM[0],0,0,0,k,false);big.scale.set(1,0.62,1);
  for(let i=0;i<4;i++){const a=i*1.57+rand(-.4,.4);const m=mesh(new THREE.SphereGeometry(rand(0.3,0.42),7,5),DUSTM[1+i%2],Math.cos(a)*0.45,rand(0,0.12),Math.sin(a)*0.45,k,false);m.scale.y=0.6}
  for(let i=0;i<3;i++)mesh(new THREE.BoxGeometry(0.5,0.02,0.04),HAIRM,rand(-0.5,0.5),0.3,rand(-0.5,0.5),k,false).rotation.y=rand(0,3);
  k.scale.setScalar(size);
  return newItem('dust',1,x,z,0,0.65*size,0,g,{count:false,size,k});

// ---------- sound ----------
let ac=null,muted=false;
function tone(f,d,type='square',vol=.07,slide=0,delay=0){
  if(muted)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+delay;
    o.type=type;o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02);
  }catch(e){}
}
// cat voices: a sawtooth through a moving band-pass filter sounds like "mi-a-o"
function meow(p=600,len=0.5,vol=0.12){
  if(muted)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
    const t=ac.currentTime,o=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain(),lfo=ac.createOscillator(),lg=ac.createGain();
    o.type='sawtooth';
    o.frequency.setValueAtTime(p*0.8,t);o.frequency.linearRampToValueAtTime(p*1.3,t+len*0.3);o.frequency.linearRampToValueAtTime(p*0.75,t+len);
    lfo.frequency.value=7;lg.gain.value=p*0.03;lfo.connect(lg).connect(o.frequency);
    f.type='bandpass';f.Q.value=4;
    f.frequency.setValueAtTime(800,t);f.frequency.linearRampToValueAtTime(2000,t+len*0.35);f.frequency.linearRampToValueAtTime(900,t+len);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.04);g.gain.setValueAtTime(vol,t+len*0.7);g.gain.exponentialRampToValueAtTime(0.0001,t+len);
    o.connect(f).connect(g).connect(ac.destination);o.start(t);lfo.start(t);o.stop(t+len+0.05);lfo.stop(t+len+0.05);
  }catch(e){}
}
function hiss(vol=0.09,len=0.6){
  if(muted)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
    const t=ac.currentTime,n=Math.floor(ac.sampleRate*len),buf=ac.createBuffer(1,n,ac.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    const src=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
    src.buffer=buf;f.type='highpass';f.frequency.value=2800;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.08);g.gain.exponentialRampToValueAtTime(0.0001,t+len);
    src.connect(f).connect(g).connect(ac.destination);src.start(t);
  }catch(e){}
}
function sayAh(p=300){tone(p,.18,'triangle',.09,p*0.6);tone(p*1.4,.2,'triangle',.06,-p*0.4,.12)}
function cough(){[0,.22].forEach(d=>{tone(160,.12,'sawtooth',.05,-60,d)})}
function poofSnd(){tone(700,.2,'triangle',.05,-500)}
function chime(){tone(990,.08,'square',.05);tone(1320,.12,'square',.05,0,.07)}

let windNode=null,windGain=null,windFilt=null;
function startWind(){
  if(windNode||muted)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
    const n=ac.sampleRate*2,buf=ac.createBuffer(1,n,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    windNode=ac.createBufferSource();windNode.buffer=buf;windNode.loop=true;
    windFilt=ac.createBiquadFilter();windFilt.type='lowpass';windFilt.frequency.value=500;
    windGain=ac.createGain();windGain.gain.value=0.02;
    windNode.connect(windFilt).connect(windGain).connect(ac.destination);windNode.start();
  }catch(e){}
}
function setWind(){if(windGain){windGain.gain.value=muted||state!=='play'?0:0.012+level*0.012;windFilt.frequency.value=350+level*250}}

// nearest floor spot the fan can reach (not inside furniture)
function freeSpot(x,z){
  const blocked=(x,z)=>obs.some(o=>o.solid&&o.h>0.3&&(o.t==='circ'?Math.hypot(x-o.x,z-o.z)<o.r+0.9:Math.abs(x-o.x)<o.hx+0.9&&Math.abs(z-o.z)<o.hz+0.9));
  x=clamp(x,-W+1.2,W-1.2);z=clamp(z,-D+1.2,D-1.2);
  if(!blocked(x,z))return [x,z];
  for(let r=1;r<14;r+=0.7)for(let a=0;a<6.28;a+=0.5){const nx=clamp(x+Math.cos(a)*r,-W+1.2,W-1.2),nz=clamp(z+Math.sin(a)*r,-D+1.2,D-1.2);if(!blocked(nx,nz))return [nx,nz]}
  return [fan.x,fan.z];
}

// ---------- wind ----------
function windAt(x,z,y,r=0){ // returns strength 0..1 if something of radius r at (x,z) is in the fan's wind cone
  const L=LV[level],fx=Math.sin(camA),fz=-Math.cos(camA);
  const rx=x-fan.x,rz=z-fan.z,along=rx*fx+rz*fz;
  if(along<0.2-r||along>L.len+r)return 0;
  const lat=Math.abs(rx*fz-rz*fx);
  if(lat>L.w0+Math.max(0,along)*L.spread+r)return 0;
  if(y>fanHeadH+2+along*0.35)return 0;
  return 1-along/L.len*0.6;
}
// where the wind meets a wall it splits and runs along the wall both ways at half strength
let WH=null; // this frame's wall hit
function wallHit(){
  const L=LV[level],fx=Math.sin(camA),fz=-Math.cos(camA);
  let best=null;
  const tryWall=(t,hx,hz,nx,nz,tx,tz,isWin)=>{if(t>0&&(!best||t<best.t))best={t,hx,hz,nx,nz,tx,tz,isWin}};
  if(fx>1e-3){const t=(W-fan.x)/fx,hz=fan.z+fz*t;tryWall(t,W,hz,-1,0,0,1,Math.abs(hz)<WIN-0.3)}
  if(fx<-1e-3){const t=(-W-fan.x)/fx;tryWall(t,-W,fan.z+fz*t,1,0,0,1,false)}
  if(fz>1e-3){const t=(D-fan.z)/fz;tryWall(t,fan.x+fx*t,D,0,-1,1,0,false)}
  if(fz<-1e-3){const t=(-D-fan.z)/fz;tryWall(t,fan.x+fx*t,-D,0,1,1,0,false)}
  if(!best||best.isWin||best.t>=L.len)return null;
  best.rem=L.len-best.t;best.band=L.w0+best.t*L.spread;
  return best;
}
function windVec(x,z,y,r=0){ // strongest wind at a point: [strength, dirX, dirZ] or null
  const fx=Math.sin(camA),fz=-Math.cos(camA);
  let s0=windAt(x,z,y,r),out=null;
  if(s0>0&&WH){const along=(x-fan.x)*fx+(z-fan.z)*fz;if(along>WH.t+r)s0=0}
  if(s0>0)out=[s0,fx,fz];
  if(WH){
    const rx=x-WH.hx,rz=z-WH.hz,u=rx*WH.tx+rz*WH.tz,v=rx*WH.nx+rz*WH.nz;
    if(v>-r&&v<WH.band*0.8+r&&Math.abs(u)<WH.rem+r&&y<fanHeadH+3){
      const sg=Math.abs(u)<0.2?(Math.random()<0.5?-1:1):Math.sign(u);
      const s1=0.5*(1-Math.min(1,Math.abs(u)/(WH.rem+0.01))*0.6);
      if(!out||s1>out[0]||v<1.4+r)out=[s1,WH.tx*sg,WH.tz*sg]; // right at the wall the wind turns sideways
    }
  }
  return out;
}
function makeDynamic(it){
  if(!it.static)return;
  it.static=false;
  const list=WOBS.get(it);if(list)for(const o of list){const k=obs.indexOf(o);if(k>=0)obs.splice(k,1)}
  for(const q of items)if(!q.static&&q!==it){q.ground=false;q.wake=true} // things resting on it fall
  // people sitting on the sofa get up
}
function blowItem(it,s,dt,dir){
  const fx=dir?dir[0]:Math.sin(camA),fz=dir?dir[1]:-Math.cos(camA),L=LV[level];
  if(it.kind==='dust'){
    it.expo+=dt;
    it.k.position.x=Math.sin(time*40)*0.05*it.size; // it shakes in the wind
    if(it.expo>0.25+it.size*0.12){ // poof! one size smaller
      it.expo=0;puff(it.x,0.4*it.size,it.z,Math.round(6+it.size*4));poofSnd();
      addBlow();
      it.size-=1.1;
      if(it.size<0.9){it.out=true;it.gone=true;scene.remove(it.g)}
      else{it.k.scale.setScalar(it.size);it.r=0.65*it.size}
      for(const p of people)if(Math.hypot(p.x-it.x,p.z-it.z)<6&&!p.out&&p.cough<=0){p.cough=2.2;cough();toast((p.kind==='dad'?'おとうさん':'おかあさん')+'「ゴホッ！ゴホッ！」',1.4)}
    }
    return;
  }
  if(it.static)makeDynamic(it);
  const w=it.out?1:it.weight; // once outside, everything is as light as dust
  const light=1+(level-w)*0.7;
  const heavy={5:0.35,4:0.6,3:0.8,2:1}[w]||1;
  it.vx+=fx*L.power*s*light*heavy*dt;it.vz+=fz*L.power*s*light*heavy*dt;
  it.windT=0.3;
  if(it.ground&&Math.random()<dt*4*light){it.vy=rand(2,5)*Math.min(2,light)*heavy;it.ground=false}
  if(!it.moved){
    it.moved=true;
    if(it.weight<5)addBlow();
  }
}

// ---------- people ----------
function updatePerson(p,dt){
  const m=p.m;p.t-=dt;if(p.cough>0)p.cough-=dt;
  if(p.state==='fly'||p.out){
    p.x+=p.vx*dt;p.z+=p.vz*dt;collide(p,null);vertical(p,dt);
    if(p.ground){p.vx*=Math.pow(0.05,dt);p.vz*=Math.pow(0.05,dt)}
    if(p.out&&p.x<W+3.5){p.vx=Math.max(p.vx,3)}
    if(!p.out&&p.ground&&Math.hypot(p.vx,p.vz)<0.3){p.state='walk';p.t=1;p.noExit=true} // landed inside: get up
    return;
  }
  if(p.kind==='dad'){
    // reading; now and then spreads the paper wide (the chance to blow it away)
    if(p.hasPaper){p.paperT-=dt;if(p.paperT<=0){if(p.paperSpread>0){p.paperSpread=0;p.paperT=rand(3,5)}else{p.paperSpread=1;p.paperT=2.2}}}
    return;
  }
  // mom walks between chores
  const sp=MOM_SPOTS[p.target];
  const dx=sp[0]-p.x,dz=sp[1]-p.z,d=Math.hypot(dx,dz);
  if(p.state==='walk'){
    if(d<0.6){p.state='work';p.t=rand(3,5);p.vx=p.vz=0}
    else{p.vx=dx/d*2.4;p.vz=dz/d*2.4;p.heading=Math.atan2(p.vx,p.vz)}
  }else if(p.state==='work'){
    if(p.t<=0){p.target=(p.target+1+Math.floor(Math.random()*(MOM_SPOTS.length-1)))%MOM_SPOTS.length;p.state='walk'}
  }
  p.x+=p.vx*dt;p.z+=p.vz*dt;collide(p,null);
}
function blowPerson(p,s,dt,dir){
  const fx=dir?dir[0]:Math.sin(camA),fz=dir?dir[1]:-Math.cos(camA);
  if(p.kind==='dad'&&p.state==='sit'){

      const it=newItem('news',2,p.x,p.z+1.2,3,0.8,0,g,{battery:true});it.ground=false;it.vy=4;it.vx=fx*8;it.vz=fz*8;it.moved=true;
      addBlow();

    }

      p.hasWig=false;p.m.wig.visible=false;
      const g=grp();mesh(new THREE.SphereGeometry(0.61,16,10,0,Math.PI*2,0,Math.PI*0.45),lam(0x4a3020),0,0,0,g);
      const it=newItem('wig',2,p.x,p.z,4.2,0.6,0,g,{battery:true});it.ground=false;it.vy=6;it.vx=fx*10;it.vz=fz*10;it.moved=true;
      addBlow();
      sayAh(200);toast('おとうさんの カツラが とんだ！',1.8);p.cough=1.5;
    }
  }
  if(p.kind==='mom'&&level>=4&&!p.lostApron){p.lostApron=true;sayAh(420)}
  if(level<5)return;
  if(p.state!=='fly'){p.state='fly';p.y=Math.max(p.y,0.1);p.noExit=false;sayAh(p.kind==='dad'?220:420);toast(p.kind==='dad'?'おとうさん「うわーっ！」':'おかあさん「きゃーっ！」',1.4)}
  p.vx+=fx*LV[5].power*s*0.35*dt;p.vz+=fz*LV[5].power*s*0.35*dt;
  if(p.ground&&Math.random()<dt*3){p.vy=rand(3,6);p.ground=false}
}

// ---------- cats ----------
function updateCat(c,dt){
  c.t-=dt;
  if(c.state==='fly'){
    c.x+=c.vx*dt;c.z+=c.vz*dt;collide(c,null);vertical(c,dt);c.spin+=dt*10;
    if(c.ground){c.vx*=Math.pow(0.05,dt);c.vz*=Math.pow(0.05,dt);if(Math.hypot(c.vx,c.vz)<0.5){c.state=c.out?'back':'idle';c.t=c.out?1.2:rand(1,3);if(c.out){meow(c.voice*1.2,0.4,0.08)}}}
    return;
  }
  if(c.state==='back'){ // outside: line up with the window, then run back in
    if(c.t>0){c.vx=c.vz=0;return}
    const tz=clamp(c.z,-WIN+1.5,WIN-1.5);
    let gx=W-3,gz=tz;if(c.out&&Math.abs(c.z-tz)>0.3)gx=Math.max(c.x,W+1.5);
    const dx=gx-c.x,dz=gz-c.z,d=Math.hypot(dx,dz);
    c.vx=dx/(d||1)*7;c.vz=dz/(d||1)*7;
    c.x+=c.vx*dt;c.z+=c.vz*dt;
    if(c.out&&c.x<W-0.3)c.out=false;
    if(c.out)collide(c,null);else{c.noExit=true;collide(c,null);c.noExit=false}
    if(!c.out&&d<1){c.state='idle';c.t=rand(2,4)}
    return;
  }
  if(c.state==='idle'){c.vx*=0.8;c.vz*=0.8;if(c.t<=0){c.state='walk';c.tx=rand(-W+2,W-3);c.tz=rand(-D+2,D-2);c.t=6}}
  else if(c.state==='walk'){const dx=c.tx-c.x,dz=c.tz-c.z,d=Math.hypot(dx,dz);
    if(d<0.8||c.t<=0){c.state='idle';c.t=rand(2,5)}else{c.vx=dx/d*2.2;c.vz=dz/d*2.2}}
  c.x+=c.vx*dt;c.z+=c.vz*dt;c.noExit=true;collide(c,null);c.noExit=false;
}

// ---------- update ----------
let camSnap=true;
function update(dt){
  if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').style.opacity=0}
  if(shake>0)shake-=dt;
  for(const p of puffs){if(p.life<=0)continue;p.life-=dt;p.vy-=(p.sp?10:1)*dt;p.m.position.x+=p.vx*dt;p.m.position.y+=p.vy*dt;p.m.position.z+=p.vz*dt;
    p.m.material.opacity=Math.min(1,p.life*1.5);if(!p.sp)p.m.scale.multiplyScalar(1+dt*0.8);if(p.life<=0)p.m.visible=false}
  if(state==='menu'){camA+=dt*0.15;return}
  if(state!=='play')return;
  time+=dt;
  if(level<5){lvT+=dt;if(lvT>=LEVEL_SECS)levelUp()}
  const L=LV[level];
  // move the fan: ease toward the stick direction, glide to a stop on release
  let ix=stick.dx,iy=stick.dy;
  if(keys.ArrowLeft||keys.KeyA)ix-=1;if(keys.ArrowRight||keys.KeyD)ix+=1;if(keys.ArrowUp||keys.KeyW)iy-=1;if(keys.ArrowDown||keys.KeyS)iy+=1;
  const il=Math.hypot(ix,iy);if(il>1){ix/=il;iy/=il}
  ix*=0.5; // left/right is half as sensitive as forward/back
  const [tx,tz]=toWorld(ix,iy);
  const k=Math.min(1,dt*(il>0.05?3.2:2.2));
  fan.vx+=(tx*L.speed-fan.vx)*k;fan.vz+=(tz*L.speed-fan.vz)*k;
  fan.x+=fan.vx*dt;fan.z+=fan.vz*dt;
  collide(fan,(sp,o)=>{const f=o&&OBS2IT.get(o);if(f&&f.static&&level===f.weight-1)makeDynamic(f)});
  // heavy things the fan can't move yet block it
  for(const it of items){
    if(it.out||it.static||it.gone||it.weight<=level||it.kind==='dust')continue;
    const dx=fan.x-it.x,dz=fan.z-it.z,d=Math.hypot(dx,dz),m=fan.r+it.r;
    if(d<m&&d>0){
      if(level>=2&&it.weight===level+1&&!it.human){ // one rank heavier: it slides out of the way
        const nx=-dx/d,nz=-dz/d,pen=m-d,k=it.weight>=5?0.35:0.75;
        it.x+=nx*pen*k;it.z+=nz*pen*k;fan.x-=nx*pen*(1-k);fan.z-=nz*pen*(1-k);
        it.vx=nx*0.8;it.vz=nz*0.8;
        if(!it.moved){it.moved=true;if(it.weight<5)addBlow()}
      }else{fan.x=it.x+dx/d*m;fan.z=it.z+dz/d*m}
    }
  }
  // turn toward where it rolls
  const sp=Math.hypot(fan.vx,fan.vz);
  if(sp>0.6){let dA=Math.atan2(fan.vx,-fan.vz)-camA;while(dA>Math.PI)dA-=Math.PI*2;while(dA<-Math.PI)dA+=Math.PI*2;camA+=dA*Math.min(1,dt*2.2*Math.min(1,sp/3))}

  // wind on things
  WH=wallHit();
  for(const it of items){
    if(it.out||it.gone||it.human)continue;
    if(!it.out&&it.weight>level)continue;
    const wv=windVec(it.x,it.z,it.y,it.kind==='dust'?it.r:0);if(wv)blowItem(it,Math.min(1,wv[0]),dt,[wv[1],wv[2]]);
  }
  for(const p of people){if(p.out)continue;const wv=windVec(p.x,p.z,p.y,0.5);if(wv)blowPerson(p,wv[0],dt,[wv[1],wv[2]])}
  for(const c of cats){
    if(c.state==='back'&&c.out)continue;
    if(level>=3){const wv=windVec(c.x,c.z,c.y,0.3);if(wv){const s=wv[0];
      if(c.state!=='fly'){c.state='fly';c.ground=false;c.vy=rand(4,7);meow(c.voice*1.3,0.35,0.1)}
      c.vx+=wv[1]*L.power*s*0.8*dt;c.vz+=wv[2]*L.power*s*0.8*dt}}
  }
  // things move
  for(const it of items){
    if(it.gone||it.static||it.human)continue;
    // things that made it outside slide off into the garden so the window stays clear
    if(it.out&&it.x<W+it.r+2.5){it.vx=Math.max(it.vx,4);it.windT=0.2}
    if(it.ground&&!it.vx&&!it.vz&&!it.vy&&!it.wake)continue;
    it.wake=false;
    // the fan pushes light things it bumps
    if(!it.out&&it.weight<=level){const dx=it.x-fan.x,dz=it.z-fan.z,d=Math.hypot(dx,dz),m=fan.r+it.r;if(d<m&&d>0&&it.y<fanHeadH+1){it.x=fan.x+dx/d*m;it.z=fan.z+dz/d*m;it.vx+=dx/d*2;it.vz+=dz/d*2}}
    it.x+=it.vx*dt;it.z+=it.vz*dt;
    collide(it,null);
    it.bounce=true;vertical(it,dt);
    if(it.windT>0)it.windT-=dt;
    if(it.ground){const f=Math.pow(it.windT>0?0.75:(it.roll?0.5:0.04),dt);it.vx*=f;it.vz*=f;if(Math.abs(it.vx)+Math.abs(it.vz)<0.05){it.vx=it.vz=0}}
    it.spin+=Math.hypot(it.vx,it.vz)*dt;
  }
  // a resting thing gets nudged by a moving one
  for(const a of items){if(a.gone||a.static||a.human||(a.ground&&!a.vx&&!a.vz))continue;
    for(const b of items){if(b===a||b.gone||b.static||b.human||b.out!==a.out||Math.abs(a.y-b.y)>1)continue;
      const dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz),m=a.r+b.r;
      if(d<m&&d>0){const nx=dx/d,nz=dz/d;b.x+=nx*(m-d);b.z+=nz*(m-d);if(b.weight<=level+1){const rv=(a.vx-b.vx)*nx+(a.vz-b.vz)*nz;if(rv>0){b.vx+=rv*nx*0.6;b.vz+=rv*nz*0.6;a.vx-=rv*nx*0.3;a.vz-=rv*nz*0.3}}}}}
  for(const p of people)updatePerson(p,dt);
  for(const c of cats)updateCat(c,dt);
  // out through the window?
  for(const it of items){
    if(it.out||it.gone||it.static)continue;
    if(it.x>W+0.3){
      it.out=true;
      if(it.count){tone(880,.08,'triangle',.05);tone(1175,.1,'triangle',.04,0,.06);if(it.human)toast((it.kind==='dad'?'おとうさん':'おかあさん')+' そとへ！',1.2);else if(it.weight===5)toast('ばいばーい！',0.8)}
      updateHud();
    }
  }
  for(const c of cats){if(!c.out&&c.x>W+0.3&&c.state==='fly'){c.out=true;toast('ねこは すぐ もどってくるよ',1.2)}}
  // batteries
  for(let i=pickups.length-1;i>=0;i--){
    const p=pickups[i];p.t+=dt;
    p.vy-=20*dt;p.y+=p.vy*dt;if(p.y<0){p.y=0;p.vy=0}
    if(p.t>0.4&&Math.hypot(p.x-fan.x,p.z-fan.z)<fan.r+0.55){
      scene.remove(p.g);pickups.splice(i,1);chime();
      if(level<5){batt++;if(batt>=LV[level].need)levelUp();else updateHud()}
    }
  }
  if(Math.floor(time*4)!==Math.floor((time-dt)*4))updateHud();

  if(remaining()===0&&state==='play')gameClear();
}

// ---------- render sync ----------
const _axis=new THREE.Vector3();
const camPos=new THREE.Vector3(0,10,20),camLook=new THREE.Vector3();
let camS=0.5;
function sync(dt){
  const now=performance.now()/1000;
  // fan
  if(fanG){fanG.position.set(fan.x,0,fan.z);fanG.rotation.y=Math.PI-camA;if(blades)blades.rotation.z-=dt*(state==='play'?(14+level*4):3)}
  // wind streaks in the cone
  const L=LV[level],fx=Math.sin(camA),fz=-Math.cos(camA);
  const wh=state==='play'?wallHit():null;
  streaks.forEach((s,i)=>{
    if(i>=44){ // wind running along the wall

      s.t+=dt*(0.9+level*0.15);if(s.t>1){s.t-=1;s.lat=Math.random();s.h=Math.random()}

        m.arms.forEach((a,i)=>{a.rotation.x=-1.2;a.rotation.z=(i?1:-1)*(spread?0.32:0.02)}); // hands hold the paper's edges from behind
        if(m.paperM&&it.hasPaper){m.paperM.scale.set(spread?1.7:1,spread?1.3:1,1);m.paperM.position.y=spread?4.5:4.3}
        m.head.rotation.x=it.cough>0?Math.sin(now*20)*0.2:0;
        if(it.chance)it.chance.visible=spread&&it.hasPaper&&level>=2;
        if(it.chance)it.chance.position.set(it.x,7.2+Math.sin(now*6)*0.2,it.z+1);
      }else if(it.state==='fly'||it.out){
        if(it.chance)it.chance.visible=false;
        m.root.rotation.x+=dt*(it.ground?0:5);m.root.rotation.z=it.ground?Math.PI/2:m.root.rotation.z+dt*3;
        m.legs.forEach((l,i)=>l.rotation.x=Math.sin(now*15+i)*0.6);m.arms.forEach((a,i)=>{a.rotation.x=-2.8+Math.sin(now*12+i)*0.4;a.rotation.z=0});
        if(it.ground)m.root.position.y=it.y+0.6;
      }else{
        m.root.rotation.set(0,it.heading,0);
        const sp=Math.hypot(it.vx,it.vz);it.phase+=dt*sp*2.2;
        m.legs.forEach((l,i)=>l.rotation.x=Math.sin(it.phase+i*Math.PI)*0.5*Math.min(1,sp));
        m.arms.forEach((a,i)=>{a.rotation.z=0;a.rotation.x=it.state==='work'?-1.2+Math.sin(now*6+i)*0.4:Math.sin(it.phase+i*Math.PI+Math.PI)*0.4});
        m.head.rotation.x=it.cough>0?Math.sin(now*20)*0.2:0;
      }
      continue;
    }
    it.g.position.set(it.x,it.y+it.lift,it.z);
    const sp=Math.hypot(it.vx,it.vz);
    if(it.static)continue;
    if(it.roll){if(sp>0.01){_axis.set(it.vz,0,-it.vx).normalize();it.g.rotateOnWorldAxis(_axis,sp*dt/it.r)}}
    else if(!it.ground){it.g.rotation.x+=dt*(it.weight>=5?1.5:6);it.g.rotation.y+=sp*dt*0.5}
    else if(it.weight<5){it.g.rotation.x=0;it.g.rotation.y+=sp*dt}
    else{it.g.rotation.x*=0.9}
  }
  people.forEach((p,i)=>{const c=coughS[i];if(!c)return;c.visible=p.cough>0&&!p.out;
    if(c.visible){const sit=p.state==='sit';c.position.set(p.x+Math.sin(now*9)*0.15,(sit?5.6:7)+Math.abs(Math.sin(now*7))*0.3,p.z+(sit?0.6:0));const k=1+Math.abs(Math.sin(now*14))*0.15;c.scale.set(2.6*k,1*k,1)}});
  // cats
  for(const c of cats){
    const m=c.m;m.root.position.set(c.x,c.y,c.z);
    const sp=Math.hypot(c.vx,c.vz);
    if(c.state==='fly'){m.body.rotation.z+=dt*10;m.body.position.y=0.4}
    else{
      m.body.rotation.z=0;m.body.position.y=0;
      if(sp>0.3){c.heading=Math.atan2(c.vx,c.vz)}
      m.root.rotation.y=c.heading;
      c.phase+=dt*(3+sp*2);const amp=Math.min(1,sp/3)*0.9;
      m.legs[0].rotation.x=Math.sin(c.phase)*amp;m.legs[3].rotation.x=Math.sin(c.phase)*amp;m.legs[1].rotation.x=-Math.sin(c.phase)*amp;m.legs[2].rotation.x=-Math.sin(c.phase)*amp;
    }
    m.tail.forEach((s,i)=>{s.rotation.x=i===0?0.9:0.18;s.rotation.y=Math.sin(now*4+i*0.7)*0.25});
  }
  // batteries spin and bob
  for(const p of pickups){p.g.position.set(p.x,p.y+0.6+Math.sin(now*4+p.x)*0.12,p.z);p.g.rotation.y=now*2}
  // curtains flap when wind blows toward the window
  // window marker when the window is off screen
  {
    const el=$('mkWin');
    if(state!=='play'){el.hidden=true}
    else{
      const v=new THREE.Vector3(W,3,0).project(camera);let x=v.x,y=v.y;const behind=v.z>1;if(behind){x=-x;y=-y}
      if(!behind&&Math.abs(x)<0.95&&Math.abs(y)<0.95){el.hidden=true}
      else{if(behind&&Math.abs(y)<1)y=-1.2;const k=0.88/Math.max(Math.abs(x),Math.abs(y));x*=k;y*=k;el.hidden=false;el.style.left=((x+1)/2*innerWidth)+'px';el.style.top=Math.max(110,Math.min(innerHeight-30,(1-y)/2*innerHeight))+'px'}
    }
  }
  // camera behind the fan
  // the camera distance grows with the fan, so the fan keeps its size on screen while the room shrinks around it
  const portrait=innerWidth<innerHeight;
  camS+=(LV[level].cam-camS)*Math.min(1,dt*1.6);
  const s=camS;
  const dist=s*(portrait?6.8:5.6)+0.6,hgt=s*(portrait?3.4:2.7)+0.4;
  const cx=clamp(fan.x-fx*dist,-W+0.8,W-0.8),cz=clamp(fan.z-fz*dist,-D+0.8,D-0.8);
  const short=dist-Math.hypot(cx-fan.x,cz-fan.z);
  const tp=new THREE.Vector3(cx,hgt+short*0.9,cz),tl=new THREE.Vector3(fan.x+fx*s*3,s*0.9,fan.z+fz*s*3);
  if(state==='menu'){tp.set(Math.sin(camA)*-20,14,-Math.cos(camA)*-20+2);tl.set(0,1,0)}
  if(camSnap){camPos.copy(tp);camLook.copy(tl);camSnap=false}
  camPos.lerp(tp,Math.min(1,dt*4));camLook.lerp(tl,Math.min(1,dt*5));
  camera.position.copy(camPos);
  if(shake>0)camera.position.add(new THREE.Vector3(rand(-.2,.2),rand(-.2,.2),0));
  camera.lookAt(camLook);
}

// ---------- start ----------
resetWorld();
state='menu';camSnap=true;
let last=performance.now();
function frame(now){
  const dt=Math.min(1/30,(now-last)/1000);last=now;
  if(!document.hidden){
    update(dt/2);update(dt/2);sync(dt);renderer.render(scene,camera);
    if(!frame.shown){frame.shown=true;$('loading').hidden=true;$('menu').hidden=false}
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
