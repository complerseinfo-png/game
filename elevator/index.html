<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="エレベーター">
<meta name="theme-color" content="#1d1b22">
<title>エレベーター ごっこ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
:root{--ink:#2a2430;--font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1d1b22;color:#fff;font-family:var(--font);user-select:none;-webkit-user-select:none;touch-action:manipulation}
[hidden]{display:none!important}
#app{position:fixed;inset:0;display:flex}
#view{flex:1;position:relative;min-width:0}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#panel{flex:none;width:min(31vw,300px);background:linear-gradient(90deg,#9aa3ab,#d6dce1 30%,#c2c9cf 70%,#8d959c);display:flex;flex-direction:column;align-items:center;gap:1.4vh;padding:1.6vh 10px;box-shadow:inset 4px 0 8px rgba(0,0,0,.35)}
#disp{width:100%;max-width:200px;background:#120f0c;border:4px solid #555;border-radius:10px;color:#ff9a2a;font:800 clamp(28px,6vh,52px)/1.1 monospace;text-align:center;padding:4px 0;text-shadow:0 0 10px #ff7a00;display:flex;justify-content:center;gap:10px}
#arrow{width:.8em}
#floors{display:grid;grid-template-columns:1fr 1fr;gap:1.2vh 14px;flex:1;align-content:center}
.fb{width:clamp(48px,9.6vh,78px);height:clamp(48px,9.6vh,78px);border-radius:50%;border:4px solid #7a838b;background:radial-gradient(circle at 40% 35%,#ffffff,#d9dee2 55%,#aab2b9);
  font:800 clamp(20px,4.2vh,34px) var(--font);color:#3a3f46;box-shadow:0 4px 0 #6d757c,inset 0 -3px 6px rgba(0,0,0,.15);cursor:pointer;padding:0}
.fb:active{transform:translateY(3px);box-shadow:0 1px 0 #6d757c}
.fb.on{border-color:#ff9a2a;color:#ff7a00;box-shadow:0 4px 0 #6d757c,0 0 16px 4px rgba(255,150,40,.9);background:radial-gradient(circle at 40% 35%,#fffbe8,#ffe2a8 55%,#ffc266)}
#ctl{display:flex;gap:12px}
.cb{width:clamp(56px,10vh,80px);height:clamp(56px,10vh,80px);border-radius:16px;border:4px solid #7a838b;background:linear-gradient(#fff,#cfd5da);box-shadow:0 4px 0 #6d757c;cursor:pointer;padding:0}
.cb:active,.cb.on{transform:translateY(3px);box-shadow:0 1px 0 #6d757c;border-color:#2b9aff}
.cb svg{width:70%;height:70%}
#bell{background:linear-gradient(#ffe25a,#f2b800)}
#tools{display:flex;gap:8px}
.tb{font:800 14px var(--font);padding:6px 10px;border-radius:999px;border:3px solid #3a3f46;background:#fff;color:#3a3f46;cursor:pointer}
@media (orientation:portrait){
  #app{flex-direction:column}
  #panel{width:100%;height:auto;flex-direction:row;flex-wrap:wrap;justify-content:center;padding:8px;gap:8px}
  #floors{grid-template-columns:repeat(6,1fr);gap:8px;flex:none}
  .fb{width:min(13vw,64px);height:min(13vw,64px)}
  #disp{max-width:150px;font-size:34px}
  .cb{width:min(14vw,64px);height:min(14vw,64px)}
}
/* overlays */
.ov{position:fixed;inset:0;display:grid;place-items:center;background:rgba(20,18,26,.75);z-index:20;padding:16px}
.card{background:#fffaf0;color:var(--ink);border:5px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:22px;max-width:640px;width:100%;text-align:center}
.card h1{margin:0 0 8px;font-size:clamp(34px,8vw,56px);color:#ff7a00;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.card p{margin:6px 0;font-size:18px}
.big{font:800 30px var(--font);padding:12px 48px;border-radius:999px;border:4px solid var(--ink);background:#ffcc33;color:var(--ink);box-shadow:0 6px 0 var(--ink);cursor:pointer;margin-top:12px}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
#zgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;max-height:60vh;overflow:auto;margin:10px 0}
.zt{border:3px solid var(--ink);border-radius:14px;padding:6px 2px;background:#fff;font-size:12px;font-weight:800}
.zt span{display:block;font-size:34px;line-height:1.2;font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif}
.zt.no{background:#ddd;color:#888}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#1d1b22;color:#fff;font-size:28px;font-weight:800;z-index:30}
</style>
</head>
<body>
<div id="app">
  <div id="view"><canvas id="c"></canvas></div>
  <div id="panel">
    <div id="tools"><button class="tb" id="zukanBtn">ずかん</button><button class="tb" id="muteBtn">おと ON</button><button class="tb" id="fullBtn">ぜんがめん</button></div>
    <div id="disp"><span id="arrow"></span><span id="dnum">1</span></div>
    <div id="floors"></div>
    <div id="ctl">
      <button class="cb" id="openBtn" aria-label="ひらく"><svg viewBox="0 0 40 40"><path d="M4 20l9-8v16zM36 20l-9-8v16z" fill="#2a2f36"/><rect x="18.5" y="8" width="3" height="24" fill="#2a2f36"/></svg></button>
      <button class="cb" id="closeBtn" aria-label="しめる"><svg viewBox="0 0 40 40"><path d="M17 20l-9-8v16zM23 20l9-8v16z" fill="#2a2f36"/><rect x="18.5" y="8" width="3" height="24" fill="#2a2f36"/></svg></button>
      <button class="cb" id="bell" aria-label="ベル"><svg viewBox="0 0 40 40"><path d="M20 6c-6 0-9 5-9 11v7l-3 4h24l-3-4v-7c0-6-3-11-9-11z" fill="#2a2f36"/><circle cx="20" cy="32" r="3" fill="#2a2f36"/></svg></button>
    </div>
  </div>
</div>
<div class="ov" id="title">
  <div class="card">
    <h1>エレベーター ごっこ</h1>
    <p>ボタンを おして いろんな かいへ いこう！</p>
    <p>ドアが ひらくと なにが いるかな？</p>
    <p id="titleCount" style="font-weight:800"></p>
    <button class="big" id="startBtn">のる！</button>
  </div>
</div>
<div class="ov" id="zukan" hidden>
  <div class="card">
    <h1 style="font-size:36px">ずかん</h1>
    <p id="zcount" style="font-weight:800"></p>
    <div id="zgrid"></div>
    <button class="big" id="zclose" style="font-size:22px;padding:8px 36px">とじる</button>
  </div>
</div>
<div id="loading">よみこみちゅう…</div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const EMOJI='"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol",sans-serif';
const FONT='"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif';
const TOP=12;

// ================= sound =================
let ac=null,master=null,muted=false;
function audio(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=0.5;master.connect(ac.destination)}catch(e){return null}}if(ac.state==='suspended')ac.resume();return ac}
function tone(f,d,type='sine',vol=.08,slide=0,delay=0){if(muted||!audio())return;const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(master);o.start(t);o.stop(t+d+.05)}
function noise(d,vol=.1,f=1000,q=1,delay=0,type='bandpass',fEnd=0){if(muted||!audio())return;const t=ac.currentTime+delay,n=Math.floor(ac.sampleRate*d),b=ac.createBuffer(1,n,ac.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=Math.random()*2-1;
  const s=ac.createBufferSource();s.buffer=b;const fl=ac.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t);if(fEnd)fl.frequency.exponentialRampToValueAtTime(fEnd,t+d);fl.Q.value=q;const g=ac.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl).connect(g).connect(master);s.start(t)}
let hum=null;
function humOn(on){if(!audio())return;if(!hum){const n=ac.sampleRate*2,b=ac.createBuffer(1,n,ac.sampleRate),c=b.getChannelData(0);let l=0;for(let i=0;i<n;i++){l=l*0.98+(Math.random()*2-1)*0.02;c[i]=l*8}
  const s=ac.createBufferSource();s.buffer=b;s.loop=true;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=300;hum=ac.createGain();hum.gain.value=0;s.connect(f).connect(hum).connect(master);s.start()}
  hum.gain.setTargetAtTime(on&&!muted?0.12:0,ac.currentTime,0.25)}
const SFX={
  pon(){tone(1046,1.4,'sine',.12);tone(2093,.8,'sine',.03)},
  pinpon(){tone(784,.5,'sine',.1);tone(622,.8,'sine',.1,0,.45)},
  door(){noise(0.7,0.05,500,0.8,0,'lowpass',200)},
  buzz(){tone(180,1.2,'square',.06);tone(183,1.2,'square',.04)},
  click(){tone(1500,.05,'square',.04)},
  bell(){for(let i=0;i<14;i++)tone(i%2?1250:1150,.08,'square',.04,0,i*.08)},
  roar(){tone(110,1.2,'sawtooth',.12,-60);noise(1.2,.15,400,0.7,0,'lowpass',120)},
  splash(){noise(.9,.18,1500,0.5,0,'bandpass',400)},
  boom(){noise(1.2,.25,300,0.7,0,'lowpass',60);tone(70,.8,'sine',.15,-30)},
  pop(){tone(rand(500,900),.1,'sine',.07,600)},
  siren(){for(let i=0;i<6;i++)tone(i%2?950:700,.3,'square',.035,0,i*.3)},
  trumpet(){tone(330,.9,'sawtooth',.08,330);tone(335,.9,'sawtooth',.05,340)},
  train(){for(let i=0;i<8;i++)noise(.12,.12,i%2?900:600,2,i*.18)},
  thud(){tone(90,.25,'sine',.15,-40);noise(.15,.1,300,1)},
  meow(p=650){if(muted||!audio())return;const t=ac.currentTime,o=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(p*0.9,t);o.frequency.linearRampToValueAtTime(p*1.25,t+.15);o.frequency.linearRampToValueAtTime(p*0.8,t+.5);f.type='bandpass';f.Q.value=3;f.frequency.setValueAtTime(800,t);f.frequency.linearRampToValueAtTime(1800,t+.15);f.frequency.linearRampToValueAtTime(700,t+.5);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+.55);o.connect(f).connect(g).connect(master);o.start(t);o.stop(t+.6)},
  bees(){tone(220,1.5,'sawtooth',.04,20);tone(233,1.5,'sawtooth',.03,-20)},
  rocket(){noise(2.5,.2,200,0.5,0,'lowpass',2000)},
  ghost(){tone(400,1.2,'sine',.08,-200);tone(410,1.2,'triangle',.05,-180,.1)},
  music(notes,step=.22,type='triangle',vol=.07){notes.forEach((n,i)=>{if(n)tone(n,step*1.6,type,vol,0,i*step)})},
};
const N={C4:262,D4:294,E4:330,F4:349,G4:392,A4:440,B4:494,C5:523,D5:587,E5:659,F5:698,G5:784};
function voice(pitch,n=4){for(let i=0;i<n;i++)tone(pitch*rand(0.85,1.25),.07,'square',.035,0,i*.09)}
let jaVoice=null;
function loadVoices(){try{const v=speechSynthesis.getVoices();jaVoice=v.find(x=>/^ja/i.test(x.lang))||null}catch(e){}}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices}catch(e){}
function say(text){if(muted||!jaVoice)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.voice=jaVoice;u.lang='ja-JP';u.rate=1.05;u.pitch=1.2;u.volume=0.8;speechSynthesis.speak(u)}catch(e){}}

// ================= characters =================
const CH={
  boy:{e:'👦',n:'おとこのこ',w:30,v:800,l:['こんにちは！','エレベーター だいすき！']},
  girl:{e:'👧',n:'おんなのこ',w:28,v:900,l:['こんにちは〜','どこ いくの？']},
  man:{e:'👨',n:'おじさん',w:70,v:300,l:['おっと、のせてね','いそがしい いそがしい'],item:'💼'},
  woman:{e:'👩',n:'おねえさん',w:55,v:600,l:['こんにちは','おかいもの いくの'],item:'👜'},
  grandpa:{e:'👴',n:'おじいちゃん',w:60,v:250,l:['よっこいしょ','ゆっくりで ええよ']},
  grandma:{e:'👵',n:'おばあちゃん',w:50,v:500,l:['あらあら、ありがとうね','あめちゃん いる？'],item:'🍬'},
  baby:{e:'👶',n:'あかちゃん',w:10,v:1100,l:['ばぶー','あぅあぅ']},
  dog:{e:'🐶',n:'いぬ',w:15,v:700,l:['ワン！','ワンワン！']},
  cat:{e:'🐱',n:'ねこ',w:5,v:0,l:['ニャー','ニャ〜ン'],meow:1},
  panda:{e:'🐼',n:'パンダ',w:110,v:350,l:['ささ たべたい','パンダだよ']},
  pig:{e:'🐷',n:'ぶた',w:90,v:400,l:['ブーブー','ブヒッ']},
  bear:{e:'🐻',n:'クマ',w:160,v:200,l:['クマ〜','はちみつ どこ？'],item:'🍯'},
  robot:{e:'🤖',n:'ロボット',w:120,v:1500,l:['ピポパポ','ウィーン ガシャン']},
  doctor:{e:'🐰',n:'うさぎせんせい',w:20,v:1000,l:['おだいじに〜','げんき かな？'],item:'💉'},
  frog:{e:'🐸',n:'カエル',w:3,v:600,l:['ケロケロ','あめ だいすき'],item:'☂️'},
  penguin:{e:'🐧',n:'ペンギン',w:25,v:900,l:['ペンペン','さむいの すき']},
  monkey:{e:'🐵',n:'おさる',w:20,v:850,l:['ウキキー！','バナナ ちょうだい'],item:'🍌'},
  alien:{e:'👽',n:'うちゅうじん',w:30,v:1300,l:['ワレワレハ…','ちきゅう たのしい']},
  octo:{e:'🐙',n:'タコ',w:20,v:500,l:['タコタコ〜','すみ はくよ']},
  unicorn:{e:'🦄',n:'ユニコーン',w:200,v:1000,l:['ヒヒーン☆','にじの くにから きたよ']},
  princess:{e:'👸',n:'おひめさま',w:45,v:950,l:['ごきげんよう','おしろへ かえるの']},
  police:{e:'👮',n:'おまわりさん',w:75,v:350,l:['パトロール ちゅう！','わるもの いない？']},
  santa:{e:'🎅',n:'サンタさん',w:95,v:250,l:['メリークリスマス！','プレゼント あるよ'],item:'🎁'},
  hippo:{e:'🦛',n:'カバ',w:420,v:150,l:['カバ〜','おもくないよ']},
  lion:{e:'🦁',n:'ライオン',w:190,v:180,l:['ガオー！','かまないよ']},
  chick:{e:'🐤',n:'ひよこ',w:1,v:1600,l:['ピヨピヨ','ピヨッ']},
  owl:{e:'🦉',n:'フクロウ',w:5,v:450,l:['ホーホー','しーっ']},
  cow:{e:'🐮',n:'ウシ',w:520,v:180,l:['モ〜','ミルク いる？']},
  koala:{e:'🐨',n:'コアラ',w:10,v:600,l:['ねむい…','ユーカリ すき']},
  tiger:{e:'🐯',n:'トラ',w:180,v:200,l:['ガルル','しましま だよ']},
  ghost:{e:'👻',n:'おばけ',w:0,v:400,l:['うらめしや〜','ばあ！']},
  chef:{e:'🧑',n:'ピザやさん',w:65,v:500,l:['ピザ おとどけです！','あつあつだよ'],item:'🍕'},
  fox:{e:'🦊',n:'キツネ',w:8,v:900,l:['コンコン','あぶらあげ すき']},
};
const NORMAL=['boy','girl','man','woman','grandpa','grandma','baby','dog','cat','panda','pig','robot','koala','fox','chick','bear'];

// ================= view geometry (virtual 1000 x 750) =================
const VW=1000,VH=750,OX=300,OY=140,OW=400,OH=550;
const canvas=$('c'),g=canvas.getContext('2d');
let scale=1,offX=0,offY=0,dpr=1;
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);
  scale=Math.min(canvas.width/VW,canvas.height/VH);offX=(canvas.width-VW*scale)/2;offY=(canvas.height-VH*scale)/2}
addEventListener('resize',resize);
function em(e,x,y,s,rot=0,alpha=1){g.save();g.globalAlpha*=alpha;g.translate(x,y);if(rot)g.rotate(rot);g.font=`${s}px ${EMOJI}`;g.textAlign='center';g.textBaseline='middle';g.fillText(e,0,0);g.restore()}
function grad(c1,c2,y0=0,y1=OH){const gr=g.createLinearGradient(0,y0,0,y1);gr.addColorStop(0,c1);gr.addColorStop(1,c2);return gr}
function rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h)}
function circle(x,y,r,c){g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
function floorBand(c1,c2){g.fillStyle=grad(c1,c2,OH-120,OH);g.fillRect(0,OH-120,OW,120)}
function hallBack(wall,floor){rect(0,0,OW,OH,wall);floorBand(floor,shade(floor));rect(0,OH-124,OW,6,'rgba(0,0,0,.15)')}
function shade(c){return c} // simple
function bubbleText(txt,x,y,maxw=360){g.save();g.font=`800 30px ${FONT}`;const w=Math.min(maxw,g.measureText(txt).width+34);
  g.fillStyle='#fffaf0';g.strokeStyle='#2a2430';g.lineWidth=5;g.beginPath();if(g.roundRect)g.roundRect(x-w/2,y-30,w,54,24);else g.rect(x-w/2,y-30,w,54);g.fill();g.stroke();
  g.beginPath();g.moveTo(x-12,y+23);g.lineTo(x,y+42);g.lineTo(x+12,y+23);g.fill();g.stroke();g.fillRect(x-14,y+18,28,6);
  g.fillStyle='#2a2430';g.textAlign='center';g.textBaseline='middle';g.fillText(txt,x,y-2,w-20);g.restore()}

// ================= events (what is behind the doors) =================
// each: k,name,icon, bg(t,ev) draws inside the door opening (0..OW,0..OH), chars:[] waiting to board, onOpen(ev), update(dt,ev)
const EV=[];
function E(o){EV.push(o);return o}
E({k:'lobby',name:'ロビー',icon:'🏢',bg(t){rect(0,0,OW,OH,'#e9dcc6');rect(0,60,OW,240,'#cfe6f5');for(let i=0;i<4;i++)rect(10+i*100,60,6,240,'#bfa98a');floorBand('#c9a77a','#a8865a');em('🌳',40,400,90);em('🌳',360,400,90);rect(120,330,160,90,'#8a5a3a');g.fillStyle='#fff';g.font=`800 26px ${FONT}`;g.textAlign='center';g.fillText('うけつけ',200,385)},
  chars:()=>[pick(NORMAL),...(Math.random()<.5?[pick(NORMAL)]:[])]});
E({k:'hall',name:'ふつうの ろうか',icon:'🚪',bg(t){hallBack('#efe6d8','#b9a68e');for(const x of[40,250]){rect(x,150,110,250,'#9a6b45');circle(x+90,280,8,'#f2c14e')}g.fillStyle='#555';g.font=`800 22px ${FONT}`;g.textAlign='center';g.fillText(cur.floor+'かい',200,110)},
  chars:()=>Math.random()<.7?[pick(NORMAL)]:[]});
E({k:'sea',name:'うみの なか',icon:'🐠',bg(t,ev){g.fillStyle=grad('#4fc3ff','#0a3d7a');g.fillRect(0,0,OW,OH);for(let i=0;i<5;i++){g.fillStyle='rgba(255,255,255,.12)';g.fillRect((i*90+t*20)%460-40,0,30,OH)}rect(0,OH-60,OW,60,'#e8d39a');em('🐚',60,OH-60,60);em('🌿',330,OH-90,80);

// ================= flow =================
function pickEvent(force){
  if(force)return EV.find(e=>e.k===force);
  if(cur.floor===1&&Math.random()<.5)return EV[0];
  let pool=EV.filter(e=>!lastEvs.includes(e.k)&&e.k!=='lobby');
  // favour places not found yet
  const fresh=pool.filter(e=>!found[e.k]);if(fresh.length&&Math.random()<.6)pool=fresh;
  return pick(pool);
}
function arrive(sameFloor,force){
  const ev=pickEvent(force);cur.ev=ev;cur.evT=0;cur.evState={t:0};
  lastEvs.push(ev.k);if(lastEvs.length>6)lastEvs.shift();
  if(!found[ev.k]){found[ev.k]=1;save()}
  waiting=(ev.chars?ev.chars():[]).map((k,i,a)=>({k,x:a.length>1?(i?280:120):200,y:OH-130,boardT:0.9+i*1.1}));
  for(const p of pax)if(p.st==='in'&&p.dest===cur.floor)p.leave=true;
  cur.opened=false;
}
function startMove(){
  if(cur.mode==='moving'||req.size===0)return;
  let above=[...req].filter(f=>f>cur.floor),below=[...req].filter(f=>f<cur.floor);
  if(cur.dir>=0&&above.length)cur.dir=1;else if(below.length)cur.dir=-1;else if(above.length)cur.dir=1;else{req.clear();light();return}
  cur.target=cur.dir>0?Math.min(...above):Math.max(...below);
  cur.mode='moving';cur.ev=null;waiting=[];fx=[];humOn(true);
  say(cur.dir>0?'うえに まいります':'したへ まいります');
  for(const p of pax)if(p.st==='in'&&Math.random()<.35){p.say=pick(CH[p.k].l);p.sayT=1.8}
}
function update(dt){
  if(toastT>0)toastT-=dt;if(shake>0)shake-=dt;
  // doors
  const ds=dt/0.9;if(cur.door<cur.doorTarget)cur.door=Math.min(1,cur.door+ds);else if(cur.door>cur.doorTarget)cur.door=Math.max(0,cur.door-ds);
  if(cur.mode==='moving'){
    // pick up new requests on the way
    const above=[...req].filter(f=>f>cur.pos-0.001&&cur.dir>0),below=[...req].filter(f=>f<cur.pos+0.001&&cur.dir<0);
    const cand=cur.dir>0?above.filter(f=>f>=cur.pos+stopDist()):below.filter(f=>f<=cur.pos-stopDist());
    if(cand.length)cur.target=cur.dir>0?Math.min(cur.target,...cand):Math.max(cur.target,...cand);
    const dist=Math.abs(cur.target-cur.pos);
    const vmax=Math.sqrt(2*1.4*dist);cur.v=Math.min(cur.v+1.4*dt,1.25,vmax+0.02);
    cur.pos+=cur.dir*cur.v*dt;
    const nf=Math.round(cur.pos);if(nf!==cur.floor){cur.floor=nf;tone(1600,.03,'sine',.015)}
    if((cur.dir>0&&cur.pos>=cur.target)||(cur.dir<0&&cur.pos<=cur.target)||dist<0.003){
      cur.pos=cur.target;cur.floor=cur.target;cur.v=0;cur.mode='open';humOn(false);req.delete(cur.floor);light();
      SFX.pon();say(cur.floor+'かいです');arrive();cur.openDelay=0.7;cur.openT=-0.7;
    }
  }
  if(cur.mode==='open'&&cur.openDelay>0){cur.openDelay-=dt;if(cur.openDelay<=0){cur.doorTarget=1;SFX.door()}}
  else if(cur.mode==='open'){
    cur.openT+=dt;
    if(cur.door>0.5&&cur.ev){cur.evState.t+=dt;
      if(!cur.opened){cur.opened=true;cur.ev.onOpen&&cur.ev.onOpen(cur.evState);}
      cur.ev.update&&cur.ev.update(dt,cur.evState);
      spawnFx(cur.ev.fx,dt);
    }
    // people leaving first
    if(cur.door>0.8){
      const leaving=pax.find(p=>p.leave&&p.st==='in');
      if(leaving&&!pax.some(p=>p.st==='exit'||p.st==='enter')){leaving.st='exit';leaving.t=0;leaving.say=pick(['ありがとう！','またね〜','ここで おりるね']);leaving.sayT=1.5;voiceOf(leaving.k)}
      else if(!pax.some(p=>p.st==='exit'||p.leave&&p.st==='in')){
        // boarding
        const w=waiting[0];
        if(w&&!pax.some(p=>p.st==='enter')){w.boardT-=dt;
          if(w.boardT<=0){
            const slot=slotFree();
            if(slot<0){waiting.shift();SFX.buzz();toast('まんいん です！ ブーッ');w.gone=1}
            else{waiting.shift();const p={k:w.k,st:'enter',t:0,slot,fromX:OX+w.x,fromY:OY+w.y,dest:0,bob:rand(0,6)};pax.push(p);
              if(!met[w.k]){met[w.k]=1;save()}
              voiceOf(w.k);p.say=pick(CH[w.k].l);p.sayT=1.6;
              if(weight()>400){setTimeout(()=>{SFX.buzz();toast('ブーッ！ じゅうりょう オーバー！');p.say='ごめんなさい〜 おります';p.sayT=2;p.leave=true;p.overload=true},900)}
            }
          }
        }
      }
    }
    // auto close
    const busy=pax.some(p=>p.st==='enter'||p.st==='exit')||waiting.length||pax.some(p=>p.leave&&p.st==='in');
    if(!busy&&cur.door>=1&&cur.openT>(req.size?4.5:7)&&weight()<=400){cur.doorTarget=0;SFX.door();cur.openT=-99}
    if(cur.doorTarget===0&&cur.door<=0){cur.mode='idle';cur.ev=null;waiting=[];if(req.size)setTimeout(startMove,400)}
  }
  if(cur.mode==='idle'&&req.size&&cur.door<=0&&cur.doorTarget===0)startMove();
  // passengers
  for(const p of pax){
    p.sayT=(p.sayT||0)-dt;p.jump=Math.max(0,(p.jump||0)-dt);
    if(p.st==='enter'){p.t+=dt/0.9;if(p.t>=1){p.st='in';p.t=1;
        const ch=CH[p.k];let d;do{d=1+Math.floor(Math.random()*TOP)}while(d===cur.floor);p.dest=d;
        if(!p.overload)setTimeout(()=>{if(p.st!=='in'||p.leave)return;p.say=d+'かい おねがいします';p.sayT=2;voiceOf(p.k);press(d,true)},500)}}
    else if(p.st==='exit'){p.t-=dt/0.9;if(p.t<=0){p.st='gone'}}
  }
  pax=pax.filter(p=>p.st!=='gone');
  // particles
  for(const q of fx){q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.r=(q.r||0)+(q.vr||0)*dt;if(q.g)q.vy+=q.g*dt;if(q.grow)q.s+=q.grow*dt;
    if(q.type==='bee'){q.vx+=rand(-600,600)*dt;q.vy+=rand(-600,600)*dt;q.vx=clamp(q.vx,-260,260);q.vy=clamp(q.vy,-260,260);if(q.x<40||q.x>960)q.vx*=-1;if(q.y<40||q.y>700)q.vy*=-1}}
  fx=fx.filter(q=>q.life>0);
  dark=cur.ev&&cur.ev.dark&&cur.door>0.3&&(!cur.ev.darkUntil||cur.evState.t<cur.ev.darkUntil)?Math.min(0.7,dark+dt*2):Math.max(0,dark-dt*2);
}
function stopDist(){return cur.v*cur.v/(2*1.4)+0.05}
function voiceOf(k){const c=CH[k];if(c.meow)SFX.meow(rand(600,800));else voice(c.v||600)}
function spawnFx(type,dt){

function drawPax(now){
  const list=pax.slice().sort((a,b)=>paxSize(a)-paxSize(b));

    const fx0=p.st==='exit'?500:p.fromX,fy0=p.st==='exit'?OY+OH-120:p.fromY;
    const k=easeOut(p.t);let x=fx0+(tx-fx0)*k,y=fy0+(ty-fy0)*k,s=110+(ts-110)*k;
    if(p.st!=='in')y-=Math.sin(k*Math.PI*3)*10;
    if(cur.ev&&cur.ev.float&&cur.door>0.5&&p.st==='in')y-=40+Math.sin(now*2+p.bob)*30;
    if(cur.ev&&cur.ev.dance&&cur.door>0.5&&p.st==='in')y-=Math.abs(Math.sin(now*7.8+p.bob))*25;
    if(p.jump>0)y-=Math.sin(p.jump/0.5*Math.PI)*40;
    if(cur.mode==='moving'&&p.st==='in')y+=Math.sin(now*20+p.bob)*1;
    const alpha=p.st==='exit'?Math.min(1,p.t*2):1;
    const rot=(cur.ev&&cur.ev.dance&&cur.door>0.5)?Math.sin(now*7.8+p.bob)*0.15:0;
    em(CH[p.k].e,x,y,s,rot,alpha);
    if(CH[p.k].item)em(CH[p.k].item,x+s*0.38,y+s*0.25,s*0.4,0,alpha);
  }
  for(const p of list)if(p.sayT>0){const [sx,ssc]=SLOTS[p.slot];const k=easeOut(p.t);const fx0=p.st==='exit'?500:p.fromX,fy0=p.st==='exit'?OY+OH-120:p.fromY;bubbleText(p.say,clamp(fx0+(sx-fx0)*k,180,820),(fy0+(640-fy0)*k)-140)}
}
function paxSize(p){return SLOTS[p.slot][1]*easeOut(p.t)}
function easeOut(t){t=clamp(t,0,1);return 1-(1-t)*(1-t)}
function drawFx(){
  for(const q of fx){const a=Math.min(1,q.life);
    if(q.e){em(q.e,q.x,q.y,q.s,q.r||0,a)}
    else if(q.type==='snow'){circle(q.x,q.y,q.s,`rgba(255,255,255,${a})`)}
    else if(q.type==='rain'){g.strokeStyle=`rgba(170,200,255,${a*.8})`;g.lineWidth=3;g.beginPath();g.moveTo(q.x,q.y);g.lineTo(q.x+q.vx*0.02,q.y+q.s);g.stroke()}
    else if(q.type==='confetti'){g.save();g.translate(q.x,q.y);g.rotate(q.r);g.fillStyle=q.c;g.globalAlpha=a;g.fillRect(-q.s/2,-q.s/4,q.s,q.s/2);g.restore()}
    else if(q.type==='bubbles'){g.strokeStyle=`rgba(255,255,255,${a*.9})`;g.lineWidth=3;g.beginPath();g.arc(q.x,q.y,q.s,0,7);g.stroke();circle(q.x-q.s*0.35,q.y-q.s*0.35,q.s*0.2,`rgba(255,255,255,${a*.7})`)}
    else if(q.type==='steam'){circle(q.x,q.y,q.s,`rgba(255,255,255,${a*.35})`)}
  }
}
function drawToast(){if(toastT<=0)return;g.save();g.globalAlpha=Math.min(1,toastT*2);g.font=`800 40px ${FONT}`;g.textAlign='center';g.textBaseline='middle';g.lineWidth=10;g.strokeStyle='#2a2430';g.fillStyle='#fff';g.strokeText(toastTxt,500,200,960);g.fillText(toastTxt,500,200,960);g.restore()}
function render(now){
  g.setTransform(1,0,0,1,0,0);g.fillStyle='#1d1b22';g.fillRect(0,0,canvas.width,canvas.height);
  let sx=0,sy=0;if(shake>0){sx=rand(-8,8)*Math.min(1,shake);sy=rand(-8,8)*Math.min(1,shake)}
  if(cur.mode==='moving'){sy+=Math.sin(now*30)*0.8}
  g.setTransform(scale,0,0,scale,offX+sx*scale,offY+sy*scale);
  g.save();g.beginPath();g.rect(0,0,VW,VH);g.clip();
  drawInterior();drawOutside();drawPax(now);drawFx();
  if(dark>0){g.fillStyle=`rgba(0,0,10,${dark})`;g.fillRect(0,0,VW,VH);if(Math.random()<0.02){g.fillStyle='rgba(255,255,255,.1)';g.fillRect(0,0,VW,VH)}}
  drawToast();
  g.restore();
  $('dnum').textContent=cur.floor;$('arrow').textContent=cur.mode==='moving'?(cur.dir>0?'▲':'▼'):'';
}
let last=performance.now();
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;if(!$('title').hidden){render(now/1000)}else{update(dt);render(now/1000)}requestAnimationFrame(frame)}
canvas.addEventListener('pointerdown',e=>{
  const r=canvas.getBoundingClientRect(),x=((e.clientX-r.left)*dpr-offX)/scale,y=((e.clientY-r.top)*dpr-offY)/scale;
  let best=null,bd=110;
  for(const p of pax){if(p.st!=='in')continue;const [sx]=SLOTS[p.slot];const d=Math.hypot(x-sx,y-640);if(d<bd){bd=d;best=p}}
  if(best){best.say=pick(CH[best.k].l);best.sayT=1.8;best.jump=0.5;voiceOf(best.k);return}
  if(cur.door>0.5)for(const w of waiting){if(Math.hypot(x-(OX+w.x),y-(OY+w.y))<80){voiceOf(w.k);toast(CH[w.k].n+'「'+pick(CH[w.k].l)+'」',1.5);return}}
});
resize();
// idle lobby behind the title
cur.ev=EV[0];cur.evState={t:0};cur.door=0;
$('loading').hidden=true;
requestAnimationFrame(frame);
})();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('../sw.js').catch(()=>{}));</script>
