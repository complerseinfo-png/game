<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="エレベーター">
<meta name="theme-color" content="#1d1b22">
<title>エレベーター ごっこ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
:root{--ink:#2a2430;--font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1d1b22;color:#fff;font-family:var(--font);user-select:none;-webkit-user-select:none;touch-action:manipulation}
[hidden]{display:none!important}
#app{position:fixed;inset:0;display:flex}
#view{flex:1;position:relative;min-width:0}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#panel{flex:none;width:min(31vw,300px);background:linear-gradient(90deg,#9aa3ab,#d6dce1 30%,#c2c9cf 70%,#8d959c);display:flex;flex-direction:column;align-items:center;gap:1.4vh;padding:1.6vh 10px;box-shadow:inset 4px 0 8px rgba(0,0,0,.35)}
#disp{width:100%;max-width:200px;background:#120f0c;border:4px solid #555;border-radius:10px;color:#ff9a2a;font:800 clamp(28px,6vh,52px)/1.1 monospace;text-align:center;padding:4px 0;text-shadow:0 0 10px #ff7a00;display:flex;justify-content:center;gap:10px}
#arrow{width:.8em}
#floors{display:grid;grid-template-columns:1fr 1fr;gap:1.2vh 14px;flex:1;align-content:center}
.fb{width:clamp(48px,9.6vh,78px);height:clamp(48px,9.6vh,78px);border-radius:50%;border:4px solid #7a838b;background:radial-gradient(circle at 40% 35%,#ffffff,#d9dee2 55%,#aab2b9);
  font:800 clamp(20px,4.2vh,34px) var(--font);color:#3a3f46;box-shadow:0 4px 0 #6d757c,inset 0 -3px 6px rgba(0,0,0,.15);cursor:pointer;padding:0}
.fb:active{transform:translateY(3px);box-shadow:0 1px 0 #6d757c}
.fb.on{border-color:#ff9a2a;color:#ff7a00;box-shadow:0 4px 0 #6d757c,0 0 16px 4px rgba(255,150,40,.9);background:radial-gradient(circle at 40% 35%,#fffbe8,#ffe2a8 55%,#ffc266)}
#ctl{display:flex;gap:12px}
.cb{width:clamp(56px,10vh,80px);height:clamp(56px,10vh,80px);border-radius:16px;border:4px solid #7a838b;background:linear-gradient(#fff,#cfd5da);box-shadow:0 4px 0 #6d757c;cursor:pointer;padding:0}
.cb:active,.cb.on{transform:translateY(3px);box-shadow:0 1px 0 #6d757c;border-color:#2b9aff}
.cb svg{width:70%;height:70%}
#bell{background:linear-gradient(#ffe25a,#f2b800)}
#tools{display:flex;gap:8px}
.tb{font:800 14px var(--font);padding:6px 10px;border-radius:999px;border:3px solid #3a3f46;background:#fff;color:#3a3f46;cursor:pointer}
@media (orientation:portrait){
  #app{flex-direction:column}
  #panel{width:100%;height:auto;flex-direction:row;flex-wrap:wrap;justify-content:center;padding:8px;gap:8px}
  #floors{grid-template-columns:repeat(6,1fr);gap:8px;flex:none}
  .fb{width:min(13vw,64px);height:min(13vw,64px)}
  #disp{max-width:150px;font-size:34px}
  .cb{width:min(14vw,64px);height:min(14vw,64px)}
}
/* overlays */
.ov{position:fixed;inset:0;display:grid;place-items:center;background:rgba(20,18,26,.75);z-index:20;padding:16px}
.card{background:#fffaf0;color:var(--ink);border:5px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:22px;max-width:640px;width:100%;text-align:center}
.card h1{margin:0 0 8px;font-size:clamp(34px,8vw,56px);color:#ff7a00;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.card p{margin:6px 0;font-size:18px}
.big{font:800 30px var(--font);padding:12px 48px;border-radius:999px;border:4px solid var(--ink);background:#ffcc33;color:var(--ink);box-shadow:0 6px 0 var(--ink);cursor:pointer;margin-top:12px}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
#zgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;max-height:60vh;overflow:auto;margin:10px 0}
.zt{border:3px solid var(--ink);border-radius:14px;padding:6px 2px;background:#fff;font-size:12px;font-weight:800}
.zt span{display:block;font-size:34px;line-height:1.2;font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif}
.zt.no{background:#ddd;color:#888}
#toast{position:absolute;left:50%;top:15%;transform:translateX(-50%);font:800 clamp(18px,3.4vw,34px) var(--font);color:#fff;-webkit-text-stroke:2px #2a2430;paint-order:stroke fill;text-shadow:0 3px 0 #2a2430;white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none;z-index:5;max-width:96%;overflow:hidden;text-overflow:ellipsis}
#bubbles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bub{position:absolute;left:0;top:0;background:#fffaf0;color:#2a2430;border:4px solid #2a2430;border-radius:22px;padding:4px 14px;font:800 clamp(14px,2.4vw,22px) var(--font);white-space:nowrap}
.bub::after{content:"";position:absolute;left:50%;bottom:-12px;margin-left:-8px;border:8px solid transparent;border-top-color:#2a2430}
.zh{grid-column:1/-1;font-weight:800;font-size:18px;text-align:left;margin-top:6px}
.zt img{display:block;width:72px;height:72px;margin:0 auto}
.zt b{display:block;font-size:40px;line-height:72px}
.zt.place{display:grid;place-items:center;min-height:52px;font-size:13px}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#1d1b22;color:#fff;font-size:28px;font-weight:800;z-index:30}
</style>
</head>
<body>
<div id="app">
  <div id="view"><canvas id="c"></canvas><div id="bubbles"></div><div id="toast"></div></div>
  <div id="panel">
    <div id="tools"><button class="tb" id="zukanBtn">ずかん</button><button class="tb" id="muteBtn">おと ON</button><button class="tb" id="fullBtn">ぜんがめん</button></div>
    <div id="disp"><span id="arrow"></span><span id="dnum">1</span></div>
    <div id="floors"></div>
    <div id="ctl">
      <button class="cb" id="openBtn" aria-label="ひらく"><svg viewBox="0 0 40 40"><path d="M4 20l9-8v16zM36 20l-9-8v16z" fill="#2a2f36"/><rect x="18.5" y="8" width="3" height="24" fill="#2a2f36"/></svg></button>
      <button class="cb" id="closeBtn" aria-label="しめる"><svg viewBox="0 0 40 40"><path d="M17 20l-9-8v16zM23 20l9-8v16z" fill="#2a2f36"/><rect x="18.5" y="8" width="3" height="24" fill="#2a2f36"/></svg></button>
      <button class="cb" id="bell" aria-label="ベル"><svg viewBox="0 0 40 40"><path d="M20 6c-6 0-9 5-9 11v7l-3 4h24l-3-4v-7c0-6-3-11-9-11z" fill="#2a2f36"/><circle cx="20" cy="32" r="3" fill="#2a2f36"/></svg></button>
    </div>
  </div>
</div>
<div class="ov" id="title">
  <div class="card">
    <h1>エレベーター ごっこ</h1>
    <p>ボタンを おして いろんな かいへ いこう！</p>
    <p>ドアが ひらくと なにが いるかな？</p>
    <p id="titleCount" style="font-weight:800"></p>
    <button class="big" id="startBtn">のる！</button>
  </div>
</div>
<div class="ov" id="zukan" hidden>
  <div class="card">
    <h1 style="font-size:36px">ずかん</h1>
    <p id="zcount" style="font-weight:800"></p>
    <div id="zgrid"></div>
    <button class="big" id="zclose" style="font-size:22px;padding:8px 36px">とじる</button>
  </div>
</div>
<div id="loading">よみこみちゅう…</div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const EMOJI='"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol",sans-serif';
const FONT='"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif';
const TOP=12;

// ================= sound =================
let ac=null,master=null,muted=false;
function audio(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=0.5;master.connect(ac.destination)}catch(e){return null}}if(ac.state==='suspended')ac.resume();return ac}
function tone(f,d,type='sine',vol=.08,slide=0,delay=0){if(muted||!audio())return;const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(master);o.start(t);o.stop(t+d+.05)}
function noise(d,vol=.1,f=1000,q=1,delay=0,type='bandpass',fEnd=0){if(muted||!audio())return;const t=ac.currentTime+delay,n=Math.floor(ac.sampleRate*d),b=ac.createBuffer(1,n,ac.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=Math.random()*2-1;
  const s=ac.createBufferSource();s.buffer=b;const fl=ac.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t);if(fEnd)fl.frequency.exponentialRampToValueAtTime(fEnd,t+d);fl.Q.value=q;const g=ac.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl).connect(g).connect(master);s.start(t)}
let hum=null;
function humOn(on){if(!audio())return;if(!hum){const n=ac.sampleRate*2,b=ac.createBuffer(1,n,ac.sampleRate),c=b.getChannelData(0);let l=0;for(let i=0;i<n;i++){l=l*0.98+(Math.random()*2-1)*0.02;c[i]=l*8}
  const s=ac.createBufferSource();s.buffer=b;s.loop=true;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=300;hum=ac.createGain();hum.gain.value=0;s.connect(f).connect(hum).connect(master);s.start()}
  hum.gain.setTargetAtTime(on&&!muted?0.12:0,ac.currentTime,0.25)}
const SFX={
  pon(){tone(1046,1.4,'sine',.12);tone(2093,.8,'sine',.03)},
  pinpon(){tone(784,.5,'sine',.1);tone(622,.8,'sine',.1,0,.45)},
  door(){noise(0.7,0.05,500,0.8,0,'lowpass',200)},
  buzz(){tone(180,1.2,'square',.06);tone(183,1.2,'square',.04)},
  click(){tone(1500,.05,'square',.04)},
  bell(){for(let i=0;i<14;i++)tone(i%2?1250:1150,.08,'square',.04,0,i*.08)},
  roar(){tone(110,1.2,'sawtooth',.12,-60);noise(1.2,.15,400,0.7,0,'lowpass',120)},
  splash(){noise(.9,.18,1500,0.5,0,'bandpass',400)},
  boom(){noise(1.2,.25,300,0.7,0,'lowpass',60);tone(70,.8,'sine',.15,-30)},
  pop(){tone(rand(500,900),.1,'sine',.07,600)},
  siren(){for(let i=0;i<6;i++)tone(i%2?950:700,.3,'square',.035,0,i*.3)},
  trumpet(){tone(330,.9,'sawtooth',.08,330);tone(335,.9,'sawtooth',.05,340)},
  train(){for(let i=0;i<8;i++)noise(.12,.12,i%2?900:600,2,i*.18)},
  thud(){tone(90,.25,'sine',.15,-40);noise(.15,.1,300,1)},
  meow(p=650){if(muted||!audio())return;const t=ac.currentTime,o=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(p*0.9,t);o.frequency.linearRampToValueAtTime(p*1.25,t+.15);o.frequency.linearRampToValueAtTime(p*0.8,t+.5);f.type='bandpass';f.Q.value=3;f.frequency.setValueAtTime(800,t);f.frequency.linearRampToValueAtTime(1800,t+.15);f.frequency.linearRampToValueAtTime(700,t+.5);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+.55);o.connect(f).connect(g).connect(master);o.start(t);o.stop(t+.6)},
  bees(){tone(220,1.5,'sawtooth',.04,20);tone(233,1.5,'sawtooth',.03,-20)},
  rocket(){noise(2.5,.2,200,0.5,0,'lowpass',2000)},
  ghost(){tone(400,1.2,'sine',.08,-200);tone(410,1.2,'triangle',.05,-180,.1)},
  music(notes,step=.22,type='triangle',vol=.07){notes.forEach((n,i)=>{if(n)tone(n,step*1.6,type,vol,0,i*step)})},
};
const N={C4:262,D4:294,E4:330,F4:349,G4:392,A4:440,B4:494,C5:523,D5:587,E5:659,F5:698,G5:784};
function voice(pitch,n=4){for(let i=0;i<n;i++)tone(pitch*rand(0.85,1.25),.07,'square',.035,0,i*.09)}
let jaVoice=null;
function loadVoices(){try{const v=speechSynthesis.getVoices();jaVoice=v.find(x=>/^ja/i.test(x.lang))||null}catch(e){}}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices}catch(e){}
function say(text){if(muted||!jaVoice)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.voice=jaVoice;u.lang='ja-JP';u.rate=1.05;u.pitch=1.2;u.volume=0.8;speechSynthesis.speak(u)}catch(e){}}

// ================= three.js basics =================
const view=$('view'),canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x1d1b22);
const camera=new THREE.PerspectiveCamera(62,1,0.05,120);
const CAM={x:0,y:2.7,z:4.9};
function resize(){const w=view.clientWidth,h=view.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;
  const narrow=w/h<1.05;camera.fov=narrow?78:62;CAM.z=narrow?5.3:4.9;camera.updateProjectionMatrix()}
addEventListener('resize',resize);
const hemi=new THREE.HemisphereLight(0xfff8ee,0x8a7a6a,0.85);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,0.55);sun.position.set(2,6,6);scene.add(sun);
const lam=c=>new THREE.MeshLambertMaterial({color:c});
const phong=(c,s=60)=>new THREE.MeshPhongMaterial({color:c,shininess:s});
const flat=c=>new THREE.MeshPhongMaterial({color:c,flatShading:true,shininess:5});
let PARENT=scene;
function mesh(geo,mat,x=0,y=0,z=0,parent){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);(parent||PARENT).add(m);return m}
function ctex(w,h,draw,rx=1,ry=1){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);return t}
const SPH=new THREE.SphereGeometry(1,16,12),SPH_LO=new THREE.SphereGeometry(1,10,8);
function ball(r,mat,x,y,z,p,sx=1,sy=1,sz=1){const m=mesh(SPH,mat,x,y,z,p);m.scale.set(r*sx,r*sy,r*sz);return m}
function cyl(rt,rb,h,mat,x,y,z,p,seg=12){return mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat,x,y,z,p)}
function boxm(w,h,d,mat,x,y,z,p){return mesh(new THREE.BoxGeometry(w,h,d),mat,x,y,z,p)}
function cone(r,h,mat,x,y,z,p,seg=12){return mesh(new THREE.ConeGeometry(r,h,seg),mat,x,y,z,p)}

// ================= animals (chibi 3D) =================
const patTex={};
function pattern(kind,base,ink){const key=kind+base+ink;if(patTex[key])return patTex[key];
  const t=ctex(128,128,(g,w,h)=>{g.fillStyle='#'+base.toString(16).padStart(6,'0');g.fillRect(0,0,w,h);g.fillStyle='#'+ink.toString(16).padStart(6,'0');
    if(kind==='stripes'||kind==='zebra'){for(let i=0;i<8;i++){g.beginPath();g.moveTo(i*16,0);g.quadraticCurveTo(i*16+10,64,i*16,128);g.lineTo(i*16+(kind==='zebra'?8:6),128);g.quadraticCurveTo(i*16+16,64,i*16+(kind==='zebra'?8:6),0);g.fill()}}
    else if(kind==='spots'){for(let i=0;i<9;i++){g.beginPath();g.ellipse((i*47)%128,(i*71)%128,14,11,i,0,7);g.fill()}}
    else if(kind==='giraffe'){g.strokeStyle='#fff3d0';for(let i=0;i<10;i++){g.beginPath();const x=(i*41)%128,y=(i*67)%128;g.moveTo(x,y);for(let k=0;k<6;k++){const a=k*1.05;g.lineTo(x+Math.cos(a)*16,y+Math.sin(a)*16)}g.closePath();g.fill()}}
  });patTex[key]=t;return t}
function matFor(c,pat,ink,fluffy){if(pat&&ink!==undefined)return new THREE.MeshLambertMaterial({map:pattern(pat,c,ink)});return fluffy?flat(c):lam(c)}
// d: {c,belly,ear,earC,snout,snoutC,pat,ink,mane,horn,tail,tailC,s,fluffy,cap,neck,cheek,special}
function animal(d){
  const g=new THREE.Group(),S=d.s||1;const P={g,legs:[],arms:[],eyes:[],d};
  const root=new THREE.Group();g.add(root);root.scale.setScalar(S);P.root=root;
  const shadow=mesh(new THREE.CircleGeometry(0.45,20),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.2,depthWrite:false}),0,0.01,0,g);shadow.rotation.x=-Math.PI/2;shadow.scale.setScalar(S);
  if(d.special){d.special(P,root);P.h=(d.h||1.6)*S;return P}
  const M=matFor(d.c,d.pat,d.ink,d.fluffy),B=lam(d.belly??d.c),dark=lam(0x2a2226);
  const body=new THREE.Group();root.add(body);P.body=body;
  // legs
  for(const s of[-1,1]){const piv=new THREE.Group();piv.position.set(s*0.17,0.36,0);body.add(piv);cyl(0.11,0.12,0.32,d.legC?lam(d.legC):M,0,-0.18,0,piv);ball(0.13,d.footC?lam(d.footC):(d.legC?lam(d.legC):M),0,-0.32,0.05,piv,1,0.6,1.3);P.legs.push(piv)}
  // torso + belly
  ball(0.38,M,0,0.66,0,body,1,1.08,0.9);ball(0.27,B,0,0.62,0.16,body,1,1.1,0.7);
  // arms
  for(const s of[-1,1]){const piv=new THREE.Group();piv.position.set(s*0.34,0.86,0);body.add(piv);const a=cyl(0.085,0.09,0.36,d.armC?lam(d.armC):M,0,-0.16,0,piv);ball(0.1,d.armC?lam(d.armC):M,0,-0.34,0,piv);piv.rotation.z=s*0.25;P.arms.push(piv)}
  // tail
  const tc=lam(d.tailC??d.c);
  if(d.tail==='long'){const t=new THREE.Group();t.position.set(0,0.5,-0.32);body.add(t);for(let i=0;i<5;i++)ball(0.07,d.pat?M:tc,0,i*0.13,-i*0.06-0.03,t);t.rotation.x=-0.6;P.tail=t}
  else if(d.tail==='fluffy'){const t=ball(0.22,tc,0,0.62,-0.4,body,0.8,1.5,0.8);t.rotation.x=0.5;P.tail=t}
  else if(d.tail==='pom')ball(0.12,tc,0,0.5,-0.36,body);
  else if(d.tail==='curl'){const t=mesh(new THREE.TorusGeometry(0.08,0.03,6,12),tc,0,0.55,-0.38,body)}
  else if(d.tail==='tuft'){const t=new THREE.Group();t.position.set(0,0.5,-0.33);body.add(t);cyl(0.03,0.03,0.4,tc,0,0.15,-0.1,t).rotation.x=-0.6;ball(0.08,lam(d.tuftC||0x5a3a22),0,0.32,-0.22,t);P.tail=t}
  else if(d.tail==='flat'){const t=boxm(0.3,0.06,0.4,tc,0,0.3,-0.45,body);t.rotation.x=-0.3}
  else if(d.tail==='horse'){const t=ball(0.1,lam(d.maneC||d.c),0,0.6,-0.4,body,1,2.5,1);t.rotation.x=0.6}
  // head
  const head=new THREE.Group();head.position.set(0,1.18+(d.neck||0),0);body.add(head);P.head=head;
  if(d.neck){cyl(0.12,0.16,d.neck+0.2,M,0,0.95+d.neck/2,0,body)}
  const hs=d.headS||1;const hm=d.capC!==undefined?lam(d.c):M;
  ball(0.44*hs,hm,0,0,0,head,d.headW||1,0.92,0.92);
  if(d.capC!==undefined){const cp=ball(0.452*hs,lam(d.capC),0,0.06,-0.02,head,d.headW||1,0.8,0.92);}

// ================= state & logic =================
const cur={floor:1,pos:1,v:0,dir:0,door:0,doorTarget:0,mode:'idle',openT:0,ev:null,evS:null,openDelay:0};
const req=new Set();
let pax=[],waiting=[],shake=0,lastEvs=[];
let found={},met={};
try{found=JSON.parse(localStorage.getItem('elev3-found'))||{};met=JSON.parse(localStorage.getItem('elev3-met'))||{}}catch(e){}
function save(){try{localStorage.setItem('elev3-found',JSON.stringify(found));localStorage.setItem('elev3-met',JSON.stringify(met))}catch(e){}}
let toastT=0;function toast(t,d=2.2){const el=$('toast');el.textContent=t;el.style.opacity=1;toastT=d}
const SLOTS=[[-2.25,0.7],[2.25,0.7],[-2.05,1.95],[2.05,1.95],[-1.45,3.2]];
function slotFree(){for(let i=0;i<SLOTS.length;i++)if(!pax.some(p=>p.slot===i))return i;return -1}
function weight(){return pax.filter(p=>p.st==='in'||p.st==='enter').reduce((a,p)=>a+AN[p.k].w,0)}
function allSay(t){for(const p of pax)if(p.st==='in'){p.say=t;p.sayT=2}}
function scared(){for(const p of pax)if(p.st==='in'&&Math.random()<.8){p.say=pick(['こわい〜！','きゃー！','ひえ〜','しめて〜！']);p.sayT=1.6;p.jump=0.5}}
function voiceOf(k){const a=AN[k];if(a.meow)SFX.meow(a.meow*rand(0.95,1.1));else if(a.trumpet)SFX.trumpet();else if(a.moo)tone(150,0.8,'sawtooth',.06,-30);else voice(a.v||600)}
function walkAnim(p,t,moving){const s=moving?Math.sin(t*10):0;p.legs.forEach((l,i)=>l.rotation.x=(i?1:-1)*s*0.6);if(p.arms.length===2&&!p.armHold)p.arms.forEach((a,i)=>a.rotation.x=(i?-1:1)*s*0.5)}

// buttons
const fbtn={};
{const box=$('floors');for(let f=TOP;f>=1;f-=2)for(const n of[f-1,f]){const b=document.createElement('button');b.className='fb';b.textContent=n;b.addEventListener('pointerdown',e=>{e.preventDefault();press(n)});box.appendChild(b);fbtn[n]=b}}
function light(){for(const f in fbtn){const on=req.has(+f);fbtn[f].classList.toggle('on',on);panelLights[f].material.color.setHex(on?0xffa020:0xcfd5da)}}
function press(n,byPax){SFX.click();if(n===cur.floor&&cur.mode!=='moving'){if(!byPax)openBtn();return}req.add(n);light();if(cur.mode==='idle'&&cur.door===0)startMove()}
function openBtn(){if(cur.mode==='moving')return;if(cur.doorTarget===0){cur.doorTarget=1;SFX.door();if(!cur.ev)arrive()}cur.openT=0;cur.mode='open';cur.openDelay=0}
function closeDoor(){if(cur.mode==='moving')return;
  if(pax.some(p=>p.st==='enter'||p.st==='exit')){if(cur.doorTarget===0&&cur.door>0){cur.doorTarget=1;SFX.pinpon()}return}
  if(weight()>400){SFX.buzz();toast('ブーッ！ じゅうりょう オーバー！');return}
  if(cur.doorTarget===1){cur.doorTarget=0;SFX.door()}}
$('openBtn').addEventListener('pointerdown',e=>{e.preventDefault();SFX.click();openBtn()});
$('closeBtn').addEventListener('pointerdown',e=>{e.preventDefault();SFX.click();closeDoor()});
$('bell').addEventListener('pointerdown',e=>{e.preventDefault();SFX.bell();setTimeout(()=>{toast(pick(['「はい、かんりしつです。どうしましたか？」','「だいじょうぶですか〜？」','「ベルが なりましたね〜」']),2.6);say('どうしましたか')},1300);allSay('ジリリリ！')});
$('muteBtn').onclick=()=>{muted=!muted;$('muteBtn').textContent=muted?'おと OFF':'おと ON';humOn(cur.mode==='moving')};
function goFull(){const el=document.documentElement,f=el.requestFullscreen||el.webkitRequestFullscreen;if(!f||document.fullscreenElement||document.webkitFullscreenElement)return;try{const r=f.call(el,{navigationUI:'hide'});if(r&&r.catch)r.catch(()=>{})}catch(e){}}
$('fullBtn').onclick=()=>{if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}else goFull()};
$('startBtn').onclick=()=>{audio();goFull();$('title').hidden=true;arrive('lobby');cur.mode='open';cur.openT=0;cur.doorTarget=1;SFX.door();say('いっかいです')};
$('zukanBtn').onclick=()=>{buildZukan();$('zukan').hidden=false};
$('zclose').onclick=()=>{$('zukan').hidden=true};
$('titleCount').textContent=(()=>{const n=Object.keys(found).length;return n?`いままでに ${n}/${EV.length} の ばしょを みつけたよ`:''})();

let thumbR=null;const thumbs={};
function thumb(k){if(thumbs[k])return thumbs[k];try{if(!thumbR){thumbR=new THREE.WebGLRenderer({alpha:true,antialias:true,preserveDrawingBuffer:true});thumbR.setSize(96,96)}
  const sc=new THREE.Scene();sc.add(new THREE.HemisphereLight(0xffffff,0x887766,1.1));const dl=new THREE.DirectionalLight(0xffffff,0.4);dl.position.set(1,2,3);sc.add(dl);
  const p=animal(AN[k].d);sc.add(p.g);const h=p.h||1.6;const cam=new THREE.PerspectiveCamera(35,1,0.1,50);cam.position.set(0,h*0.6,h*2.3+0.6);cam.lookAt(0,h*0.5,0);
  thumbR.render(sc,cam);thumbs[k]=thumbR.domElement.toDataURL();sc.traverse(n=>{if(n.geometry&&n.geometry!==SPH)n.geometry.dispose()})}catch(e){thumbs[k]=''}return thumbs[k]}
function buildZukan(){const gr=$('zgrid');gr.innerHTML='';let n=0,m=0;const keys=Object.keys(AN);
  const h1=document.createElement('div');h1.className='zh';h1.textContent='あった どうぶつ';gr.appendChild(h1);
  for(const k of keys){const d=document.createElement('div');const ok=met[k];if(ok)m++;d.className='zt'+(ok?'':' no');d.innerHTML=ok?`<img src="${thumb(k)}" alt="">${AN[k].n}`:`<b>？</b>？？？`;gr.appendChild(d)}
  const h2=document.createElement('div');h2.className='zh';h2.textContent='みつけた ばしょ';gr.appendChild(h2);
  for(const ev of EV){const d=document.createElement('div');const ok=found[ev.k];if(ok)n++;d.className='zt place'+(ok?'':' no');d.textContent=ok?ev.name:'？？？';gr.appendChild(d)}
  $('zcount').textContent=`どうぶつ ${m}/${keys.length} ・ ばしょ ${n}/${EV.length}`}

// guests waiting outside
function makeChar(k){const p=animal(AN[k].d);p.k=k;p.bob=rand(0,6);return p}
function pickEvent(force){if(force)return EV.find(e=>e.k===force);if(cur.floor===1&&Math.random()<.5)return EV[0];
  let pool=EV.filter(e=>!lastEvs.includes(e.k)&&e.k!=='lobby');const fresh=pool.filter(e=>!found[e.k]);if(fresh.length&&Math.random()<.6)pool=fresh;return pick(pool)}
function arrive(force){
  const ev=pickEvent(force);cur.ev=ev;cur.evS={t:0};lastEvs.push(ev.k);if(lastEvs.length>8)lastEvs.shift();
  if(!found[ev.k]){found[ev.k]=1;save()}
  scene.fog=null;newWorld();ev.build(cur.evS);PARENT=scene;if(scene.fog){scene.fog.near=Math.max(scene.fog.near,6.5);scene.fog.far+=5}
  for(const w of waiting)if(w.bub)w.bub.remove();
  const ks=ev.guests?ev.guests():[];
  waiting=ks.map((k,i)=>{const p=makeChar(k);p.x=ks.length>1?(i?0.7:-0.7):0;p.z=-1.7-i*0.3;p.g.position.set(p.x,0,p.z);world.add(p.g);p.boardT=0.9+i*1.2;return p});
  for(const p of pax)if(p.st==='in'&&p.dest===cur.floor)p.leave=true;
  cur.opened=false;
}
function startMove(){
  if(cur.mode==='moving'||req.size===0)return;
  const above=[...req].filter(f=>f>cur.floor),below=[...req].filter(f=>f<cur.floor);
  if(cur.dir>=0&&above.length)cur.dir=1;else if(below.length)cur.dir=-1;else if(above.length)cur.dir=1;else{req.clear();light();return}
  cur.target=cur.dir>0?Math.min(...above):Math.max(...below);
  cur.mode='moving';cur.ev=null;for(const w of waiting)if(w.bub)w.bub.remove();waiting=[];clearFx();if(world){world.visible=false}scene.fog=null;humOn(true);
  say(cur.dir>0?'うえに まいります':'したへ まいります');
  for(const p of pax)if(p.st==='in'&&Math.random()<.35){p.say=pick(AN[p.k].l);p.sayT=1.8}
}
function stopDist(){return cur.v*cur.v/(2*1.4)+0.05}
let clock=0;
function update(dt){
  clock+=dt;if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').style.opacity=0}if(shake>0)shake-=dt;
  const ds=dt/0.9;if(cur.door<cur.doorTarget)cur.door=Math.min(1,cur.door+ds);else if(cur.door>cur.doorTarget)cur.door=Math.max(0,cur.door-ds);
  if(cur.mode==='moving'){
    const cand=[...req].filter(f=>cur.dir>0?f>=cur.pos+stopDist():f<=cur.pos-stopDist());
    if(cand.length)cur.target=cur.dir>0?Math.min(cur.target,...cand):Math.max(cur.target,...cand);
    const dist=Math.abs(cur.target-cur.pos);cur.v=Math.min(cur.v+1.4*dt,1.25,Math.sqrt(2*1.4*dist)+0.02);cur.pos+=cur.dir*cur.v*dt;
    const nf=Math.round(cur.pos);if(nf!==cur.floor){cur.floor=nf;tone(1600,.03,'sine',.015)}
    if((cur.dir>0&&cur.pos>=cur.target)||(cur.dir<0&&cur.pos<=cur.target)||dist<0.003){
      cur.pos=cur.target;cur.floor=cur.target;cur.v=0;cur.mode='open';humOn(false);req.delete(cur.floor);light();
      SFX.pon();say(cur.floor+'かいです');arrive();cur.openDelay=0.7;cur.openT=-0.7}
  }
  if(cur.mode==='open'&&cur.openDelay>0){cur.openDelay-=dt;if(cur.openDelay<=0){cur.doorTarget=1;SFX.door()}}
  else if(cur.mode==='open'){
    cur.openT+=dt;
    if(cur.door>0.4&&cur.ev){cur.evS.t+=dt;if(!cur.opened){cur.opened=true;cur.ev.onOpen&&cur.ev.onOpen(cur.evS)}spawnFx(cur.ev.fx,dt)}
    if(cur.door>0.8){
      const leaving=pax.find(p=>p.leave&&p.st==='in');
      if(leaving&&!pax.some(p=>p.st==='exit'||p.st==='enter')){leaving.st='exit';leaving.t=0;leaving.say=leaving.overload?'ごめんなさい〜':pick(['ありがとう！','またね〜','ここで おりるね']);leaving.sayT=1.5;voiceOf(leaving.k)}
      else if(!pax.some(p=>p.st==='exit'||(p.leave&&p.st==='in'))){
        const w=waiting[0];
        if(w&&!pax.some(p=>p.st==='enter')){w.boardT-=dt;
          if(w.boardT<=0){waiting.shift();const slot=slotFree();
            if(slot<0){SFX.buzz();toast('まんいん です！ ブーッ');w.say='のれない〜';w.sayT=1.5;w.st='reject';w.t=0;rejected.push(w)}
            else{w.st='enter';w.t=0;w.slot=slot;w.fromX=w.x;w.fromZ=w.z;pax.push(w);world.remove(w.g);scene.add(w.g);
              if(!met[w.k]){met[w.k]=1;save()}voiceOf(w.k);w.say=pick(AN[w.k].l);w.sayT=1.6;
              if(weight()>400){setTimeout(()=>{SFX.buzz();toast('ブーッ！ じゅうりょう オーバー！');w.say='おもすぎた〜 おります';w.sayT=2;w.leave=true;w.overload=true},1000)}}}}}
    }
    const busy=pax.some(p=>p.st==='enter'||p.st==='exit'||(p.leave&&p.st==='in'))||waiting.length;
    if(!busy&&cur.door>=1&&cur.openT>(req.size?4.5:7)&&weight()<=400){cur.doorTarget=0;SFX.door();cur.openT=-99}
    if(cur.doorTarget===0&&cur.door<=0){cur.mode='idle';cur.ev=null;for(const w of waiting)if(w.bub)w.bub.remove();waiting=[];if(req.size)setTimeout(startMove,400)}
  }
  if(cur.mode==='idle'&&req.size&&cur.door<=0&&cur.doorTarget===0)startMove();
  if(cur.ev&&cur.ev.update&&cur.door>0)cur.ev.update(dt,cur.evS,clock);
  // passengers
  for(const p of pax){
    p.sayT=(p.sayT||0)-dt;p.jump=Math.max(0,(p.jump||0)-dt);
    if(p.st==='enter'){p.t+=dt/1.1;if(p.t>=1){p.st='in';p.t=1;let d;do{d=1+Math.floor(Math.random()*TOP)}while(d===cur.floor);p.dest=d;
        if(!p.overload)setTimeout(()=>{if(p.st!=='in'||p.leave)return;p.say=d+'かい おねがいします';p.sayT=2;voiceOf(p.k);press(d,true)},500)}}
    else if(p.st==='exit'){p.t+=dt/1.1;if(p.t>=1){p.st='gone';scene.remove(p.g);if(p.bub)p.bub.remove()}}
  }
  pax=pax.filter(p=>p.st!=='gone');
  for(const w of rejected){w.t+=dt;w.sayT-=dt;w.g.position.z=w.z-w.t*1.5;if(w.t>1.2){world&&world.remove(w.g);if(w.bub)w.bub.remove();w.gone=1}}rejected=rejected.filter(w=>!w.gone);
  updateFx(dt);
}
let rejected=[];
function posOf(p){
  const [sx,sz]=SLOTS[p.slot]||[0,0];
  if(p.st==='enter'){const k=easeIO(p.t);// walk to the doorway, then to the slot
    if(k<0.5){const u=k/0.5;return[p.fromX*(1-u),p.fromZ+(0.4-p.fromZ)*u,u<1?Math.atan2(-p.fromX,0.4-p.fromZ):0]}
    const u=(k-0.5)/0.5;return[sx*u,0.4+(sz-0.4)*u,Math.atan2(sx,sz-0.4)]}
  if(p.st==='exit'){const k=easeIO(p.t);if(k<0.5){const u=k/0.5;return[sx*(1-u),sz+(0.4-sz)*u,Math.atan2(-sx,0.4-sz)]}const u=(k-0.5)/0.5;return[0,0.4-u*2.6,Math.PI]}
  return[sx,sz,0];
}
function easeIO(t){t=clamp(t,0,1);return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2}

// ================= particles =================
const fxPool=[];let fxList=[];
const fxGeo={s:new THREE.SphereGeometry(1,8,6),b:new THREE.BoxGeometry(1,1,1),p:new THREE.PlaneGeometry(1,1),o:new THREE.OctahedronGeometry(1)};
function getFx(geo,color,opacity=1){let m=fxPool.find(q=>!q.visible&&q.geometry===geo);if(!m){m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color,transparent:true,side:THREE.DoubleSide,depthWrite:false}));scene.add(m);fxPool.push(m)}m.material.color.setHex(color);m.material.opacity=opacity;m.visible=true;m.rotation.set(0,0,0);return m}
function spawn(type,o={}){
  const x=o.x??rand(-1.1,1.1),y=o.y??rand(0.5,3),z=o.z??rand(-4,-1);let m,u={type,vx:rand(-0.3,0.3),vy:0,vz:rand(1.5,3),life:3,spin:0,grow:0,g:0};
  switch(type){
    case'snow':m=getFx(fxGeo.s,0xffffff);m.scale.setScalar(0.05);u.vy=-rand(0.5,1);u.vz=rand(0.5,1.5);u.life=5;break;
    case'rain':m=getFx(fxGeo.b,0xaad0ff,0.7);m.scale.set(0.02,0.35,0.02);u.vy=-9;u.vz=rand(0,1);u.life=0.6;break;
    case'confetti':m=getFx(fxGeo.p,new THREE.Color().setHSL(Math.random(),0.9,0.6).getHex());m.scale.setScalar(0.12);u.vy=rand(1,3);u.g=-3;u.spin=rand(4,9);u.life=3;break;
    case'bubbles':m=getFx(fxGeo.s,0xcff0ff,0.45);m.scale.setScalar(rand(0.06,0.15));u.vy=rand(0.5,1.2);u.life=4;break;
    case'balloons':{m=getFx(fxGeo.s,[0xff5a5a,0xffd23b,0x6ab8ff,0x8ad06a,0xff8ad8][Math.floor(Math.random()*5)]);m.scale.set(0.25,0.3,0.25);u.vy=rand(0.6,1.2);u.life=6;break}
    case'leaves':m=getFx(fxGeo.p,pick([0x5ab84a,0x8ad06a,0xd8a040]));m.scale.set(0.14,0.08,1);u.vx=rand(0.5,1.5);u.vy=-0.4;u.spin=rand(2,5);u.life=4;break;
    case'steam':m=getFx(fxGeo.s,0xffffff,0.3);m.scale.setScalar(0.2);u.vy=rand(0.4,0.8);u.vz=rand(0.2,0.8);u.grow=0.4;u.life=3;break;
    case'candy':m=getFx(fxGeo.s,pick([0xff5a8a,0xffd23b,0x6ab8ff,0x8ad06a]));m.scale.setScalar(0.1);u.vy=rand(-1,0.5);u.g=-2;u.life=4;break;
    case'stars':m=getFx(fxGeo.o,pick([0xffe04a,0xffffff,0xff8ad8]));m.scale.setScalar(0.07);u.spin=4;u.vy=rand(-0.3,0.3);u.life=2.5;break;
    case'notes':m=getFx(fxGeo.o,0x2a2430);m.scale.set(0.06,0.09,0.06);u.vy=0.6;u.life=3;break;
    case'smoke':m=getFx(fxGeo.s,0xdddddd,0.7);m.scale.setScalar(0.4);u.vx=rand(-1,1);u.vy=rand(-0.5,0.3);u.vz=rand(0,0.5);u.grow=0.8;u.life=2;break;
    case'zzz':m=getFx(fxGeo.b,0x6a7ad8,0.9);m.scale.set(0.12,0.02,0.02);u.vy=0.5;u.vz=0.1;u.spin=1;u.life=2;break;
    case'bee':m=null;break;
  }
  if(!m)return;m.position.set(x,y,z);m.userData=u;fxList.push(m)}
const bees=[];
function spawnFx(type,dt){if(!type)return;
  if(type==='bees'){if(!bees.length)for(let i=0;i<6;i++){const g=new THREE.Group();ball(0.12,lam(0xffd23b),0,0,0,g,1.3,1,1);for(let k=0;k<2;k++)boxm(0.05,0.25,0.25,lam(0x2a2226),-0.05+k*0.1,0,0,g);for(const s of[-1,1]){const w=ball(0.1,new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.7}),0,0.12,s*0.06,g,1,0.3,0.6);w.userData.s=s}g.position.set(rand(-1,1),rand(1,3),rand(-3,-1));g.userData={vx:0,vy:0,vz:rand(0.5,1.5)};scene.add(g);bees.push(g)}return}
  const rate={snow:30,confetti:30,bubbles:8,balloons:3,leaves:6,rain:70,steam:8,candy:5,stars:8,notes:4}[type]||0;
  let n=rate*dt;while(n>0){if(Math.random()<n)spawn(type);n-=1}}
function updateFx(dt){
  for(const m of fxList){const u=m.userData;u.life-=dt;u.vy+=u.g*dt;m.position.x+=u.vx*dt;m.position.y+=u.vy*dt;m.position.z+=u.vz*dt;if(u.spin){m.rotation.x+=u.spin*dt;m.rotation.y+=u.spin*0.7*dt}if(u.grow)m.scale.multiplyScalar(1+u.grow*dt);if(u.type==='snow'||u.type==='rain')if(m.position.y<0.02)u.life=0;
    if(u.life<0.5)m.material.opacity=Math.max(0,u.life*2)*(u.type==='steam'?0.3:1);if(u.life<=0)m.visible=false}
  fxList=fxList.filter(m=>m.visible);
  for(const b of bees){const u=b.userData;u.vx+=rand(-6,6)*dt;u.vy+=rand(-6,6)*dt;u.vz+=rand(-6,6)*dt;u.vx=clamp(u.vx,-2,2);u.vy=clamp(u.vy,-2,2);u.vz=clamp(u.vz,-2,2);b.position.x+=u.vx*dt;b.position.y+=u.vy*dt;b.position.z+=u.vz*dt;
    if(Math.abs(b.position.x)>2.5)u.vx*=-1;if(b.position.y<0.6||b.position.y>3.8)u.vy*=-1;if(b.position.z<-3||b.position.z>4.2)u.vz*=-1;b.rotation.y=Math.atan2(u.vx,u.vz)-Math.PI/2;b.children.forEach(c=>{if(c.userData.s)c.rotation.x=Math.sin(clock*60)*0.6*c.userData.s})}}
function clearFx(){for(const m of fxList)m.visible=false;fxList=[];for(const b of bees)scene.remove(b);bees.length=0}

// ================= speech bubbles (HTML) =================
const bubLayer=$('bubbles');const _v=new THREE.Vector3();
function bubble(p){if(p.sayT>0&&p.say){if(!p.bub){p.bub=document.createElement('div');p.bub.className='bub';bubLayer.appendChild(p.bub)}if(p.bub.textContent!==p.say)p.bub.textContent=p.say;
    _v.set(0,(p.h||1.6)+0.25,0);p.g.localToWorld(_v);_v.project(camera);if(_v.z>1){p.bub.style.display='none';return}p.bub.style.display='block';
    const w=view.clientWidth,h=view.clientHeight;p.bub.style.transform=`translate(${(_v.x*0.5+0.5)*w}px,${(-_v.y*0.5+0.5)*h}px) translate(-50%,-100%)`}
  else if(p.bub){p.bub.remove();p.bub=null}}

// ================= render =================
function render(now){
  const t=now/1000;
  // doors
  const o=cur.door;doorL.position.x=-DW/4-o*DW/2;doorR.position.x=DW/4+o*DW/2;
  if(world)world.visible=cur.door>0.001||cur.mode!=='moving';
  // dark scenes dim the light
  const ev=cur.ev;const dk=ev&&ev.dark&&cur.door>0.3&&(!ev.darkUntil||cur.evS.t<ev.darkUntil);
  const tgt=dk?0.18:0.85;hemi.intensity+=(tgt-hemi.intensity)*0.1;sun.intensity=hemi.intensity*0.65;
  // passengers
  for(const p of pax){const [x,z,ry]=posOf(p);let y=0;const walking=p.st!=='in';
    if(walking)y=Math.abs(Math.sin(t*10))*0.08;
    if(ev&&ev.float&&cur.door>0.5&&p.st==='in')y=0.4+Math.sin(t*2+p.bob)*0.25;
    if(ev&&ev.dance&&cur.door>0.5&&p.st==='in'){y=Math.abs(Math.sin(t*7.8+p.bob))*0.25;p.g.rotation.z=Math.sin(t*3.9+p.bob)*0.15}else p.g.rotation.z=0;
    if(p.jump>0)y+=Math.sin(p.jump/0.5*Math.PI)*0.4;
    p.g.position.set(x,y,z);
    // face where they walk, then turn toward the camera
    const face=p.st==='in'?Math.atan2(CAM.x-x,CAM.z-z):ry;let d=face-p.g.rotation.y;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;p.g.rotation.y+=d*0.15;
    walkAnim(p,t,walking);idle(p,t);bubble(p)}
  for(const w of waiting){w.g.position.y=Math.abs(Math.sin(t*3+w.bob))*0.04;w.g.rotation.y=Math.sin(t*0.7+w.bob)*0.25;idle(w,t);bubble(w)}
  for(const w of rejected){walkAnim(w,t,1);bubble(w)}
  // camera
  let sx=0,sy=0;if(shake>0){sx=rand(-.06,.06)*Math.min(1,shake);sy=rand(-.06,.06)*Math.min(1,shake)}if(cur.mode==='moving')sy+=Math.sin(t*30)*0.004;
  camera.position.set(CAM.x+sx,CAM.y+sy,CAM.z);camera.lookAt(0,1.45,-1);
  drawInd();$('dnum').textContent=cur.floor;$('arrow').textContent=cur.mode==='moving'?(cur.dir>0?'▲':'▼'):'';
  renderer.render(scene,camera);
}
function idle(p,t){const bl=((t+p.bob)%3.5)<0.12;p.eyes.forEach(e=>e.scale.y=bl?0.15:1);if(p.head)p.head.rotation.z=Math.sin(t*1.3+p.bob)*0.08;if(p.ears&&p.ears.length)p.ears.forEach((e,i)=>e.rotation.x=Math.sin(t*2+i+p.bob)*0.1);if(p.tail&&p.tail.rotation)p.tail.rotation.y=Math.sin(t*3+p.bob)*0.4;if(p.tent)p.tent.forEach((q,i)=>q.rotation.x=Math.sin(t*3+i)*0.2);if(p.trunk)p.trunk.rotation.x=-0.3+Math.sin(t*2)*0.2}
// tap animals to make them talk
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect();const mx=((e.clientX-r.left)/r.width)*2-1,my=-((e.clientY-r.top)/r.height)*2+1;
  const ray=new THREE.Raycaster();ray.setFromCamera({x:mx,y:my},camera);
  const all=[...pax.filter(p=>p.st==='in'),...waiting];let best=null,bd=1e9;
  for(const p of all){const hits=ray.intersectObject(p.g,true);if(hits.length&&hits[0].distance<bd){bd=hits[0].distance;best=p}}
  if(best){best.say=pick(AN[best.k].l);best.sayT=1.8;best.jump=0.5;voiceOf(best.k)}});

let last=performance.now();
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;if($('title').hidden)update(dt);else{clock+=dt}render(now);requestAnimationFrame(frame)}
resize();
cur.ev=EV[0];cur.evS={t:0};newWorld();EV[0].build(cur.evS);PARENT=scene;
$('loading').hidden=true;
requestAnimationFrame(frame);
})();

</script>
