<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ゲームのへや">
<meta name="theme-color" content="#f3e3c7">
<title>ゲームのへや</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
:root{--bg:#f3e3c7;--ink:#3a2618;--card:#fffaf0;--accent:#ffcc33;--red:#ff4f4f;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--font);
  padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left))}
h1{margin:8px 0 24px;text-align:center;font-size:clamp(30px,8vw,48px);font-weight:800;color:var(--red);
  -webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.list{display:grid;gap:16px;max-width:520px;margin:0 auto}
a.game{display:flex;align-items:center;gap:16px;padding:16px;background:var(--card);border:4px solid var(--ink);border-radius:24px;
  box-shadow:0 6px 0 var(--ink);color:inherit;text-decoration:none}
a.game:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
a.game:focus-visible{outline:4px solid #2b7bff;outline-offset:3px}
.icon{flex:none;width:72px;height:72px;border-radius:18px;border:3px solid var(--ink);background:var(--accent);position:relative}
.icon::before{content:"";position:absolute;left:14px;top:22px;width:44px;height:38px;border-radius:50% 50% 46% 46%;background:#26262c}
.icon::after{content:"";position:absolute;left:46px;top:42px;width:20px;height:20px;border-radius:50%;border:3px solid var(--ink);
  background:linear-gradient(var(--red) 0 40%,#fff 40% 60%,var(--red) 60%)}
.fanicon{background:#3fb6ff}
.fanicon::before{left:12px;top:12px;width:48px;height:48px;border-radius:50%;background:#fff;border:3px solid #24324a}
.fanicon::after{left:30px;top:16px;width:12px;height:40px;border-radius:50%;border:0;background:#3fb6ff;box-shadow:none}
.acicon{background:#f4f1ea}
.acicon::before{left:8px;top:14px;width:52px;height:24px;border-radius:6px;background:#fff;border:3px solid #24324a}
.acicon::after{left:14px;top:44px;width:40px;height:16px;border-radius:0;border:0;background:repeating-linear-gradient(90deg,#78c8ff 0 4px,transparent 4px 10px);box-shadow:none}
.elicon{background:#ff9a2a}
.elicon::before{left:12px;top:10px;width:48px;height:52px;border-radius:6px;background:linear-gradient(90deg,#e8ecef 0 48%,#7a838b 48% 52%,#e8ecef 52%);border:3px solid #2a2430}
.elicon::after{left:28px;top:-2px;width:16px;height:10px;border-radius:2px;border:0;background:#120f0c;box-shadow:none}
.name{font-size:24px;font-weight:800;margin:0}
.desc{margin:4px 0 0;font-size:15px;line-height:1.5}
</style>
</head>
<body>
<h1>ゲームのへや</h1>
<div class="list">
  <a class="game" href="neko/">
    <span class="icon" aria-hidden="true"></span>
    <span><p class="name">ねこから にげろ！</p><p class="desc">ボールになって 3びきの ねこと おにごっこ</p></span>
  </a>
  <a class="game" href="fan/">
    <span class="icon fanicon" aria-hidden="true"></span>
    <span><p class="name">ふきとばせ！せんぷうき</p><p class="desc">せんぷうきを パワーアップして いえの なかを ぜんぶ ふきとばそう</p></span>
  </a>
  <a class="game" href="aircon/">
    <span class="icon acicon" aria-hidden="true"></span>
    <span><p class="name">エアコン リモコン ごっこ</p><p class="desc">エアコン・ストーブ・せんぷうき・サーキュレーターを うごかそう</p></span>
  </a>
  <a class="game" href="elevator/">
    <span class="icon elicon" aria-hidden="true"></span>
    <span><p class="name">エレベーター ごっこ</p><p class="desc">ボタンを おして いろんな かいへ！ ドアの むこうに なにが いるかな？</p></span>
  </a>
</div>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body>
</html>
