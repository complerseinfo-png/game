<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ひらひらパーク">
<meta name="theme-color" content="#8fd0ff">
<title>ひらひらパーク</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
:root{--ink:#2a2430;--font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#8fd0ff;font-family:var(--font);color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
[hidden]{display:none!important}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none}
#hud>*{pointer-events:auto}
.pill{position:absolute;font:800 15px var(--font);padding:6px 12px;border-radius:999px;border:3px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
#mute{top:10px;left:10px}#full{top:10px;left:100px}
#map{cursor:pointer;position:absolute;top:10px;right:10px;width:min(30vw,230px);border:4px solid var(--ink);border-radius:14px;background:#cde9a0;box-shadow:0 4px 0 var(--ink)}
#toast{position:absolute;left:50%;top:16%;transform:translateX(-50%);font:800 clamp(20px,4vw,38px) var(--font);color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink);white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none}
#area{position:absolute;left:50%;top:10px;transform:translateX(-50%);font:800 18px var(--font);background:rgba(255,255,255,.9);border:3px solid var(--ink);border-radius:999px;padding:4px 16px;pointer-events:none;white-space:nowrap}
#act{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);font:800 clamp(22px,4.5vw,36px) var(--font);padding:12px 34px;border-radius:999px;border:5px solid var(--ink);background:#ffcc33;color:var(--ink);box-shadow:0 6px 0 var(--ink);cursor:pointer;white-space:nowrap}
#act:active{transform:translateX(-50%) translateY(4px);box-shadow:0 2px 0 var(--ink)}
#steer{position:absolute;left:0;right:0;bottom:90px;display:flex;justify-content:space-between;padding:0 16px;pointer-events:none}.sb{pointer-events:auto;width:clamp(90px,16vw,140px);height:clamp(90px,16vw,140px);border-radius:50%;border:5px solid var(--ink);background:rgba(255,255,255,.85);font:800 48px var(--font);color:var(--ink);box-shadow:0 5px 0 var(--ink)}.sb:active{background:#ffcc33}
#ridebar{position:absolute;right:12px;bottom:12px;display:flex;gap:10px}
.rb{font:800 18px var(--font);padding:10px 18px;border-radius:999px;border:4px solid var(--ink);background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--ink);cursor:pointer}
#rot{position:absolute;right:12px;bottom:12px;display:flex;gap:10px}#rot .rb{font-size:28px;width:64px;height:64px;padding:0}
#joy{position:absolute;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;background:rgba(255,255,255,.35);border:4px solid rgba(42,36,48,.5);pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:#fff;border:4px solid var(--ink)}
#hint{position:absolute;left:14px;bottom:14px;font:800 15px var(--font);background:rgba(255,255,255,.85);border:3px solid var(--ink);border-radius:14px;padding:6px 10px;pointer-events:none}
.ov{position:fixed;inset:0;display:grid;place-items:center;background:rgba(20,40,60,.55);z-index:20;padding:16px}
.card{background:#fffaf0;border:5px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:22px 26px;max-width:560px;width:100%;text-align:center}
.card h1{margin:0 0 6px;font-size:clamp(36px,9vw,60px);color:#ff5a8a;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.card p{margin:6px 0;font-size:18px}
.big{font:800 30px var(--font);padding:12px 48px;border-radius:999px;border:4px solid var(--ink);background:#ffcc33;color:var(--ink);box-shadow:0 6px 0 var(--ink);cursor:pointer;margin-top:12px}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#8fd0ff;font:800 28px var(--font);z-index:30}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <button class="pill" id="mute">おと ON</button><button class="pill" id="full">ぜんがめん</button>
  <canvas id="map" width="460" height="342"></canvas>
  <div id="area">メインゲート</div>
  <div id="toast"></div>
  <button id="act" hidden>のる！</button>
  <div id="steer" hidden><button class="sb" id="steerL" aria-label="ひだり">◀</button><button class="sb" id="steerR" aria-label="みぎ">▶</button></div>
  <div id="ridebar" hidden><button class="rb" id="viewBtn">そとから みる</button><button class="rb" id="exitBtn">おりる</button></div>
  <div id="joy" hidden><div id="knob"></div></div>
  <div id="hint">スワイプした ほうへ はしるよ！ タッチで とまる</div>
  <div id="rot"><button class="rb" id="rotL" aria-label="ひだりに まわす">⟲</button><button class="rb" id="rotR" aria-label="みぎに まわす">⟳</button></div>
</div>
<div class="ov" id="title"><div class="card"><h1>ひらひらパーク</h1><p>ゆうえんちを あるいて のりものに のろう！</p><p>スワイプした ほうへ はしるよ！ タッチで とまる</p><p>ぜんぶで 21この のりものに のれるよ！</p><button class="big" id="startBtn">あそぶ！</button></div></div>
<div id="loading">よみこみちゅう…</div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const FONT='"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif';

// ================= sound =================
let ac=null,master=null,muted=false;
function audio(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=0.5;master.connect(ac.destination)}catch(e){return null}}if(ac.state==='suspended')ac.resume();return ac}
function tone(f,d,type='sine',vol=.08,slide=0,delay=0){if(muted||!audio())return;const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(master);o.start(t);o.stop(t+d+.05)}
function noise(d,vol=.1,f=1000,q=1,delay=0,type='bandpass',fEnd=0){if(muted||!audio())return;const t=ac.currentTime+delay,n=Math.floor(ac.sampleRate*d),b=ac.createBuffer(1,n,ac.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=Math.random()*2-1;
  const s=ac.createBufferSource();s.buffer=b;const fl=ac.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t);if(fEnd)fl.frequency.exponentialRampToValueAtTime(fEnd,t+d);fl.Q.value=q;const g=ac.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl).connect(g).connect(master);s.start(t)}
let wind=null;
function windOn(v){if(!audio())return;if(!wind){const n=ac.sampleRate*2,b=ac.createBuffer(1,n,ac.sampleRate),c=b.getChannelData(0);let l=0;for(let i=0;i<n;i++){l=l*0.97+(Math.random()*2-1)*0.03;c[i]=l*6}const s=ac.createBufferSource();s.buffer=b;s.loop=true;const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=500;f.Q.value=0.6;wind=ac.createGain();wind.gain.value=0;s.connect(f).connect(wind).connect(master);s.start()}wind.gain.setTargetAtTime(muted?0:v,ac.currentTime,0.4)}
// cheerful park music (simple loop)
const N={C4:262,D4:294,E4:330,F4:349,G4:392,A4:440,B4:494,C5:523,D5:587,E5:659,F5:698,G5:784,A5:880};
const TUNE=[N.C5,N.E5,N.G5,N.E5,N.F5,N.A5,N.G5,0,N.E5,N.D5,N.C5,N.D5,N.E5,N.C5,N.D5,0,N.C5,N.E5,N.G5,N.E5,N.F5,N.A5,N.G5,0,N.F5,N.E5,N.D5,N.G4,N.C5,0,0,0];
const BASS=[N.C4,N.G4,N.F4,N.G4];
let musicT=0,musicI=0,musicVol=0.035;
function music(){}
function chime(){[N.C5,N.E5,N.G5,N.C5*2].forEach((f,i)=>tone(f,.4,'sine',.07,0,i*.12))}

// ================= three basics =================
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
let quality=Math.min(1.5,window.devicePixelRatio||1);renderer.setPixelRatio(quality);
const scene=new THREE.Scene();
const SKY=0x9fd8ff;scene.background=new THREE.Color(SKY);scene.fog=new THREE.Fog(SKY,95,290);
const camera=new THREE.PerspectiveCamera(60,1,0.05,600);
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.fov=camera.aspect<1?75:60;camera.updateProjectionMatrix()}
addEventListener('resize',resize);
const hemi=new THREE.HemisphereLight(0xffffff,0x6a8a4a,0.72);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff4e0,0.5);sun.position.set(-40,80,30);scene.add(sun);
const lam=c=>new THREE.MeshLambertMaterial({color:c});
const phong=(c,s=60)=>new THREE.MeshPhongMaterial({color:c,shininess:s});
const flat=c=>new THREE.MeshPhongMaterial({color:c,flatShading:true,shininess:5});
const basic=c=>new THREE.MeshBasicMaterial({color:c});
let PARENT=scene;
function mesh(geo,mat,x=0,y=0,z=0,parent){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);(parent||PARENT).add(m);return m}
function ctex(w,h,draw,rx=1,ry=1){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);return t}
const SPH=new THREE.SphereGeometry(1,16,12);
function ball(r,mat,x,y,z,p,sx=1,sy=1,sz=1){const m=mesh(SPH,mat,x,y,z,p);m.scale.set(r*sx,r*sy,r*sz);return m}
function cyl(rt,rb,h,mat,x,y,z,p,seg=12){return mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat,x,y,z,p)}
function boxm(w,h,d,mat,x,y,z,p){return mesh(new THREE.BoxGeometry(w,h,d),mat,x,y,z,p)}
function cone(r,h,mat,x,y,z,p,seg=12){return mesh(new THREE.ConeGeometry(r,h,seg),mat,x,y,z,p)}
function grp(x=0,y=0,z=0,p){const g=new THREE.Group();g.position.set(x,y,z);(p||PARENT).add(g);return g}
function signTex(text,bg='#3fa9f5',fg='#fff'){const t=ctex(512,128,(g,W,H)=>{g.fillStyle=bg;g.beginPath();g.roundRect?g.roundRect(4,4,W-8,H-8,40):g.rect(4,4,W-8,H-8);g.fill();g.fillStyle=fg;g.font=`800 ${text.length>8?54:68}px ${FONT}`;g.textAlign='center';g.textBaseline='middle';g.fillText(text,W/2,H/2+4)});t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping;t.repeat.set(1,1);return t}
function board(text,x,y,z,w=6,bg,rotY=0,p){const m=mesh(new THREE.PlaneGeometry(w,w/4),new THREE.MeshBasicMaterial({map:signTex(text,bg),side:THREE.DoubleSide}),x,y,z,p);m.rotation.y=rotY;return m}
const SIGNS=[];function floatSign(text,x,y,z,bg='#ff5a8a',w=7){w*=0.8;const s=new THREE.Sprite(new THREE.SpriteMaterial({map:signTex(text,bg),fog:false}));s.scale.set(w,w/4,1);s.position.set(x,y,z);scene.add(s);SIGNS.push(s);return s}

// ================= map coordinates (from the park map picture 1880 x 1400) =================
const K=0.16;
const W=(x,y)=>[(x-940)*K,(y-700)*K];
const GW=1880*K,GD=1400*K;
function beam(a,b,r,mat,p){const d=new THREE.Vector3().subVectors(b,a);const L=d.length();const m=cyl(r,r,L,mat,(a.x+b.x)/2,(a.y+b.y)/2,(a.z+b.z)/2,p,8);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());return m}
// ================= animals (chibi 3D) =================
const patTex={};
function pattern(kind,base,ink){const key=kind+base+ink;if(patTex[key])return patTex[key];
  const t=ctex(128,128,(g,w,h)=>{g.fillStyle='#'+base.toString(16).padStart(6,'0');g.fillRect(0,0,w,h);g.fillStyle='#'+ink.toString(16).padStart(6,'0');
    if(kind==='stripes'||kind==='zebra'){for(let i=0;i<8;i++){g.beginPath();g.moveTo(i*16,0);g.quadraticCurveTo(i*16+10,64,i*16,128);g.lineTo(i*16+(kind==='zebra'?8:6),128);g.quadraticCurveTo(i*16+16,64,i*16+(kind==='zebra'?8:6),0);g.fill()}}
    else if(kind==='spots'){for(let i=0;i<9;i++){g.beginPath();g.ellipse((i*47)%128,(i*71)%128,14,11,i,0,7);g.fill()}}
    else if(kind==='giraffe'){g.strokeStyle='#fff3d0';for(let i=0;i<10;i++){g.beginPath();const x=(i*41)%128,y=(i*67)%128;g.moveTo(x,y);for(let k=0;k<6;k++){const a=k*1.05;g.lineTo(x+Math.cos(a)*16,y+Math.sin(a)*16)}g.closePath();g.fill()}}
  });patTex[key]=t;return t}
function matFor(c,pat,ink,fluffy){if(pat&&ink!==undefined)return new THREE.MeshLambertMaterial({map:pattern(pat,c,ink)});return fluffy?flat(c):lam(c)}
// d: {c,belly,ear,earC,snout,snoutC,pat,ink,mane,horn,tail,tailC,s,fluffy,cap,neck,cheek,special}
function animal(d){
  const g=new THREE.Group(),S=d.s||1;const P={g,legs:[],arms:[],eyes:[],d};
  const root=new THREE.Group();g.add(root);root.scale.setScalar(S);P.root=root;
  const shadow=mesh(new THREE.CircleGeometry(0.45,20),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.2,depthWrite:false}),0,0.01,0,g);shadow.rotation.x=-Math.PI/2;shadow.scale.setScalar(S);
  if(d.special){d.special(P,root);P.h=(d.h||1.6)*S;return P}
  const M=matFor(d.c,d.pat,d.ink,d.fluffy),B=lam(d.belly??d.c),dark=lam(0x2a2226);
  const body=new THREE.Group();root.add(body);P.body=body;
  // legs
  for(const s of[-1,1]){const piv=new THREE.Group();piv.position.set(s*0.17,0.36,0);body.add(piv);cyl(0.11,0.12,0.32,d.legC?lam(d.legC):M,0,-0.18,0,piv);ball(0.13,d.footC?lam(d.footC):(d.legC?lam(d.legC):M),0,-0.32,0.05,piv,1,0.6,1.3);P.legs.push(piv)}
  // torso + belly
  ball(0.38,M,0,0.66,0,body,1,1.08,0.9);ball(0.27,B,0,0.62,0.16,body,1,1.1,0.7);
  // arms
  for(const s of[-1,1]){const piv=new THREE.Group();piv.position.set(s*0.34,0.86,0);body.add(piv);const a=cyl(0.085,0.09,0.36,d.armC?lam(d.armC):M,0,-0.16,0,piv);ball(0.1,d.armC?lam(d.armC):M,0,-0.34,0,piv);piv.rotation.z=s*0.25;P.arms.push(piv)}
  // tail
  const tc=lam(d.tailC??d.c);
  if(d.tail==='long'){const t=new THREE.Group();t.position.set(0,0.5,-0.32);body.add(t);for(let i=0;i<5;i++)ball(0.07,d.pat?M:tc,0,i*0.13,-i*0.06-0.03,t);t.rotation.x=-0.6;P.tail=t}
  else if(d.tail==='fluffy'){const t=ball(0.22,tc,0,0.62,-0.4,body,0.8,1.5,0.8);t.rotation.x=0.5;P.tail=t}
  else if(d.tail==='pom')ball(0.12,tc,0,0.5,-0.36,body);
  else if(d.tail==='curl'){const t=mesh(new THREE.TorusGeometry(0.08,0.03,6,12),tc,0,0.55,-0.38,body)}
  else if(d.tail==='tuft'){const t=new THREE.Group();t.position.set(0,0.5,-0.33);body.add(t);cyl(0.03,0.03,0.4,tc,0,0.15,-0.1,t).rotation.x=-0.6;ball(0.08,lam(d.tuftC||0x5a3a22),0,0.32,-0.22,t);P.tail=t}
  else if(d.tail==='flat'){const t=boxm(0.3,0.06,0.4,tc,0,0.3,-0.45,body);t.rotation.x=-0.3}
  else if(d.tail==='horse'){const t=ball(0.1,lam(d.maneC||d.c),0,0.6,-0.4,body,1,2.5,1);t.rotation.x=0.6}
  // head
  const head=new THREE.Group();head.position.set(0,1.18+(d.neck||0),0);body.add(head);P.head=head;
  if(d.neck){cyl(0.12,0.16,d.neck+0.2,M,0,0.95+d.neck/2,0,body)}
  const hs=d.headS||1;const hm=d.capC!==undefined?lam(d.c):M;
  ball(0.44*hs,hm,0,0,0,head,d.headW||1,0.92,0.92);
  if(d.capC!==undefined){const cp=ball(0.452*hs,lam(d.capC),0,0.06,-0.02,head,d.headW||1,0.8,0.92);}
  // face patches
  if(d.pat==='panda'){for(const s of[-1,1]){const p=ball(0.1,dark,s*0.16,0.03,0.36,head,1,1.3,0.5);p.rotation.z=s*0.5}}
  if(d.mask){for(const s of[-1,1]){const p=ball(0.13,lam(d.mask),s*0.15,0.04,0.33,head,1.2,0.8,0.5)}}
  if(d.face)ball(0.3,lam(d.face),0,-0.05,0.2,head,1,0.85,0.7);
  // eyes
  for(const s of[-1,1]){const e=new THREE.Group();e.position.set(s*0.16*(d.eyeW||1),0.05+(d.eyeY||0),0.38*hs);head.add(e);ball(d.eyeR||0.06,dark,0,0,0,e,1,1.15,0.7);ball(0.02,lam(0xffffff),0.015,0.025,0.035,e);P.eyes.push(e)}
  if(d.cheek!==false)for(const s of[-1,1])ball(0.06,lam(0xffa0b4),s*0.27,-0.1,0.31*hs,head,1,0.6,0.4);
  // snout
  const sc=lam(d.snoutC??0xfff3e6);
  if(d.snout==='muzzle'){ball(0.16,sc,0,-0.1,0.33*hs,head,1.2,0.85,0.8);ball(0.05,dark,0,-0.04,0.46*hs,head,1.2,0.8,0.8)}
  else if(d.snout==='long'){ball(0.16,sc,0,-0.08,0.4*hs,head,0.9,0.75,1.3);ball(0.05,dark,0,-0.02,0.6*hs,head)}
  else if(d.snout==='pig'){cyl(0.12,0.13,0.1,lam(d.snoutC??0xffb0c0),0,-0.08,0.42*hs,head,14).rotation.x=Math.PI/2;for(const s of[-1,1])ball(0.025,dark,s*0.045,-0.08,0.48*hs,head)}
  else if(d.snout==='beak'){cone(0.07,0.18,lam(d.snoutC??0xffa020),0,-0.06,0.47*hs,head).rotation.x=Math.PI/2}
  else if(d.snout==='duck'){const b=ball(0.12,lam(0xffa020),0,-0.08,0.42*hs,head,1.2,0.4,1)}
  else if(d.snout==='trunk'){const t=new THREE.Group();t.position.set(0,-0.08,0.38*hs);head.add(t);for(let i=0;i<5;i++)ball(0.1-i*0.01,M,0,-i*0.09,0.05+i*0.03,t);t.rotation.x=-0.3;P.trunk=t}
  else if(d.snout==='hippo'){ball(0.26,M,0,-0.12,0.3,head,1.2,0.8,0.9);for(const s of[-1,1])ball(0.035,dark,s*0.09,-0.02,0.53,head)}
  else if(d.snout==='nose'){ball(0.08,dark,0,-0.06,0.44*hs,head,1.3,1,0.8)}
  else ball(0.035,lam(d.noseC??0xff8aa0),0,-0.05,0.43*hs,head);
  if(d.snout!=='beak'&&d.snout!=='duck'&&d.mouth!==false){const m=mesh(new THREE.TorusGeometry(0.04,0.01,4,10,Math.PI),dark,0,-0.15,0.42*hs,head);m.rotation.z=Math.PI}

  for(const[o,h]of[[0,1.5],[0,0.4],[0.8,1.0],[-0.8,1.0]]){

    for(const dir of[0,1]){if(dir){_a.copy(_b);_d.subVectors(cam,_b).normalize()}else{_a.copy(cam);_d.subVectors(_b,cam).normalize()}
      fadeRay.set(_a,_d);fadeRay.far=dist-0.7;fadeRay.near=dir?0.7:0;
      for(const q of fadeRay.intersectObjects(scene.children,true)){const ob=q.object;if(ob.isSprite||ob.isPoints||ob.userData.noFade||!ob.visible)continue;
        if(ob.isInstancedMesh){if(q.instanceId!==undefined)hitI.add(ob.uuid+':'+q.instanceId+':'+ob.id);ob.userData._m=ob;continue}
        if(Array.isArray(ob.material))continue;hit.add(ob)}}}
  restoreFade(hit,hitI);
  for(const ob of hit)if(!faded.has(ob)){const orig=ob.material;const m=orig.clone();m.transparent=true;m.opacity=0.22;m.depthWrite=false;ob.material=m;faded.set(ob,orig)}
  for(const key of hitI)if(!hiddenInst.has(key)){const[uuid,id]=key.split(':');const ob=instByUuid(uuid);if(!ob)continue;const m=new THREE.Matrix4();ob.getMatrixAt(+id,m);hiddenInst.set(key,{ob,id:+id,m});ob.setMatrixAt(+id,_zero);ob.instanceMatrix.needsUpdate=true}
}
const instCache={};function instByUuid(u){if(instCache[u])return instCache[u];scene.traverse(n=>{if(n.isInstancedMesh)instCache[n.uuid]=n});return instCache[u]}
function restoreFade(keep,keepI){for(const[ob,orig]of faded)if(!keep.has(ob)){ob.material.dispose();ob.material=orig;faded.delete(ob)}
  for(const[key,v]of hiddenInst)if(!keepI.has(key)){v.ob.setMatrixAt(v.id,v.m);v.ob.instanceMatrix.needsUpdate=true;hiddenInst.delete(key)}}

// ================= loop =================
let last=performance.now(),started=false,frames=0,fpsT=0;
function frame(now){const dt=Math.max(0,Math.min(0.05,(now-last)/1000));last=now;const t=now/1000;
  for(const f of ANIM)f(dt,t);
  outTrain.position.set(0,0,0);{const u=(t*0.04)%2,k=u<1?u:2-u;const[ax,az]=W(1840,250),[bx,bz]=W(1250,1400);outTrain.position.set(ax+(bx-ax)*k+3,0,az+(bz-az)*k);outTrain.rotation.y=Math.atan2(bx-ax,bz-az)}
  updateGuests(dt,t);
  if(started){if(mode==='walk')updateWalk(dt,t);else if(ride)updateRide(dt,t)}
  updateCamera(dt,t);updateFade();
  if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').style.opacity=0}
  if(Math.floor(t*4)!==Math.floor((t-dt)*4))drawMap();
  renderer.render(scene,camera);
  // adaptive quality for slower tablets
  frames++;fpsT+=dt;if(fpsT>3){const fps=frames/fpsT;if(fps<28&&quality>0.7){quality=Math.max(0.7,quality-0.25);renderer.setPixelRatio(quality);resize()}frames=0;fpsT=0}
  requestAnimationFrame(frame)}
function goFull(){const el=document.documentElement,f=el.requestFullscreen||el.webkitRequestFullscreen;if(!f||document.fullscreenElement||document.webkitFullscreenElement)return;try{const r=f.call(el,{navigationUI:'hide'});if(r&&r.catch)r.catch(()=>{})}catch(e){}}
$('full').onclick=()=>{if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document);else goFull()};
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'おと OFF':'おと ON';windOn(0)};
$('startBtn').onclick=()=>{audio();goFull();$('title').hidden=true;started=true;chime();toast('ようこそ ひらひらパークへ！',2.5)};
resize();camYaw=B.head+Math.PI;camera.position.set(B.x+Math.sin(camYaw)*9,5,B.z+Math.cos(camYaw)*9);
boy.g.position.set(B.x,0,B.z);boy.g.rotation.y=B.head;
$('loading').hidden=true;requestAnimationFrame(frame);
})();
</script>
