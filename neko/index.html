<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>ねこから にげろ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: full-screen 3D room, HTML overlays for HUD, swipe trail and menus. Single warm "living room" look on purpose. */
:root{
  --wall:#f3e3c7; --wood:#c98d52; --ink:#3a2618; --paper:#fffaf0; --ball:#ff4f4f; --accent:#ffcc33;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--wall);color:var(--ink);font-family:var(--font)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-tap-highlight-color:transparent}
.hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));
  pointer-events:none;font-weight:800}
.pill{background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:4px 14px;font-size:clamp(15px,4vw,20px);
  font-variant-numeric:tabular-nums;box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.time{font-size:clamp(22px,6vw,32px);padding:2px 18px}
.left{display:grid;gap:6px;justify-items:start}
.hearts{color:#ff4f4f;letter-spacing:2px;font-size:clamp(16px,4.4vw,22px);padding:0 12px}
.modes{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.mode{font:inherit;font-weight:800;font-size:15px;padding:6px 14px;border:3px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink);cursor:pointer}
.mode.sel{background:#ffd9e0}
.mode:focus-visible{outline:4px solid #2b7bff;outline-offset:2px}
.mid{display:grid;gap:6px;justify-items:center;min-width:0}
.goal{font-size:clamp(12px,3.4vw,15px);padding:2px 12px}
.goal.open{background:#ffcc33;animation:pulse .6s ease-in-out infinite alternate}
.item{font-size:clamp(12px,3.4vw,15px);padding:2px 12px;background:#ffe2c4}
@keyframes pulse{to{transform:scale(1.08)}}
.mute{pointer-events:auto;font:inherit;cursor:pointer;color:var(--ink)}
#trail{position:fixed;height:10px;margin-top:-5px;border-radius:5px;background:rgba(255,255,255,.85);transform-origin:0 50%;
  pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:0 0 0 3px rgba(58,38,24,.35)}
.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px));background:rgba(58,38,24,.3);overflow:auto}
.card{background:var(--paper);border:4px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);
  padding:24px 22px;max-width:440px;width:100%;text-align:center;display:grid;gap:12px}
.card h1{margin:0;font-size:clamp(28px,8vw,48px);line-height:1.1;font-weight:800;color:var(--ball);
  -webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);text-wrap:balance}
.card p{margin:0;font-size:16px;line-height:1.6;font-weight:500}
.cats{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.cat{display:grid;gap:4px;justify-items:center;font-size:13px;font-weight:800;max-width:90px}
.face{width:48px;height:42px;border-radius:50% 50% 46% 46%;border:3px solid var(--ink);position:relative}
.face::before,.face::after{content:"";position:absolute;top:-12px;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:16px solid var(--ear)}
.face::before{left:2px}.face::after{right:2px}
.face i{position:absolute;top:15px;width:8px;height:10px;border-radius:50%;background:var(--eye)}
.face i:first-child{left:10px}.face i:last-child{right:10px}
.f1{background:#26262c;--ear:#26262c;--eye:#f5d742}
.f2{background:#8b5a2b;--ear:#8b5a2b;--eye:#7dc95e;box-shadow:0 0 0 5px #a87444}
.f3{background:linear-gradient(#222 0 40%,#fff 40%);--ear:#222;--eye:#e8b33a}
.big{font-size:clamp(28px,8vw,40px);font-weight:800;font-variant-numeric:tabular-nums}
.btn{font:inherit;font-weight:800;font-size:24px;background:var(--accent);color:var(--ink);border:4px solid var(--ink);
  border-radius:999px;padding:12px 24px;box-shadow:0 6px 0 var(--ink);cursor:pointer;justify-self:center;min-width:220px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.btn:focus-visible,.mute:focus-visible{outline:4px solid #2b7bff;outline-offset:3px}
.small{font-size:13px!important;opacity:.85}
.new{color:var(--ball);font-weight:800}
#toast{position:fixed;left:50%;top:28%;transform:translate(-50%,-50%);font-weight:800;font-size:clamp(26px,8vw,44px);color:#fff;
  -webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);pointer-events:none;white-space:nowrap;transition:opacity .3s}
.mk{position:fixed;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:3px solid var(--ink);pointer-events:none;box-shadow:0 2px 0 var(--ink)}
.mkd{background:#ffcc33;border-radius:6px}
.mk1{background:#26262c}.mk2{background:#8b5a2b}.mk3{background:linear-gradient(#222 0 45%,#fff 45%)}
.loading{background:var(--wall);align-content:center;justify-items:center;gap:18px}
.track{position:relative;width:min(320px,80vw);height:90px;border-bottom:6px solid var(--wood);overflow:hidden}
.lball{position:absolute;bottom:0;width:36px;height:36px;border-radius:50%;border:3px solid var(--ink);
  background:linear-gradient(var(--ball) 0 40%,#fff 40% 60%,var(--ball) 60%);animation:roll 2.4s linear infinite}
.lcat{position:absolute;bottom:2px;animation:chase 2.4s linear infinite}
.lcat .face{width:44px;height:38px}
@keyframes roll{from{left:-60px;transform:rotate(0)}to{left:110%;transform:rotate(1080deg)}}
@keyframes chase{from{left:-150px}to{left:calc(110% - 90px)}}
.ltext{font-weight:800;font-size:22px;color:var(--ink)}
.ltext i{display:inline-block;animation:hop 1s ease-in-out infinite;font-style:normal}
.ltext i:nth-child(2){animation-delay:.15s}.ltext i:nth-child(3){animation-delay:.3s}
@keyframes hop{0%,100%{transform:none}50%{transform:translateY(-6px)}}
.ltitle{margin:0;font-size:clamp(30px,9vw,44px);font-weight:800;color:var(--ball);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
@media (prefers-reduced-motion:reduce){.lball,.lcat,.ltext i{animation:none}.lball{left:60%}.lcat{left:20%}}
.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stg{font:inherit;display:grid;justify-items:center;gap:4px;padding:8px 4px;border:3px solid var(--ink);border-radius:16px;background:#fff;
  color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--ink);min-width:0}
.stg b{font-size:clamp(13px,3.8vw,17px)}
.stg small{font-size:11px;opacity:.8;min-height:1.4em}
.stg.sel{background:var(--accent);transform:translateY(-3px)}
.stg:focus-visible{outline:4px solid #2b7bff;outline-offset:2px}
.thumb{width:100%;max-width:90px;aspect-ratio:4/3;border-radius:10px;border:2px solid var(--ink);position:relative;overflow:hidden}
.th0{background:linear-gradient(#f3e3c7 0 55%,#c98d52 55%)}
.th0::after{content:"";position:absolute;left:12%;bottom:30%;width:50%;height:28%;background:#5f8f6f;border-radius:4px}
.th1{background:linear-gradient(#dcefe6 0 55%,#b9d3dc 55%)}
.th1::after{content:"";position:absolute;right:10%;bottom:20%;width:28%;height:70%;background:#f4f7f9;border:2px solid #9aa;border-radius:3px}
.th2{background:linear-gradient(#dbe7f5 0 55%,#cdb3c4 55%)}
.th2::after{content:"";position:absolute;left:10%;bottom:25%;width:60%;height:30%;background:#fff;border-top:6px solid #f3a5b5;border-radius:4px}
.btn2{background:#fff;font-size:18px;padding:8px 18px}
[hidden]{display:none!important}
</style>
</head>
<body>

<canvas id="c" aria-label="ゲーム画面"></canvas>
<div class="hud">
  <div class="left"><div class="pill" id="bonk">ころばせた 0</div><div class="pill hearts" id="hearts">♥♥♥</div></div>
  <div class="mid"><div class="pill time" id="time">0.0</div><div class="pill goal" id="goal">1. リビング</div><div class="pill item" id="item" hidden>ちゅ〜る：タップで おく</div></div>
  <button class="pill mute" id="mute">おと ON</button>
</div>
<div id="trail"></div>
<div id="marks"><i class="mk mk1" hidden></i><i class="mk mk2" hidden></i><i class="mk mk3" hidden></i><i class="mk mkd" id="mkd" hidden></i></div>
<div id="toast" style="opacity:0"></div>

<div class="overlay loading" id="loading">
  <p class="ltitle">ねこから にげろ！</p>
  <div class="track" aria-hidden="true">
    <div class="lball"></div>
    <div class="lcat"><div class="face f1"><i></i><i></i></div></div>
  </div>
  <div class="ltext" id="ltext">よみこみちゅう<i>.</i><i>.</i><i>.</i></div>
</div>

<div class="overlay" id="menu" hidden>
  <div class="card">
    <h1>ねこから<br>にげろ！</h1>
    <div class="stages" id="stages">
      <button class="stg" data-i="1"><span class="thumb th1"></span><b>キッチン</b><small id="rec1"></small></button>
      <button class="stg" data-i="0"><span class="thumb th0"></span><b>リビング</b><small id="rec0"></small></button>
      <button class="stg" data-i="2"><span class="thumb th2"></span><b>しんしつ</b><small id="rec2"></small></button>
    </div>
    <div class="modes">
      <button class="mode" data-lives="3">やさしい <span style="color:#ff4f4f">♥♥♥</span></button>
      <button class="mode" data-lives="1">ふつう <span style="color:#ff4f4f">♥</span></button>
    </div>
    <button class="btn" id="startBtn">スタート</button>
    <div class="cats">
      <div class="cat"><div class="face f1"><i></i><i></i></div>くろねこ<br>ためて ジャンプ</div>
      <div class="cat"><div class="face f2"><i></i><i></i></div>ちゃいろ<br>のそのそ パンチ</div>
      <div class="cat"><div class="face f3"><i></i><i></i></div>しろねこ<br>フリフリ とびかかり</div>
    </div>
    <p><b>スワイプ</b>で かそく、ぎゃくに スワイプで ブレーキ。<br>ねこが <b style="color:#ff4f4f">！</b> を だしたら こうげきの あいず。よけて！<br>30びょう にげると ドアが ひらく。ドアに はいれば クリア！</p>
    <p class="small">ダンボールに かくれる・ちゅ〜るは タップで おく・リモコンで ねこの ばんぐみ<br>パソコンは やじるしキー でも うごかせます</p>
  </div>
</div>

<div class="overlay" id="over" hidden>
  <div class="card">
    <h1 id="overTitle">ねこパンチ！</h1>
    <div class="big" id="finalTime">0.0 びょう</div>
    <p id="finalDetail"></p>
    <p id="bestMsg"></p>
    <button class="btn" id="againBtn">もういちど</button>
    <button class="btn btn2" id="menuBtn">ステージを えらぶ</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);
if(!window.THREE){$('ltext').textContent='よみこめませんでした。もういちど ひらいてね';return;}
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

// ---------- renderer / scene ----------
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xf3e3c7);
const camera=new THREE.PerspectiveCamera(50,1,0.1,200);
function resize(){
  const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);
  camera.aspect=w/h;camera.fov=w<h?72:58;camera.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();

scene.add(new THREE.HemisphereLight(0xfff6e8,0x8a6a4a,0.75));
const sun=new THREE.DirectionalLight(0xfff1d6,0.75);
sun.position.set(7,22,9);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-20,right:20,top:16,bottom:-16,near:1,far:60});
sun.shadow.bias=-0.0008;
scene.add(sun);

const lam=c=>new THREE.MeshLambertMaterial({color:c});
const phongFlat=c=>new THREE.MeshPhongMaterial({color:c,flatShading:true,shininess:5});
let DEF_PARENT=null;
function mesh(geo,mat,x=0,y=0,z=0,parent=null,shadow=true){
  const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);
  if(shadow){m.castShadow=true;m.receiveShadow=true}
  (parent||DEF_PARENT||scene).add(m);return m;
}
function canvasTex(w,h,draw,rx=1,ry=1){
  const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);return t;
}

// ---------- stages (cat scale: 1 unit ≈ 30cm, so furniture is huge) ----------
const W=18,D=13; // room half sizes (same for every stage)
const STEP=0.55;
const STAGE_SECS=30; // survive this long and the door opens
// box: {t:'box',x,z,hx,hz,b,h,solid,platform,bouncy}  circ: {t:'circ',x,z,r,b,h,...}
// b = bottom, h = top. Platforms can be stood on. Low steps (<= STEP) can be walked up.
const obs=[],ramps=[],roofs=[],labels=[],hideBoxes=[],props=[];
let stage=null;
let FAN=null,BTN={x:999,z:999,r:0},TRAMP=null,REMOTE={x:999,z:999,y:-99,cd:0},TV_SPOTS=null,DOOR=null;
let blades=new THREE.Group(),btnTop=new THREE.Object3D(),trampMat=new THREE.Object3D(),doorMat=null,doorLabel=null;
let trampSquash=0,GRIP=1;
const box=(x,z,w,d,h,o={})=>{const b={t:'box',x,z,hx:w/2,hz:d/2,b:o.b||0,h,solid:o.solid!==false,platform:!!o.platform,bouncy:!!o.bouncy};obs.push(b);return b};
const circ=(x,z,r,h,o={})=>{const c={t:'circ',x,z,r,b:o.b||0,h,solid:o.solid!==false,platform:!!o.platform,bouncy:!!o.bouncy};obs.push(c);return c};
function solidBox(x,z,w,d,h,color,o={}){
  const b=o.b||0;box(x,z,w,d,h,o);
  return mesh(new THREE.BoxGeometry(w,h-b,d),lam(color),x,(h+b)/2,z);
}
function fadeWhenUnder(m,x,z,hx,hz,top){const mats=[];m.traverse(n=>{if(n.material){n.material=n.material.clone();n.material.transparent=true;mats.push(n.material)}});roofs.push({x,z,hx,hz,top,mats})}
function group(){const g=new THREE.Group();stage.add(g);return g}
// small things on tables and floors that roll and fly when bumped
function prop(kind,x,z,y=0){
  const g=new THREE.Group();stage.add(g);
  let r=0.3,roll=true,lift=0;
  if(kind==='mikan'){r=0.28;mesh(new THREE.SphereGeometry(r,14,10),lam(0xff9a1f),0,0,0,g).scale.y=0.88;mesh(new THREE.SphereGeometry(0.06,6,5),lam(0x4f9a4a),0,r*0.85,0,g)}
  else if(kind==='apple'){r=0.3;mesh(new THREE.SphereGeometry(r,14,10),lam(0xe8402a),0,0,0,g);mesh(new THREE.CylinderGeometry(0.02,0.02,0.15,5),lam(0x6b4a32),0,r+0.05,0,g)}
  else if(kind==='plush'){r=0.42;mesh(new THREE.SphereGeometry(r,14,10),lam(0xf3a5b5),0,0,0,g);for(const sx of[-1,1])mesh(new THREE.SphereGeometry(0.13,8,6),lam(0xf3a5b5),sx*0.25,0.33,0,g)}
  else if(kind==='mug'){r=0.3;roll=false;lift=0.25;mesh(new THREE.CylinderGeometry(0.26,0.23,0.5,14),lam(pick([0xffffff,0x4f9fb8,0xe9785a])),0,0,0,g);mesh(new THREE.TorusGeometry(0.13,0.04,6,12),lam(0xffffff),0.3,0,0,g)}
  else if(kind==='cup'){r=0.24;roll=false;lift=0.2;mesh(new THREE.CylinderGeometry(0.2,0.15,0.4,12),lam(pick([0xf2c14e,0x7fd0ff])),0,0,0,g)}
  else if(kind==='book'){r=0.4;roll=false;lift=0.09;mesh(new THREE.BoxGeometry(0.75,0.18,0.55),lam(pick([0xe9785a,0x4f9fb8,0xb36ad1,0x6fa07f])),0,0,0,g)}
  else if(kind==='yarn'){r=0.32;const c=pick([0xe9785a,0x7fd0ff,0xb36ad1,0x9dd86f]);mesh(new THREE.SphereGeometry(r,14,10),lam(c),0,0,0,g);for(let i=0;i<3;i++){const t=mesh(new THREE.TorusGeometry(r*0.98,0.025,5,20),lam(0xffffff),0,0,0,g);t.rotation.set(i*1.1,i*0.7,0)}}
  else if(kind==='tennis'){r=0.24;mesh(new THREE.SphereGeometry(r,14,10),lam(0xd8f04a),0,0,0,g);const t=mesh(new THREE.TorusGeometry(r*0.98,0.02,5,20),lam(0xffffff),0,0,0,g);t.rotation.x=1.2}
  else if(kind==='tissue'){r=0.36;roll=false;lift=0.18;mesh(new THREE.BoxGeometry(0.65,0.36,0.42),lam(0x8fd0e8),0,0,0,g);mesh(new THREE.BoxGeometry(0.2,0.14,0.12),lam(0xffffff),0,0.24,0,g)}
  else if(kind==='can'){r=0.2;roll=false;lift=0.23;mesh(new THREE.CylinderGeometry(0.18,0.18,0.46,12),lam(pick([0xe9402a,0x3f8fe0,0xf2c14e])),0,0,0,g)}
  else if(kind==='bottle'){r=0.2;roll=false;lift=0.36;mesh(new THREE.CylinderGeometry(0.16,0.17,0.62,12),new THREE.MeshLambertMaterial({color:0xbfe8ff,transparent:true,opacity:0.8}),0,0,0,g);mesh(new THREE.CylinderGeometry(0.07,0.07,0.12,8),lam(0x3f8fe0),0,0.37,0,g)}
  else if(kind==='car'){r=0.34;roll=false;lift=0.16;mesh(new THREE.BoxGeometry(0.65,0.2,0.36),lam(pick([0xe9402a,0x3f8fe0,0xf2c14e])),0,0,0,g);mesh(new THREE.BoxGeometry(0.32,0.16,0.3),lam(0xbfe8ff),-0.05,0.17,0,g);for(const[a,b]of[[0.22,0.19],[-0.22,0.19],[0.22,-0.19],[-0.22,-0.19]]){const w=mesh(new THREE.CylinderGeometry(0.09,0.09,0.06,10),lam(0x222222),a,-0.08,b,g);w.rotation.x=Math.PI/2}}
  else if(kind==='slipper'){r=0.36;roll=false;lift=0.07;mesh(new THREE.BoxGeometry(0.75,0.14,0.36),lam(0xf3a5b5),0,0,0,g);mesh(new THREE.BoxGeometry(0.3,0.16,0.38),lam(0xffffff),0.18,0.08,0,g)}
  else if(kind==='block'){r=0.3;roll=false;lift=0.25;mesh(new THREE.BoxGeometry(0.5,0.5,0.5),lam(pick([0xe9785a,0x4f9fb8,0xf2c14e,0x6fa07f])),0,0,0,g)}
  const p={kind,x,z,y,vx:0,vz:0,vy:0,r,rest:0.35,ground:true,step:0.12,roll,lift:roll?r:lift,g,rampCd:0};
  props.push(p);g.position.set(x,y+p.lift,z);return p;
}

function makeLabel(text,color='#ff4f4f'){
  const c=document.createElement('canvas');c.width=256;c.height=96;const g=c.getContext('2d');
  g.fillStyle='#fffaf0';g.strokeStyle='#3a2618';g.lineWidth=8;
  g.beginPath();g.roundRect?g.roundRect(8,8,240,64,30):g.rect(8,8,240,64);g.fill();g.stroke();
  g.beginPath();g.moveTo(112,72);g.lineTo(128,92);g.lineTo(144,72);g.fill();
  g.fillStyle=color;g.font='800 38px "M PLUS Rounded 1c",sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(text,128,42);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));
  s.scale.set(2.6,1,1);s.renderOrder=10;return s;
}
function label(text,x,y,z,color){const s=makeLabel(text,color);s.position.set(x,y,z);stage.add(s);labels.push({s,y});return s}

// ----- textures -----

function tunnel(x,z,len,alongX){
  const R=0.9,g=group();

  const m=new THREE.Mesh(new THREE.CylinderGeometry(R,R,len,24,6,true,0,Math.PI),tunnelMat);
  m.castShadow=true;m.receiveShadow=true;m.rotation.set(Math.PI/2,Math.PI/2,0);inner.add(m);
  for(let i=0;i<=4;i++){
    const r=new THREE.Mesh(new THREE.TorusGeometry(R,0.06,6,24,Math.PI),lam(0xf2c14e));
    r.position.set(0,0,-len/2+i*len/4);inner.add(r);

// cardboard box lying open on one side: hide inside and the cats lose sight of you
function cardboard(x,z,open){
  const S=2.8,h=2.0,t=0.15,g=group();
  const sides={n:[x,z-S/2,S,t],s:[x,z+S/2,S,t],w:[x-S/2,z,t,S],e:[x+S/2,z,t,S]};
  for(const k in sides){
    if(k===open)continue;
    const[a,b,w,d]=sides[k];box(a,b,w,d,h);
    mesh(new THREE.BoxGeometry(w,h,d),lam(0xc89a5e),a,h/2,b,g);
  }
  box(x,z,S,S,h,{solid:false,platform:true});
  mesh(new THREE.BoxGeometry(S+0.1,0.12,S+0.1),lam(0xd4a86a),x,h,z,g);
  mesh(new THREE.BoxGeometry(open==='n'||open==='s'?0.5:S+0.12,0.14,open==='n'||open==='s'?S+0.12:0.5),lam(0xe8d3a8),x,h+0.01,z,g);
  // flaps hanging open
  const [ox,oz]={n:[0,-1],s:[0,1],w:[-1,0],e:[1,0]}[open];
  for(const sgn of[-1,1]){
    const f=mesh(new THREE.BoxGeometry(ox?0.06:S/2,h*0.9,ox?S/2:0.06),lam(0xb8884e),
      x+ox*(S/2+0.45)+(ox?0:sgn*(S/2+0.2)),h*0.45,z+oz*(S/2+0.45)+(oz?0:0)+(ox?sgn*(S/2+0.2):0),g);
    f.rotation.y=(ox?sgn*0.5:sgn*-0.5);
  }
  fadeWhenUnder(g,x,z,S/2,S/2,h);
  hideBoxes.push({x,z,hx:S/2-0.2,hz:S/2-0.2});
  label('ダンボール',x,h+1.4,z,'#8a5a3a');
}

function fan(x,z,dx,dz,bx,bz){

}
function inWind(x,z,y){
  if(!FAN)return false;
  const along=(x-FAN.x)*FAN.dx+(z-FAN.z)*FAN.dz;
  if(along<0.5||along>19||y>4.5)return false;
  const lat=Math.abs((x-FAN.x)*FAN.dz-(z-FAN.z)*FAN.dx);
  return lat<1.6+along*0.2;
}

// ---------- physics helpers ----------
const G=24;
function collide(e,onHit){
  const r=e.r;
  if(e.x<-W+r){hit(e,1,0,onHit,null);e.x=-W+r}
  if(e.x>W-r){hit(e,-1,0,onHit,null);e.x=W-r}
  if(e.z<-D+r){hit(e,0,1,onHit,null);e.z=-D+r}
  if(e.z>D-r){hit(e,0,-1,onHit,null);e.z=D-r}
  for(const o of obs){
    if(!o.solid||e.y>=o.h-0.05||e.y+1.0<=o.b)continue;
    if(o.platform&&e.ground&&o.h-e.y<=(e.step??STEP))continue; // walk up the step
    let nx,nz,pen;
    if(o.t==='circ'){
      const dx=e.x-o.x,dz=e.z-o.z,d=Math.hypot(dx,dz);
      if(d>=r+o.r)continue;
      nx=d?dx/d:1;nz=d?dz/d:0;pen=r+o.r-d;
    }else{
      const cx=clamp(e.x,o.x-o.hx,o.x+o.hx),cz=clamp(e.z,o.z-o.hz,o.z+o.hz);
      const dx=e.x-cx,dz=e.z-cz,d=Math.hypot(dx,dz);
      if(d>=r)continue;
      if(d>0){nx=dx/d;nz=dz/d;pen=r-d}
      else{
        const px=o.hx-Math.abs(e.x-o.x),pz=o.hz-Math.abs(e.z-o.z);
        if(px<pz){nx=Math.sign(e.x-o.x)||1;nz=0;pen=px+r}else{nx=0;nz=Math.sign(e.z-o.z)||1;pen=pz+r}
      }
    }
    e.x+=nx*pen;e.z+=nz*pen;
    hit(e,nx,nz,onHit,o);
  }
}
function hit(e,nx,nz,onHit,o){
  const vn=e.vx*nx+e.vz*nz;
  if(vn>=0)return;
  const rest=o&&o.bouncy?1.35:e.rest;
  e.vx-=(1+rest)*vn*nx;e.vz-=(1+rest)*vn*nz;
  if(onHit)onHit(-vn,o,nx,nz);
}
function support(e,prevY,step){
  let s=0,so=null;
  for(const o of obs){
    if(!o.platform||o.h>prevY+step)continue;
    const inside=o.t==='circ'?Math.hypot(e.x-o.x,e.z-o.z)<o.r:Math.abs(e.x-o.x)<o.hx&&Math.abs(e.z-o.z)<o.hz;
    if(inside&&o.h>s){s=o.h;so=o}
  }
  e.supObj=so;
  return s;
}
function vertical(e,dt){
  const prevY=e.y;
  e.vy-=G*dt;e.y+=e.vy*dt;
  const s=support(e,prevY,e.ground?(e.step??STEP):0.08);
  if(e.y<=s){
    const land=e.vy;
    e.y=s;
    const so=e.supObj;
    if(so&&so.tramp&&e.onTramp){const q=so.t==='circ'?Math.min(1,Math.hypot(e.x-so.x,e.z-so.z)/so.r):0.55;if(e.onTramp(land,q)){e.ground=false;trampSquash=Math.max(trampSquash,0.3);return}}
    if(land<-9&&e.bounceLand){e.vy=-land*0.35}else{e.vy=0}
    if(!e.ground&&land<-4&&e.onLand)e.onLand(land);
    e.ground=e.vy===0;
  }else e.ground=false;
}
function tryRamp(e){
  if(!e.ground||e.rampCd>0)return false;
  for(const r of ramps){
    if(Math.abs(e.y-r.y)<0.15&&Math.abs(e.x-r.x)<r.hx&&Math.abs(e.z-r.z)<r.hz){
      const along=e.vx*r.dx+e.vz*r.dz;
      if(along>1.2){
        const perpX=e.vx-along*r.dx,perpZ=e.vz-along*r.dz;
        const sp=Math.max(r.sp,Math.min(along,r.sp*1.15));
        e.vx=r.dx*sp+perpX*0.3;e.vz=r.dz*sp+perpZ*0.3;e.vy=r.vy;e.ground=false;e.rampCd=0.6;
        return true;
      }
    }
  }
  return false;
}

let ac=null,muted=false;
function tone(f,d,type='square',vol=.07,slide=0,delay=0){
  if(muted)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+delay;
    o.type=type;o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02);
  }catch(e){}
}
// cat voices: a sawtooth through a moving band-pass filter sounds like "mi-a-o"
function meow(p=600,len=0.5,vol=0.12){
  if(muted)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
    const t=ac.currentTime,o=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain(),lfo=ac.createOscillator(),lg=ac.createGain();
    o.type='sawtooth';
    o.frequency.setValueAtTime(p*0.8,t);o.frequency.linearRampToValueAtTime(p*1.3,t+len*0.3);o.frequency.linearRampToValueAtTime(p*0.75,t+len);
    lfo.frequency.value=7;lg.gain.value=p*0.03;lfo.connect(lg).connect(o.frequency);
    f.type='bandpass';f.Q.value=4;
    f.frequency.setValueAtTime(800,t);f.frequency.linearRampToValueAtTime(2000,t+len*0.35);f.frequency.linearRampToValueAtTime(900,t+len);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.04);g.gain.setValueAtTime(vol,t+len*0.7);g.gain.exponentialRampToValueAtTime(0.0001,t+len);
    o.connect(f).connect(g).connect(ac.destination);o.start(t);lfo.start(t);o.stop(t+len+0.05);lfo.stop(t+len+0.05);
  }catch(e){}
}
function hiss(vol=0.09,len=0.6){
  if(muted)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
    const t=ac.currentTime,n=Math.floor(ac.sampleRate*len),buf=ac.createBuffer(1,n,ac.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    const src=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
    src.buffer=buf;f.type='highpass';f.frequency.value=2800;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.08);g.gain.exponentialRampToValueAtTime(0.0001,t+len);
    src.connect(f).connect(g).connect(ac.destination);src.start(t);
  }catch(e){}
}

function toWorld(sx,sy){      // screen right/down -> world x/z, relative to the camera
  const fx=Math.sin(camA),fz=-Math.cos(camA),rx=-fz,rz=fx;
  return [rx*sx-fx*sy, rz*sx-fz*sy];
}          // impulses waiting for the next physics step

function push(dx,dy,dtMs){
  const L=Math.hypot(dx,dy);if(L<12)return;
  const speed=L/Math.max(16,dtMs)*1000;           // px per second
  const power=clamp(1.3+speed/1000,1.3,3.4);
  const [wx,wz]=toWorld(dx/L,dy/L);pendX+=wx*power;pendZ+=wz*power;
  showTrail(dx,dy);
}

  if(!sw)return;
  const L=Math.hypot(dx,dy);
  trail.style.left=sw.x+'px';trail.style.top=sw.y+'px';
  trail.style.width=Math.min(160,L)+'px';
  trail.style.transform=`rotate(${Math.atan2(dy,dx)}rad)`;
  trail.style.opacity=1;clearTimeout(showTrail.t);showTrail.t=setTimeout(()=>trail.style.opacity=0,180);
}

function update(dt){
  if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').style.opacity=0}
  if(shake>0)shake-=dt;
  if(state==='menu'){idleCats(dt);return}
  if(state==='caught'){
    caughtT+=dt;
    // the punched ball flies off
    ball.x+=ball.vx*dt;ball.z+=ball.vz*dt;collide(ball,null);vertical(ball,dt);
    if(ball.ground){ball.vx*=Math.pow(0.2,dt);ball.vz*=Math.pow(0.2,dt)}
    caughtBy.punchT=(caughtBy.punchT||0)-dt;
    if(caughtT>1.6)gameOver();
    return;
  }
  if(state!=='play')return;
  time+=dt;stageTime+=dt;if(inv>0)inv-=dt;
  if(Math.floor(time*10)!==Math.floor((time-dt)*10))updateHud();
  if(!doorOpen&&stageTime>=STAGE_SECS){doorOpen=true;toast('ドアが ひらいた！ ドアへ いそげ！',2);[784,988,1175].forEach((f,i)=>tone(f,.12,'square',.05,0,i*.09));updateHud()}

  const inBox=ball.y<0.5&&hideBoxes.some(h=>Math.abs(ball.x-h.x)<h.hx&&Math.abs(ball.z-h.z)<h.hz);
  if(inBox){if(hideT===0){toast('かくれた！',1.2)}hideT+=dt}else{hideT=0;foundToast=false}
  hiddenSafe=inBox&&hideT<5;
  if(inBox&&hideT>=5&&!foundToast){foundToast=true;toast('みつかった！',1.2);cats.forEach(c=>meow(c.voice,0.3,0.07))}

  if(churu.st==='none'){churu.next-=dt;if(churu.next<=0){churu.next=rand(20,35);if(Math.random()<0.6)spawnChuru()}}
  else if(churu.st==='ground'){
    churu.t-=dt;
    if(churu.t<=0)churu.st='none';
    else if(Math.hypot(ball.x-churu.x,ball.z-churu.z)<1.0&&Math.abs(ball.y-churu.y)<1){churu.st='held';toast('ちゅ〜る ゲット！ タップで おけるよ',1.8);tone(990,.08,'square',.05);tone(1320,.12,'square',.05,0,.07);updateItem()}
  }else if(churu.st==='placed'){

    if(churu.t<=0){churu.st='none';cats.forEach(c=>{if(c.state==='eat')c.state='chase'})}
  }
  const diff=0.82+Math.min(0.4,time/100)+Math.min(0.3,cleared*0.06);
  const ready=stageTime>1.5;

function updateProps(dt){
  for(const p of props){
    // ball pushes things
    const dx=p.x-ball.x,dz=p.z-ball.z,dy=(p.y+p.r)-(ball.y+BALL_R),d=Math.hypot(dx,dz);
    if(d<p.r+BALL_R+0.05&&Math.abs(dy)<p.r+BALL_R){
      const nx=d?dx/d:1,nz=d?dz/d:0,bs=Math.hypot(ball.vx,ball.vz);
      const vn=(ball.vx-p.vx)*nx+(ball.vz-p.vz)*nz;
      if(vn>0){p.vx+=nx*vn*1.6+ball.vx*0.3;p.vz+=nz*vn*1.6+ball.vz*0.3;if(bs>3){p.vy=Math.max(p.vy,1.5+bs*0.25);p.ground=false}ball.vx*=0.85;ball.vz*=0.85;if(bs>2)tone(500+Math.random()*300,.05,'triangle',.04)}
      p.x=ball.x+nx*(p.r+BALL_R+0.06);p.z=ball.z+nz*(p.r+BALL_R+0.06);
    }
    // cats kick things, and fast flying things knock cats over
    for(const c of cats){
      const cx=p.x-c.x,cz=p.z-c.z,cd=Math.hypot(cx,cz),hy=p.y-c.y;
      if(cd<p.r+c.r&&hy>-0.4&&hy<1.6){
        const nx=cd?cx/cd:1,nz=cd?cz/cd:0;
        const ps=Math.hypot(p.vx,p.vz),toward=-(p.vx*nx+p.vz*nz);
        if(c.state!=='stun'&&(toward>5||(p.vy<-5&&hy>0.6))){stunCat(c,8,-nx,-nz,pick(['ゴチン！','コツン！','あたった！']));p.vx*=-0.3;p.vz*=-0.3}
        else{const cs=Math.hypot(c.vx,c.vz),k=Math.max(ps*0.5,cs*1.2+1);p.vx=nx*k;p.vz=nz*k;if(cs>3){p.vy=Math.max(p.vy,2);p.ground=false}}
        p.x=c.x+nx*(p.r+c.r+0.02);p.z=c.z+nz*(p.r+c.r+0.02);
      }
    }
    if(p.ground&&!p.vx&&!p.vz&&!p.vy)continue; // resting
    p.x+=p.vx*dt;p.z+=p.vz*dt;
    collide(p,(sp,o)=>{if(o&&o.tv&&sp>3)tvOn();if(sp>3)tone(300+Math.random()*200,.05,'triangle',.03)});
    if(!p.onLand)p.onLand=(land)=>{if(land<-8){tone(220,.08,'triangle',.06,-80)}};
    p.bounceLand=true;
    vertical(p,dt);

    if(p.ground){const f=Math.pow(p.windT>0?0.7:(p.roll?0.45:0.03),dt);p.vx*=f;p.vz*=f;if(Math.abs(p.vx)+Math.abs(p.vz)<0.05){p.vx=p.vz=0}}

    const a=props[i],b=props[j];if(Math.abs(a.y-b.y)>0.6)continue;

  }
}
function pick(a){return a[Math.floor(Math.random()*a.length)]}

function sync(dt){

    const m=c.m;
    m.root.position.set(c.x,c.y,c.z);
    const csp=Math.hypot(c.vx,c.vz);
    if(c.state==='windup'||c.state==='leap'){
      if(c.state==='leap')c.aim=Math.atan2(c.vx,c.vz);
      let dh=c.aim-c.heading;while(dh>Math.PI)dh-=Math.PI*2;while(dh<-Math.PI)dh+=Math.PI*2;
      c.heading+=dh*Math.min(1,dt*12);
    }else if(c.state!=='stun'&&csp>0.3){
      const target=Math.atan2(c.vx,c.vz);
      let dh=target-c.heading;while(dh>Math.PI)dh-=Math.PI*2;while(dh<-Math.PI)dh+=Math.PI*2;
      c.heading+=dh*Math.min(1,dt*10);
    }
    m.root.rotation.y=c.heading;
    if(c.state==='stun'){
      if(!c.ground){m.body.rotation.z+=c.spin*dt;m.body.rotation.x+=c.spin*0.4*dt}
      else{ // lying on its back, legs up
        m.body.rotation.z+=(Math.PI-m.body.rotation.z%(Math.PI*2))*Math.min(1,dt*8);
        m.body.rotation.x*=0.85;
      }
      m.body.position.y=c.ground?0.95:0.5;
      m.stars.visible=c.ground;m.stars.rotation.y=now*6;
      m.legs.forEach((l,i)=>l.rotation.x=Math.sin(now*20+i)*0.5);
    }else{
      if(c.state==='chase'&&!c.ground&&c.spin){m.body.rotation.z+=c.spin*dt;if(c.ground)c.spin=0}
      else{m.body.rotation.z=0}
      if(c.ground)c.spin=0;
      m.body.rotation.x=c.ground?0:-0.4;
      m.body.position.y=0;m.stars.visible=false;
      c.phase+=dt*(4+csp*1.6);
      const amp=Math.min(1,csp/4)*0.9;
      m.legs[0].rotation.x=Math.sin(c.phase)*amp;m.legs[3].rotation.x=Math.sin(c.phase)*amp;
      m.legs[1].rotation.x=-Math.sin(c.phase)*amp;m.legs[2].rotation.x=-Math.sin(c.phase)*amp;
      m.body.position.y=Math.abs(Math.sin(c.phase))*0.08*amp;
    }
    m.warn.visible=c.state==='windup';
    m.body.rotation.y=0;
    if(c.state==='windup'){
      const k=Math.min(1,(1-Math.max(0,c.t))*2.5); // 0 → 1 at the start of the wind-up
      m.warn.scale.setScalar(0.5+0.2*Math.sin(now*20));m.body.rotation.z=0;
      if(c.kind==='long'){ // raise a front paw
        m.legs[0].rotation.x=-2.5*k+Math.sin(now*30)*0.08;m.body.rotation.x=-0.35*k;m.body.position.y=0;
      }else if(c.kind==='cap'){ // butt wiggle: front low, rear swinging
        m.body.rotation.x=0.3*k;m.body.rotation.y=Math.sin(now*26)*0.3*k;m.body.position.y=-0.1*k;
        m.legs.forEach(l=>l.rotation.x=0);
      }else{ // black: crouch low and charge
        m.body.rotation.x=0.1*k;m.body.position.y=-0.25*k+Math.sin(now*40)*0.02;
        m.legs.forEach((l,i)=>l.rotation.x=i<2?-0.6*k:0.6*k);
      }
    }else if(c.state==='leap'){
      m.body.rotation.x=c.vy>0?-0.45:0.45;m.body.rotation.z=0;m.body.position.y=0;
      m.legs[0].rotation.x=m.legs[1].rotation.x=-1.4;m.legs[2].rotation.x=m.legs[3].rotation.x=1.2;
    }else if((c.punchT||0)>0){
      m.legs[0].rotation.x=-1.5;m.body.rotation.x=0.3;
    }
    m.tail.forEach((s,i)=>{s.rotation.x=i===0?0.9:0.18;s.rotation.y=Math.sin(now*5+i*0.7+c.phase*0.2)*0.25});
    m.head.rotation.y=Math.sin(now*1.3+c.start[0])*0.1;
  }
  // tables, book bridge and tunnels turn see-through while the ball is under them
  for(const r of roofs){
    const under=Math.abs(ball.x-r.x)<r.hx+0.4&&Math.abs(ball.z-r.z)<r.hz+0.4&&ball.y<r.top-0.3;
    const target=under?0.3:1;
    for(const m of r.mats){m.opacity+=(target-m.opacity)*Math.min(1,dt*8);m.depthWrite=m.opacity>0.95}
  }
  // gimmick visuals
  if(FAN){FAN.angle+=dt*(FAN.on>0?28:0);blades.rotation.z=-FAN.angle;btnTop.position.y=FAN.cd>4?0.07:0.15}
  for(const st of streaks){
    st.m.visible=!!FAN&&FAN.on>0;
    if(FAN&&FAN.on>0){
      st.t+=dt*1.2;if(st.t>1)st.t-=1;
      if(!st.lat||st.t<0.05){st.lat=rand(-1,1);st.h=rand(0.4,3.6)}
      const along=1+st.t*18;
      st.m.position.set(FAN.x+FAN.dx*along,st.h,FAN.z+st.lat*(1.4+along*0.18));
    }
  }
  if(TV.on>0&&now-TV.lastDraw>0.08){TV.lastDraw=now;drawTV(now)}
  trampSquash*=Math.pow(0.004,dt);if(TRAMP){trampMat.position.y=TRAMP.h-0.03-trampSquash*0.6;trampMat.scale.set(1,1+trampSquash*4,1)}
  updateBursts(dt);
  for(const p of props){
    p.g.position.set(p.x,p.y+p.lift,p.z);
    const sp=Math.hypot(p.vx,p.vz);
    if(p.roll){if(sp>0.01){_axis.set(p.vz,0,-p.vx).normalize();p.g.rotateOnWorldAxis(_axis,sp*dt/p.r)}}
    else if(!p.ground){p.g.rotation.x+=dt*6;p.g.rotation.y+=sp*dt}else{p.g.rotation.x=0;p.g.rotation.y+=sp*dt*1.5}
  }
  // door glow
  if(doorMat){const k=doorOpen?0.5+0.5*Math.sin(now*6):0;doorMat.emissive.setRGB(k*0.9,k*0.7,0);if(doorLabel)doorLabel.visible=doorOpen}
  // churu
  churuG.visible=churu.st!=='none';
  if(churu.st==='held'){churuG.position.set(ball.x,ball.y+0.9,ball.z);churuG.scale.setScalar(0.6);churuG.getObjectByName('label').visible=false;churuG.getObjectByName('glow').visible=false}
  else if(churu.st!=='none'){churuG.position.set(churu.x,churu.y+(churu.st==='ground'?0.2+Math.sin(now*4)*0.15:0),churu.z);churuG.scale.setScalar(1);churuG.getObjectByName('label').visible=churu.st==='ground';const gl=churuG.getObjectByName('glow');gl.visible=true;gl.rotation.z=now*2}
  churuG.rotation.y=now*1.5;
  for(const c of cats){
    c.m.qm.visible=hiddenSafe&&c.state==='chase';
    if(c.state==='eat'&&Math.hypot(c.vx,c.vz)<0.3){
      c.heading=Math.atan2(churu.x-c.x,churu.z-c.z);c.m.root.rotation.y=c.heading;
      c.m.legs.forEach(l=>l.rotation.x=0);c.m.body.rotation.x=0.35;c.m.head.rotation.x=0.3+Math.sin(now*14)*0.25;
    }else c.m.head.rotation.x=0;
  }
  for(const l of labels)l.s.position.y=l.y+Math.sin(now*3)*0.15;
  // cats watching TV sit still facing it
  for(const c of cats)if(c.state==='tv'&&Math.hypot(c.vx,c.vz)<0.3){c.heading+=(Math.PI/2-c.heading)*Math.min(1,dt*6);c.m.root.rotation.y=c.heading;c.m.legs.forEach(l=>l.rotation.x=0);c.m.body.rotation.x=0.35}
  // markers for cats off screen
  const mks=document.querySelectorAll('.mk');
  cats.forEach((c,i)=>{
    const el=mks[i];
    if(state==='menu'){el.hidden=true;return}
    const v=new THREE.Vector3(c.x,c.y+1,c.z).project(camera);
    let x=v.x,y=v.y;const behind=v.z>1;
    if(behind){x=-x;y=-y}
    if(!behind&&Math.abs(x)<0.95&&Math.abs(y)<0.95){el.hidden=true;return}
    if(behind&&Math.abs(y)<1)y=-1.2;
    const k=0.9/Math.max(Math.abs(x),Math.abs(y));x*=k;y*=k;
    el.hidden=false;el.style.left=((x+1)/2*innerWidth)+'px';el.style.top=((1-y)/2*innerHeight)+'px';
  });
  { // door marker when the door is open and off screen
    const el=$('mkd');
    if(!doorOpen||!DOOR||state!=='play'){el.hidden=true}
    else{
      const v=new THREE.Vector3(DOOR.x,2,DOOR.z).project(camera);let x=v.x,y=v.y;const behind=v.z>1;
      if(behind){x=-x;y=-y}
      if(!behind&&Math.abs(x)<0.95&&Math.abs(y)<0.95){el.hidden=true}
      else{if(behind&&Math.abs(y)<1)y=-1.2;const k=0.9/Math.max(Math.abs(x),Math.abs(y));x*=k;y*=k;el.hidden=false;el.style.left=((x+1)/2*innerWidth)+'px';el.style.top=((1-y)/2*innerHeight)+'px'}
    }
  }
  // camera
  const portrait=innerWidth<innerHeight;
  camY+=(ball.y-camY)*Math.min(1,dt*3);
  if(state==='play'||state==='menu'){
    const sp=Math.hypot(ball.vx,ball.vz);
    if(sp>2){
      const fx=Math.sin(camA),fz=-Math.cos(camA);
      const fwd=(ball.vx*fx+ball.vz*fz)/sp;
      if(fwd>-0.4||sp>6){ // rolling slowly backwards does not spin the camera around
        let d=Math.atan2(ball.vx,-ball.vz)-camA;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;
        camA+=d*Math.min(1,dt*(state==='menu'?1:2.2)*Math.min(1,sp/6));
      }
    }
  }
  const fx=Math.sin(camA),fz=-Math.cos(camA);
  const dist=portrait?8:6.8,hgt=portrait?4.6:3.6;
  const cx=clamp(ball.x-fx*dist,-W+0.6,W-0.6),cz=clamp(ball.z-fz*dist,-D+0.6,D-0.6);
  const short=dist-Math.hypot(cx-ball.x,cz-ball.z); // camera pushed in by a wall → lift it up instead
  const tp=new THREE.Vector3(cx,camY+hgt+short*0.9,cz),tl=new THREE.Vector3(ball.x+fx*3,camY+0.6,ball.z+fz*3);
  if(camSnap){camPos.copy(tp);camLook.copy(tl);camSnap=false}
  camPos.lerp(tp,Math.min(1,dt*5));camLook.lerp(tl,Math.min(1,dt*6));
  camera.position.copy(camPos);
  if(shake>0)camera.position.add(new THREE.Vector3(rand(-.15,.15),rand(-.15,.15),0));
  camera.lookAt(camLook);
}

// ---------- loop ----------
sel=0;reset();state='menu';
let last=performance.now();
function frame(now){
  const dt=Math.min(1/30,(now-last)/1000);last=now;
  if(!document.hidden){
    const steps=2;for(let i=0;i<steps;i++)update(dt/steps);
    sync(dt);renderer.render(scene,camera);
    if(!frame.shown){frame.shown=true;$('loading').hidden=true;$('menu').hidden=false;}
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('../sw.js').catch(()=>{}));</script>
